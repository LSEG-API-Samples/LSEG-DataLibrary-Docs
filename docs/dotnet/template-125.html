<h1 id="about-omm-stream-objects">About OMM stream objects</h1>
<p>OMM streams are used to subscribe to streaming items of any Domain Model (e.g. MarkePrice, MarketByPrice...) exposed by the underlying <a href="https://developers.refinitiv.com/elektron/websocket-api">WebSocket protocol</a> of the Data Platform.</p>
