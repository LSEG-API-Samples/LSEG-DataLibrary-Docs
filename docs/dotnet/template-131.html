<h1 id="state">State</h1>
<p>Each stream can report different states during its lifecycle.</p>
<table>
<thead>
<tr>
<th><strong>State</strong></th>
<th><strong>Description</strong></th>
</tr>
</thead>
<tbody><tr>
<td>State.Pending</td>
<td>The stream is waiting to be opened or closed.</td>
</tr>
<tr>
<td>State.Opened</td>
<td>The stream is open and ready to work.</td>
</tr>
<tr>
<td>State.Closed</td>
<td>The stream is closed.</td>
</tr>
</tbody></table>
