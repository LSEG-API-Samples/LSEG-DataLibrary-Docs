<h1 id="qos---quality-of-service-types">QoS - Quality of Service types</h1>
<p>The quality of service (QoS) is used to define if the definition should retrieve delayed or real time data. </p>
<table>
<thead>
<tr>
<th><strong>Value</strong></th>
</tr>
</thead>
<tbody><tr>
<td>&#39;delayed&#39;</td>
</tr>
</tbody></table>
<br>
If the option is not specified, the QoS will be the one set on the server. 
<br>
Some instruments might only have delayed data available.
