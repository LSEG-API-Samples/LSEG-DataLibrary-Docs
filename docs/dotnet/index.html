.com/data/historical-pricing/v1/views/intraday-summaries/EUR=?interval=PT1H&quot;;\nvar interdayEndpoint = &quot;https://api.refinitiv.com/data/historical-pricing/v1/views/interday-summaries&quot;;\n\nusing (ISession session = Sessions.GetSession())\n{\n    if (session.Open() == Session.State.Opened)\n    {\n        // Intraday Summaries - single instrument\n        var response = EndpointRequest.Definition(intradayEndpoint).GetData();\n\n        // Single Interday Summary - multiple instruments\n        response = EndpointRequest.Definition(interdayEndpoint)\n                                  .Method(EndpointRequest.Method.POST)\n                                  .BodyParameters(new JObject()\n                                  {\n                                      [&quot;fields&quot;] = new JArray(&quot;BID&quot;, &quot;ASK&quot;),\n                                      [&quot;universe&quot;] = new JArray(&quot;EUR=&quot;, &quot;CAD=&quot;, &quot;CHF=&quot;),\n                                      [&quot;end&quot;] = &quot;2022-01-01&quot;\n                                  })\n                                  .GetData();\n    }\n}\n</code></pre>\n"},{"location":"./sections/delivery-layer/endpoint-request/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-delivery-endpointrequest\">About Delivery EndpointRequest</h1>\n<p><strong>EndpointRequest</strong> is an ease of use wrapper around the Data (request/response) delivery mechanism of the platform.</p>\n"},{"location":"./sections/delivery-layer/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-the-delivery-layer\">About the Delivery Layer</h1>\n<p>The Delivery layer provides objects allowing your application to interact with the Delivery Platform (formerly Refinitiv Data Platform) data service via the following delivery modes:</p>\n<ul>\n<li>  Request (HTTP Request/Response)</li>\n<li>  Stream (WebSockets)</li>\n<li>  Queue (Alerts)</li>\n<li>  Files (bulk)</li>\n</ul>\n<p>Every data service exposes one or several of these delivery modes to make its data available to client applications. For each of these delivery modes, the Delivery layer defines classes that can be used to easily retrieve data from these data services in raw JSON format.</p>\n<p>Classes defined in the Delivery layer do not dependent on any specific data service exposed by the Data Platform. They are service agnostic, meaning that you can use them to access to any service available on the platform.</p>\n<p>Designed as the lowest abstraction layer, the Delivery layer targets developers who need specific features that are not offered by other higher level abstraction layers (<a href=\"#/sections/content-layer/intro\">Content</a> &amp; Function). This layer targets professional developers but can also be used by financial coders with good programming skills.</p>\n<p>In order to use the Delivery layer for a specific service of the Data Platform (formerly Refinitiv Data Platform), you need to understand the different message formats, protocols and possible interactions available for the service. These details are described for each individual service in the Data Platform <a href=\"https://apidocs.refinitiv.com/Apps/ApiDocs\">API Playground</a>.</p>\n"},{"location":"./sections/delivery-layer/omm-stream/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"deliveryommstream-object\">Delivery.OMMStream object</h1>\n<p>Creates a definition that can be used to get an <code>IOMMItemStream</code> (see below) that can be used to subscribe to streaming items of any Domain Model (e.g. MarkePrice, MarketByPrice...) exposed by the underlying <a href=\"https://developers.refinitiv.com/elektron/websocket-api\">WebSocket protocol</a> of the Delivery Platform (formerly Refinitiv Data Platform).</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Delivery.OMMStream.Definition()</code><br>\n<code>Delivery.OMMStream.Definition(params string[] items)</code><br>\n<code>Delivery.OMMStream.Definition(IEnumerable&lt;string&gt; items)</code><br></p>\n<h3 id=\"methods\">Methods</h3>\n<p><strong>Api(OMMStream.Api api)</strong><br>\n<strong>Api(string api)</strong><br>\nThe streaming API service supporting the OMM streaming data.</p>\n<p><strong>Name(params string[] itemNames)</strong><br>\n<strong>Name(IEnumerable<string> itemNames)</strong><br>\nThe collection of item names of interest.  Eg: AAPL.O (RIC)</p>\n<p><strong>Fields(params string[] fields)</strong><br>\n<strong>Fields(IEnumerable<string> fields)</strong><br>\nSpecify a subset of fields from the service to be delivered.<br>\nEg: Fields(BID&quot;, &quot;BIDSIZE&quot;, &quot;ASK&quot;, &quot;ASKSIZE&quot;, &quot;TRDPRC_1&quot;, &quot;TRDVOL_1&quot;)</p>\n<p><strong>Service(string service)</strong><br>\nThe streaming platform can optionally manage the realtime streaming data through multiple, configured services.<br>As such, this interfaces offers the ability to override the default.</p>\n<p><strong>Domain(string domain)</strong><br>\nThe domain for the specific data of interest.  For example, MarketPrice, MarketByPrice, MarketByOrder, etc.  <br>\nRefer to the WebSockets documentation for all defined domains. Default: MarketPrice.</p>\n<p><strong>EnablePlugin(FieldEngineType fieldEngineType)</strong><br>\n<strong>DisablePlugin(FieldEngineType fieldEngineType)</strong><br>\nEnable or disable a specific plugin within the streaming services. Only takes effect if plugin usage is enabled via <code>UsePlugins(true)</code>. By default, all plugins are enabled for a DesktopDirect session and disabled for all other session types; each item stream can have its own set of plugins enabled or disabled.</p>\n<p><strong>UsePlugins(bool usePlugins)</strong><br>\nEnable or disable the use of plugins within the streaming services for this item stream. Optional.</p>\n<p><strong>ExtendedParams(JObject obj)</strong>\nThe streaming platform can offer a multitude of properties, depending on how the enviroment is configured. <br>\nIn most cases, the default streaming environment is suitable for delivery.  However, there may be some\nrare cases where applications may need to define properties that are less commonly used.  The extended \nparams specification provides this capability.  To extend, applications must form the request properties \nas defined within the WebSocket Request specifications.  If extended properties are included, they will \nbe merged with all other properties specified.</p>\n<p>The possible values for the <strong>EndpointRequest.Api</strong>:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Pricing</td>\n<td>Stream Market Data instruments.</td>\n</tr>\n<tr>\n<td>CustomInstruments</td>\n<td>Stream user-defined custom instruments.</td>\n</tr>\n</tbody></table>\n<p><strong>GetStream()</strong><br>\n<strong>GetStream(ISession session)</strong><br>\nRetrieve an <code>IOMMItemStream</code> to manage real-time updates for the specified items. When a session is not explicitly supplied, the default session is used.</p>\n<p><strong>Properties</strong> <em>(property, <code>IOMMStreamDefinitionParams</code>)</em><br>\nRetrieve the parameters defined for the streaming request.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IOMMStreamDefinition</code> object.</p>\n<h3 id=\"iommitemstream-members\">IOMMItemStream members</h3>\n<p><code>GetStream()</code> / <code>GetStream(session)</code> return an <code>IOMMItemStream</code>, used to manage the life cycle of the subscription and register callbacks.</p>\n<p><strong>Close(params string[] items)</strong><br>\n<strong>Close(IEnumerable&lt;string&gt; items)</strong><br>\n<strong>CloseAsync(params string[] items)</strong><br>\n<strong>CloseAsync(IEnumerable&lt;string&gt; items)</strong><br>\nClose the specified items. Default: all open streams will be closed.</p>\n<p><strong>Streaming(bool streaming)</strong><br>\nA value of <code>true</code> instructs the stream to deliver the initial image followed by updates as market conditions change. A value of <code>false</code> instructs the stream to deliver only the initial image, or snapshot. Optional. Default: <code>true</code>.</p>\n<p><strong>OnRefresh(Action&lt;string, JObject, IOMMItemStream&gt; cb)</strong><br>\nOptional callback invoked upon receiving a Refresh message containing the fields.</p>\n<p><strong>OnUpdate(Action&lt;string, JObject, IOMMItemStream&gt; cb)</strong><br>\nOptional callback invoked upon receiving an Update message containing the fields.</p>\n<p><strong>OnStatus(Action&lt;string, JObject, IOMMItemStream&gt; statusCb)</strong><br>\nOptional callback invoked when a status event occurs for the specified item.</p>\n<p><strong>OnComplete(Action&lt;IOMMItemStream&gt; cb)</strong><br>\nOptional callback invoked when the request to open the stream has completed (typically once the complete item image and/or item status messages have been received for all requested items).</p>\n<p><strong>OnError(Action&lt;string, JObject, IOMMItemStream&gt; errorCb)</strong><br>\nOptional callback invoked if an error occurs resulting from the request.</p>\n<p><strong>Definition</strong> <em>(property, <code>IOMMStreamDefinitionParams</code>)</em><br>\nRetrieve the parameters defined for the streaming request.</p>\n<p><code>IOMMItemStream</code> also implements the shared <strong>IStream</strong> interface, common to every streaming interface in the library (<code>IOMMItemStream</code>, <code>IRDPItemStream</code>, and the content-layer streams), contributing:</p>\n<p><strong>Open(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream synchronously. Request the data from the platform and wait until all initial responses have arrived. Returns a <code>Stream.State</code> value (see <a href=\"#/sections/delivery-layer/state\">State</a>).</p>\n<p><strong>OpenAsync(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream asynchronously.</p>\n<p><strong>Close()</strong><br>\n<strong>CloseAsync()</strong><br>\nClose all opened resources for the stream (equivalent to <code>Close()</code>/<code>CloseAsync()</code> with no items - see above for closing specific items).</p>\n<p><strong>OpenState</strong> <em>(property, <code>Stream.State</code>)</em><br>\nIndicates if the stream is open with active streaming items.</p>\n<p><strong>Session</strong> <em>(property, <code>ISession</code>)</em><br>\nSession used to open the stream.</p>\n<h4 id=\"usage\">Usage</h4>\n<p>The following example demonstrates how to create an OMM stream definition and capture snapshot data:</p>\n<pre><code class=\"language-csharp\">// Request a snapshot for the Canadian Dollar.\nvar stream = OMMStream.Definition(&quot;CAD=&quot;)\n                      .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;HIGH_1&quot;, &quot;LOW_1&quot;)\n                      .GetStream().OnRefresh((a, b, c) =&gt; {})\n                      .OnStatus((a, b, c) =&gt; {});\n\n// By setting streaming the false, we are requesting only a snapshot of the historical data \n// without any incoming streaming updates \nstream.Streaming(false).Open();\n</code></pre>\n<p>The following example demonstrates how to create an OMM stream with multiple registered callbacks and request stream data: </p>\n<pre><code class=\"language-csharp\">var stream1 = OMMStream.Definition(&quot;EUR=&quot;)\n                        .GetStream()\n                        .OnRefresh((item, msg, s) =&gt; Console.WriteLine($&quot;{DateTime.Now}:{msg}&quot;))\n                        .OnUpdate((item, msg, s) =&gt; DumpMsg(item, msg))\n                        .OnStatus((item, msg, s) =&gt; Console.WriteLine($&quot;{DateTime.Now} =&gt; Status1: {msg}&quot;))\n                        .OnError((item, msg, s) =&gt; Console.WriteLine($&quot;Stream1 error: {DateTime.Now}:{msg}&quot;));\n</code></pre>\n<p>The following example demonstrates how to request bulk snapshot data using the OMM Stream:  </p>\n<pre><code class=\"language-csharp\">// Read in the batch of items to request for\nvar items =  new List&lt;string&gt; { &quot;.A1UTI&quot;, &quot;.A3DOW&quot;, &quot;.A4DOW&quot;, &quot;.AAPIDX&quot; };\n\nvar stream = OMMStream.Definition(items)\n                      .GetStream()\n                      .OnComplete(s =&gt; Console.WriteLine(&quot;Bulk request completed&quot;));\n \nstream.Streaming(false).Open();\n</code></pre>\n"},{"location":"./sections/delivery-layer/omm-stream/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-omm-stream-objects\">About OMM stream objects</h1>\n<p>OMM streams are used to subscribe to streaming items of any Domain Model (e.g. MarkePrice, MarketByPrice...) exposed by the underlying <a href=\"https://developers.refinitiv.com/elektron/websocket-api\">WebSocket protocol</a> of the Data Platform.</p>\n"},{"location":"./sections/delivery-layer/queue/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"deliveryqueuequeue-object\">Delivery.Queue.Queue object</h1>\n<p>A class providing queueing capabilities for Research, News headlines and stories. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Delivery.Queue.Definition()</code><br>\n<code>Delivery.Queue.Definition(string endpointUrl)</code><br>\nDefine the queue properties to manage and retrieve messages from queues defined within the cloud.<br>\nQueueing capabilities currently support Research, News headlines and stories.</p>\n<p><code>Delivery.Queue.Params()</code><br>\nDefines a request to specify query parameters when retrieving a message queue from the cloud. <br>\nRefer to the &quot;message-services&quot; endpoints within the RDP Playground for the available parameters.<br>\nThis method returns a <strong>ParamsDefinition</strong>.</p>\n<h3 id=\"methods-of-queue-definition\">Methods of Queue definition</h3>\n<p><strong>Endpoint(string endpoint)</strong><br>\n<strong>Endpoint(Uri endpoint)</strong><br>\nA reference to a message queue resource within the cloud. <br>\nThe endpoint URL refers to message queue services such as Research, News Headlines, News Stories, etc.</p>\n<p><strong>CreateQueueManager()</strong><br>\nBased on the specified message queue resource, as defined by the Endpoint specification, \ndefine a queue manager that supports the ability to manage queues within the cloud.</p>\n<p><strong>CreateAWSSubscriber(IQueueNode queue)</strong><br>\nFor the specified queue, create a queue subscriber to pull data from that queue.</p>\n<p><strong>Properties</strong> <em>(property, <code>IQueueDefinitionParams</code>)</em><br>\nRetrieve the parameters defined within the request.</p>\n<h3 id=\"iqueuemanager-members\">IQueueManager members</h3>\n<p><code>CreateQueueManager()</code> returns an <code>IQueueManager</code>, responsible for creating, retrieving and deleting queues in the cloud.</p>\n<p><strong>CreateQueue(JObject criteria = default, Queue.CloudType cloudType = Queue.CloudType.AWS, CancellationToken cancellationToken = default)</strong><br>\n<strong>CreateQueueAsync(...)</strong><br>\nCreate a new queue in the cloud, optionally including additional criteria. Returns the created <code>IQueueNode</code>, or <code>null</code> if an error occurs.</p>\n<p><strong>GetQueue(string subscriptionID, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetQueue(Queue.IParamsDefinition definition, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetQueueAsync(...)</strong><br>\nRetrieve an existing queue based on the subscription ID, optionally with additional criteria. Returns the <code>IQueueNode</code>, or <code>null</code> if an error occurs.</p>\n<p><strong>GetAllQueues(CancellationToken cancellationToken = default)</strong><br>\n<strong>GetAllQueuesAsync(...)</strong><br>\nRetrieve all active queues. Returns the list of active queues, or <code>null</code> if an error occurs.</p>\n<p><strong>DeleteQueue(IQueueNode queue, CancellationToken cancellationToken = default)</strong><br>\n<strong>DeleteQueue(string subscriptionID, CancellationToken cancellationToken = default)</strong><br>\n<strong>DeleteQueueAsync(...)</strong><br>\nDelete an active queue based on the queue node or its subscription ID. Returns <code>true</code> if successfully deleted, <code>false</code> if the queue doesn&#39;t exist.</p>\n<p><strong>DeleteAllQueues(CancellationToken cancellationToken = default)</strong><br>\n<strong>DeleteAllQueuesAsync(...)</strong><br>\nDelete all active queues. Returns <code>true</code> if successfully deleted, <code>false</code> if there were no active queues.</p>\n<p><strong>OnError(Action&lt;JObject, IQueueManager&gt; cb)</strong><br>\nCallback invoked when an error occurs for any action performed on the queue manager.</p>\n<p><strong>Session(ISession session)</strong><br>\nDefine a session associated with all actions on the queue manager. Required.</p>\n<p><strong>Properties</strong> <em>(property, <code>IQueueManagerParams</code>)</em><br>\nProperty details for the manager, including the associated <code>Session</code> and <code>Definition</code>.</p>\n<h3 id=\"iqueuesubscriber-members\">IQueueSubscriber members</h3>\n<p><code>CreateAWSSubscriber(...)</code> returns an <code>IQueueSubscriber</code> (extends <code>ISubscriber</code>), responsible for pulling messages off a queue.</p>\n<p><strong>StartPolling(Action&lt;IQueueResponse, IQueueSubscriber&gt; cb)</strong><br>\n<strong>StartPollingAsync(Action&lt;IQueueResponse, IQueueSubscriber&gt; cb)</strong><br>\n<strong>StartPollingAsync(Func&lt;IQueueResponse, IQueueSubscriber, Task&gt; cb)</strong><br>\nStart polling the queue for messages and dispatch to the supplied callback. Starts a long-running background task that only completes when <code>StopPolling()</code>/<code>StopPollingAsync()</code> is called. Returns whether polling was successfully started.</p>\n<p><strong>GetNextMessage(int timeoutInSeconds = 20, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetNextMessage(int timeoutInSeconds, Action&lt;IQueueResponse, IQueueSubscriber&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetNextMessageAsync(...)</strong><br>\nRetrieve the next message from the queue, waiting up to <code>timeoutInSeconds</code> (default: 20). Returns the response, or <code>null</code> if cancelled.</p>\n<p><strong>StopPolling()</strong><br>\n<strong>StopPollingAsync()</strong><br>\nStop polling the queue for messages. Any messages already in the processing loop will be delivered.</p>\n<h3 id=\"iqueuemessage-and-iqueueresponse-members\">IQueueMessage and IQueueResponse members</h3>\n<p><strong>Raw</strong> <em>(property, <code>IQueueMessage</code>, <code>JToken</code>)</em><br>\nThe native raw JSON data returned from the message queue.</p>\n<p><strong>Data</strong> <em>(property, <code>IQueueResponse</code>, <code>IQueueMessage</code>)</em><br>\nThe data defined within the queue message retrieval, if available.</p>\n<p><strong>Error</strong> <em>(property, <code>IQueueResponse</code>, <code>JObject</code>)</em><br>\nError details if there are any issues processing a queue message response.</p>\n<p><strong>IsMessageAvailable</strong> <em>(property, <code>IQueueResponse</code>, <code>bool</code>)</em><br>\nDetermines if a message is available in the queue. Requests to retrieve a message may time out because no messages are available.</p>\n<p><strong>IsSuccess</strong> <em>(property, <code>IQueueResponse</code>, <code>bool</code>)</em><br>\nIndicator of whether the request was successful.</p>\n<p><strong>RequestMessage</strong> <em>(property, <code>IQueueResponse</code>, <code>JObject</code>)</em><br>\nDetails of the request message including URL, Header and Body details, if available.</p>\n<h3 id=\"methods-and-properties-of-params-definition\">Methods and properties of Params definition</h3>\n<p><strong>QueryParameters(string key, string value)</strong><br>\nApply the specified key/value pair as a Query parameter to the Queue request. <br>\nFor example, a key/value pair such as: &#39;userID&#39;/&#39;user123&#39; will be formed as &quot;userID=user123&quot; within the URL request.</p>\n<p><strong>Query</strong><br>\nThe defined query parameters.</p>\n<p>The possible values for the <strong>Queue.CloudType</strong>:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>AWS</td>\n<td>Amazon Web Services</td>\n</tr>\n</tbody></table>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IQueueDefinition</code> object. <br>\nIn some cases described above, a <code>ParamsDefinition</code> object.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to use a Queue Definition:</p>\n<pre><code class=\"language-csharp\">const string newsStoriesEndpoint = &quot;https://api.refinitiv.com/message-services/v1/news-stories/subscriptions&quot;;\n\nISession session = Sessions.GetSession();\n\nif (session.Open() == Session.State.Opened)\n{\n    var definition = Queue.Definition(newsStoriesEndpoint);\n\n    // Create a QueueManager to actively manage our queues\n    var manager = definition.CreateQueueManager()\n                            .OnError((err, qm) =&gt; Console.WriteLine(err));\n\n    // First, check to see if we have any news headline queues active in the cloud...\n    List&lt;IQueueNode&gt; queues = manager.GetAllQueues();\n\n    // Determine if we retrieved anything...create on if not.  \n    IQueueNode queue = (queues.Count &gt; 0 ? queues[0] : manager.CreateQueue());\n\n    // Ensure our queue is created\n    if (queue != null)\n    {\n        // Start pulling off news headline messages from the queue - we need to define a subscriber\n        var subscriber = definition.CreateAWSSubscriber(queue);\n\n        try\n        {\n            // Open the subscriber to begin polling for messages. Use Async() as this method is a long running task.\n            var task = subscriber.StartPollingAsync((story, s) =&gt; DisplayStory(story));\n\n            // Let the program run for a few seconds before proceeding via key press \n            Console.ReadKey();\n\n            // Close the subscription - stops polling for messages\n            subscriber.StopPolling();\n            task.GetAwaiter().GetResult();\n            Console.Write(&quot;\\nStopped polling for messages from the queue. &lt;Enter&gt; to exit...&quot;);\n        }\n        catch (Exception e)\n        {\n            Console.WriteLine(e);\n        }\n\n        Console.ReadLine();\n    }\n}\n</code></pre>\n"},{"location":"./sections/delivery-layer/queue/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-queue\">About Queue</h1>\n<p>A class providing Queueing capabilities for Research, News headlines and stories</p>\n<h3 id=\"related-links\">Related Links</h3>\n<ul>\n<li><a href=\"#/sections/delivery-layer/queue/definition\">Definition</a></li>\n</ul>\n"},{"location":"./sections/delivery-layer/rdp-stream/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"deliveryrdpstreamdefinition-object\">Delivery.RDPStreamDefinition object</h1>\n<p>Creates a definition used to get an <code>IRDPItemStream</code> (see below) that can subscribe to streaming items of any Domain Model of the Delivery Platform (formerly Refinitiv Data Platform).</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Delivery.RDPStream.Definition()</code></p>\n<h3 id=\"rdp-stream-definition-methods\">RDP Stream Definition methods</h3>\n<p><strong>Api(RDPStream.Api api)</strong><br>\n<strong>Api(string api)</strong><br>\nThe streaming API service supporting the RDP streaming data.<br>\nThe api paremeter is Optional. Configuration default: QuantativeAnalytics</p>\n<p><strong>Universe(params JObject[] universe)</strong><br>\n<strong>Universe(IEnumerable<JObject> universe)</strong><br>\n<strong>Universe(params string[] universe)</strong><br>\n<strong>Universe(IEnumerable<string> universe)</strong><br>\n<strong>Universe(JArray universe)</strong><br>\nThe Universe of item of interest as supported by the underlying RDP streaming service.</p>\n<p><strong>Fields(params string[] fields)</strong><br>\n<strong>Fields(IEnumerable<string> fields)</strong><br>\n<strong>Fields(JArray fields)</strong><br>\nSpecify the specific fields delivered when messages arrive.<br></p>\n<p><strong>Parameters(JObject parameters)</strong><br>\nApply the service-specific parameters for each Universe defined.</p>\n<p><strong>Service(string service)</strong><br>\nOffers the ability to use a specific service to manage the real-time streaming data.<br>\nOptional.  Default: defined within the streaming platform.</p>\n<p><strong>ExtendedParams(JObject obj)</strong><br>\nThe streaming platform can offer a multitude of properties, depending on environment configuration.\nIn most cases, the default streaming environment is suitable for delivery. However, there may be some\nrare cases where applications may need to define properties that are less commonly used. The extended \nparams specification provides this capability. To extend, applications must form the request properties \nas defined within the WebSocket Request specifications. If extended properties are included, they will \nbe merged with all other properties specified.</p>\n<p>The possible values for the <strong>RDPStream.Api</strong>:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>QuantitativeAnalytics</td>\n<td>Stream IPAs Financial Contracts.</td>\n</tr>\n<tr>\n<td>Benchmark</td>\n<td>Stream Benchmark data services.</td>\n</tr>\n</tbody></table>\n<p><strong>GetStream()</strong><br>\n<strong>GetStream(ISession session)</strong><br>\nRetrieve an <code>IRDPItemStream</code> to manage real-time updates for the specified universe. When a session is not explicitly supplied, the default session is used.</p>\n<p><strong>Properties</strong> <em>(property, <code>IRDPStreamDefinitionParams</code>)</em><br>\nRetrieve the parameters defined for the streaming request.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IRDPStreamDefinition</code> object.</p>\n<h3 id=\"irdpitemstream-members\">IRDPItemStream members</h3>\n<p><code>GetStream()</code> / <code>GetStream(session)</code> return an <code>IRDPItemStream</code>, used to manage the life cycle of the subscription and register callbacks.</p>\n<p><strong>OnResponse(Action&lt;JObject, IRDPItemStream&gt; cb)</strong><br>\nOptional callback invoked upon receiving the initial response for the request.</p>\n<p><strong>OnUpdate(Action&lt;JObject, IRDPItemStream&gt; cb)</strong><br>\nOptional callback invoked upon receiving an update message containing changes in the market.</p>\n<p><strong>OnAlarm(Action&lt;JObject, IRDPItemStream&gt; alarmCb)</strong><br>\nOptional callback invoked when an alarm is raised for the request.</p>\n<p><strong>Definition</strong> <em>(property, <code>IRDPStreamDefinitionParams</code>)</em><br>\nRetrieve the parameters defined for the streaming request.</p>\n<p><code>IRDPItemStream</code> also implements the shared <strong>IStream</strong> interface, common to every streaming interface in the library (<code>IOMMItemStream</code>, <code>IRDPItemStream</code>, and the content-layer streams), contributing:</p>\n<p><strong>Open(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream synchronously. Request the data from the platform and wait until all initial responses have arrived. Returns a <code>Stream.State</code> value (see <a href=\"#/sections/delivery-layer/state\">State</a>).</p>\n<p><strong>OpenAsync(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream asynchronously.</p>\n<p><strong>Close()</strong><br>\n<strong>CloseAsync()</strong><br>\nClose all opened resources.</p>\n<p><strong>OpenState</strong> <em>(property, <code>Stream.State</code>)</em><br>\nIndicates if the stream is open with active streaming items.</p>\n<p><strong>Session</strong> <em>(property, <code>ISession</code>)</em><br>\nSession used to open the stream.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create an RDP stream definition:</p>\n<pre><code class=\"language-csharp\">var universe = new JObject()\n{\n    [&quot;instrumentType&quot;] = &quot;FxCross&quot;,\n    [&quot;instrumentDefinition&quot;] = new JObject()\n    {\n        [&quot;fxCrossType&quot;] = &quot;FxSpot&quot;,\n        [&quot;fxCrossCode&quot;] = &quot;USDAUD&quot;\n    }\n};\n\nvar parameters = new JObject()\n{\n    [&quot;marketData&quot;] = new JObject()\n    {\n        [&quot;fxSpots&quot;] = new JArray() \n        { \n            new JObject()\n            {\n                [&quot;spotDefinition&quot;] = new JObject()\n                {\n                    [&quot;fxCrossCode&quot;] = &quot;AUDUSD&quot;,\n                    [&quot;Source&quot;] = &quot;Composite&quot;\n                }\n            } \n        }\n    }\n};\n\n// Note: The RDP stream interface defines a standard set of client =&gt; server request properties.  \n// Because the implementation of the IPA streaming service breaks the standard and defines additional properties, \n// we are forced to utilize the ExtendedParamscapability below.  \n\nvar stream = RDPStream.Definition()\n                      .Universe(universe)\n                      .ExtendedParams(parameters)\n                      .Fields(&quot;FxSpot_BidMidAsk&quot;, &quot;Ccy1SpotDate&quot;, &quot;Ccy2SpotDate&quot;, &quot;ErrorCode&quot;)\n                      .GetStream()\n                      .OnResponse((msg, s) =&gt; Console.WriteLine($&quot;Response: {msg}&quot;))\n                      .OnUpdate((msg, s) =&gt; Console.WriteLine($&quot;Update: {DateTime.Now:HH:mm:ss} - {msg}&quot;))\n                      .OnAlarm((msg, s) =&gt; Console.WriteLine($&quot;Stream alarm: {DateTime.Now:HH:mm:ss}: {msg}&quot;));\n</code></pre>\n<p>The following example shows how to retrieve benchmark data using the RDP Stream Definition: </p>\n<pre><code class=\"language-csharp\">// The following request will perform a snapshot, despite requesting for streaming. \nvar parameters = new JObject()\n{\n    [&quot;calculationTypes&quot;] = new JArray(&quot;vwap&quot;, &quot;volume&quot;),\n    [&quot;timeField&quot;] = &quot;ingest&quot;,\n    [&quot;startTime&quot;] = new JObject()\n    {\n        [&quot;absoluteTime&quot;] = DateTime.Now.AddDays(-1).ToUniversalTime()\n    },\n    [&quot;responseType&quot;] = new JObject()\n    {\n        [&quot;type&quot;] = &quot;streaming&quot;,\n        [&quot;conflation&quot;] = &quot;1m&quot;\n    },\n    [&quot;filters&quot;] = new JArray(new JObject()\n    {\n        [&quot;type&quot;] = &quot;tradeclassification&quot;,\n        [&quot;codes&quot;] = new JArray(&quot;OB&quot;, &quot;AU&quot;)\n    }, new JObject()\n    {\n        [&quot;type&quot;] = &quot;volume&quot;,\n        [&quot;min&quot;] = 0,\n        [&quot;max&quot;] = 100\n    })\n};\n\nvar stream = RDPStream.Definition()\n                      .Api(RDPStream.Api.Benchmark)\n                      .Universe(&quot;VOD.L&quot;, &quot;AAPL.O&quot;)\n                      .Parameters(parameters)\n                      .GetStream()\n                      .OnResponse((msg, s) =&gt; Console.WriteLine($&quot;Response: {msg}&quot;))\n                      .OnUpdate((msg, s) =&gt; Console.WriteLine($&quot;Update: {DateTime.Now:HH:mm:ss} - {msg}&quot;))\n                      .OnAlarm((msg, s) =&gt; Console.WriteLine($&quot;Stream alarm: {DateTime.Now:HH:mm:ss}: {msg}&quot;));\n</code></pre>\n"},{"location":"./sections/delivery-layer/rdp-stream/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-rdp-stream-objects\">About RDP stream objects</h1>\n<p>The RDP Stream interface is responsible for defining, requesting, processing RDP streaming content supported by the RDP streaming service.</p>\n"},{"location":"./sections/delivery-layer/rdp-websocket/intro","title":"RDP Websocket","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"rdp-web-socket\">RDP Web Socket</h1>\n<h3 id=\"overview\">Overview</h3>\n<p>The RDPWebSocket interface carries the required properties defining a WebSocket interface used by the OMM-based Streaming interfaces defined within RDP.</p>\n<h3 id=\"rdpwebsocket-members\">RDPWebSocket members</h3>\n<p><code>RDPWebSocket</code> (<code>LSEG.Data.Delivery.Stream.RDPWebSocket</code>) is a static class exposing the current WebSocket registration:</p>\n<p><strong>IsWebSocketRegistered</strong> <em>(static property, <code>bool</code>)</em><br>\nWhether a WebSocket implementation has been registered.</p>\n<p><strong>Register</strong> <em>(static property, <code>RDPRegisterWebSocket</code>)</em><br>\nRegister a specific WebSocket implementation. See below.</p>\n<h3 id=\"rdpregisterwebsocket-members\">RDPRegisterWebSocket members</h3>\n<p><strong>RegisterWebSocketImpl</strong> <em>(property, <code>Func&lt;IWebSocket&gt;</code>)</em><br>\nRegister a custom-developed <code>IWebSocket</code> implementation.</p>\n<p>The <code>ClientWebSocket()</code>, <code>NinjaWebSockets()</code>, <code>WebSocket4Net()</code>, <code>WebSocketClient()</code>, and <code>WebSocketSharp()</code> calls used below are extension methods, each shipped in a separate optional NuGet package (e.g. <code>LSEG.Data.WebSockets.NinjaWebSockets</code>, <code>LSEG.Data.WebSockets.WebSocket4Net</code>) rather than the core <code>LSEG.Data</code> package. Add a reference to the corresponding package to use a given implementation.</p>\n<h3 id=\"iwebsocket-members\">IWebSocket members</h3>\n<p><code>IWebSocket</code> is the interface implemented by every registered WebSocket implementation (built-in or custom, via <code>RegisterWebSocketImpl</code>).</p>\n<p><strong>ConnectAsync(CancellationToken cancellationToken)</strong><br>\nIssue a connection request into the server.</p>\n<p><strong>SendAsync(string msg)</strong><br>\nSend the specified message to the WebSocket server.</p>\n<p><strong>CloseAsync()</strong><br>\nIssue a close request into the server.</p>\n<p><strong>Register(IWebSocketDefinitionParams wsParams)</strong><br>\nRegister the connection details and the callback events used to capture connection and message events generated by the server.</p>\n<p><strong>State</strong> <em>(property, <code>RDPWebSocket.State</code>)</em><br>\nState of the WebSocket client.</p>\n<h3 id=\"iwebsocketdefinitionparams-members\">IWebSocketDefinitionParams members</h3>\n<p>Details used to interact with RDP streaming interfaces, supplied to <code>IWebSocket.Register(...)</code>.</p>\n<p><strong>Url</strong> <em>(property, <code>string</code>)</em><br>\nConnection channel URL for the WebSocket server.</p>\n<p><strong>Protocol</strong> <em>(property, <code>string</code>)</em><br>\nWebSocket protocol setting required by the server.</p>\n<p><strong>SecureConnection</strong> <em>(property, <code>bool</code>)</em><br>\nWhether the underlying WebSocket requires a secure connection.</p>\n<p><strong>OpenCb</strong> <em>(property, <code>Action&lt;IWebSocket&gt;</code>)</em><br>\nCallback invoked when the WebSocket channel successfully connects.</p>\n<p><strong>MessageCb</strong> <em>(property, <code>Action&lt;IWebSocket, string&gt;</code>)</em><br>\nCallback invoked when a new message arrives on the WebSocket channel.</p>\n<p><strong>CloseCb</strong> <em>(property, <code>Action&lt;IWebSocket, string&gt;</code>)</em><br>\nCallback invoked when the WebSocket channel closes.</p>\n<p><strong>ErrorCb</strong> <em>(property, <code>Action&lt;IWebSocket, string&gt;</code>)</em><br>\nCallback invoked when an error occurs on the WebSocket channel.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>We can use this interface to register a specific socket other than the one specified in configuration. </p>\n<pre><code class=\"language-csharp\">    RDPWebSocket.Register.ClientWebSocket(); // Library default\n\n    RDPWebSocket.Register.NinjaWebSockets();\n\n    RDPWebSocket.Register.WebSocket4Net(); // WebSocket4Net (originated from SuperWebSocket)\n\n    RDPWebSocket.Register.WebSocketClient();\n\n    RDPWebSocket.Register.WebSocketSharp();\n</code></pre>\n"},{"location":"./sections/delivery-layer/state","title":"StreamState","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"state\">State</h1>\n<p>Each stream can report different states during its lifecycle.</p>\n<table>\n<thead>\n<tr>\n<th><strong>State</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>State.Pending</td>\n<td>The stream is waiting to be opened or closed.</td>\n</tr>\n<tr>\n<td>State.Opened</td>\n<td>The stream is open and ready to work.</td>\n</tr>\n<tr>\n<td>State.Closed</td>\n<td>The stream is closed.</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/intro","title":"Introduction","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"introduction\">Introduction</h1>\n<h3 id=\"summary\">Summary</h3>\n<p>LSEG Data Libraries are easy-to-use software libraries providing developers with access to the data services of LSEG. These libraries and APIs are designed to provide consistent and easy access to the platform through its different access points, and span several programming languages that target both professional developers and financial coders. LSEG Data Libraries allow you to access LSEG data from the desktop, through local streaming services, or directly to the cloud using your preferred programming language.</p>\n<p>LSEG Data Libraries are available for Python, TypeScript or JavaScript and .NET languages in the following libraries:</p>\n<ul>\n<li>  <strong>LSEG Data Library for Python</strong></li>\n<li>  <strong>LSEG Data Library for TypeScript/JavaScript</strong></li>\n<li>  <strong>LSEG Data Library for .NET</strong></li>\n</ul>\n<p><img src=\"./resources/images/lseg-data-platform.png\" alt=\"LSEG Data Libraries\"></p>\n<h3 id=\"learn-more\">Learn more</h3>\n<p>To learn more about the LSEG Data Libraries, you should connect to the <a href=\"https://developers.refinitiv.com\">LSEG Developer Community</a>. Register and log in to the LSEG Developer Community portal, for free access to a variety of learning materials like quick start guides, tutorials, user documentation and much more.</p>\n<h3 id=\"help-and-support\">Help and Support</h3>\n<p>If you have any questions regarding the API usage, you may post them on the LSEG Data Q&amp;A Forum.</p>\n"},{"location":"./sections/metadata/intro","title":"MetadataCache","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-metadatacache\">About MetadataCache</h1>\n<p><strong>MetadataCache</strong> loads and caches metadata (shared dictionaries, global metadata, and per-instrument metadata) so subsequent stream opens skip the metadata HTTP round-trip.</p>\n<p>Non-instrument (&quot;singleton&quot;) metadata types are accessed through their dedicated accessor (<code>FidDictionary</code>, <code>EnumDictionary</code>, <code>ConsolidatedFields</code>, <code>GlobalMetadata</code>), each an <strong>ISingletonMetadataCache</strong>. Per-instrument metadata is accessed through the <strong>InstrumentMetadata</strong> accessor, an <strong>IInstrumentMetadataCache</strong>.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>MetadataCache.FidDictionary</code><br>\n<code>MetadataCache.EnumDictionary</code><br>\n<code>MetadataCache.ConsolidatedFields</code><br>\n<code>MetadataCache.GlobalMetadata</code><br>\n<code>MetadataCache.InstrumentMetadata</code></p>\n<h3 id=\"metadatacache-methods\">MetadataCache Methods</h3>\n<p><strong>IMetadataCacheLoaderResponse Load(ISession session = null, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IMetadataCacheLoaderResponse&gt; LoadAsync(ISession session = null, CancellationToken cancellationToken = default)</strong><br>\nLoads all singleton metadata types (<code>FidDictionary</code>, <code>EnumDictionary</code>, <code>ConsolidatedFields</code>, <code>GlobalMetadata</code>) into the cache in one call. <code>InstrumentMetadata</code> is excluded - it has no ambient universe and must be loaded explicitly (see below).</p>\n<p><strong>void Clear()</strong><br>\nRemoves all cached metadata (singleton and instrument).</p>\n<h3 id=\"isingletonmetadatacache-methods\">ISingletonMetadataCache Methods</h3>\n<p>Each of <code>FidDictionary</code>, <code>EnumDictionary</code>, <code>ConsolidatedFields</code> and <code>GlobalMetadata</code> is an <strong>ISingletonMetadataCache</strong>:</p>\n<p><strong>IMetadataCacheLoaderResponse Load(ISession session = null, CancellationToken ct = default)</strong><br>\n<strong>Task&lt;IMetadataCacheLoaderResponse&gt; LoadAsync(ISession session = null, CancellationToken ct = default)</strong><br>\nLoads this metadata type into the cache.</p>\n<p><strong>IMetadataCacheData GetCacheSnapshot()</strong><br>\nReads the cached snapshot for this metadata type without triggering a load. The payload is <code>null</code> when the type is not cached.</p>\n<p><strong>void Remove()</strong><br>\nRemoves the cached entry for this metadata type.</p>\n<h3 id=\"iinstrumentmetadatacache-methods\">IInstrumentMetadataCache Methods</h3>\n<p><strong>IInstrumentMetadataCacheDefinition Definition(params string[] items)</strong><br>\n<strong>IInstrumentMetadataCacheDefinition Definition(IEnumerable&lt;string&gt; items)</strong><br>\n<strong>IInstrumentMetadataCacheDefinition Definition()</strong><br>\nCreates a definition for the specified instrument metadata items. If created empty, populate the universe using <code>Universe()</code> on the returned definition, otherwise no items will be loaded.</p>\n<p><strong>IMetadataCacheData GetCacheSnapshot(string item)</strong><br>\nGets the cached instrument metadata for the specified item, without triggering a load.</p>\n<p><strong>IReadOnlyList&lt;string&gt; GetCacheUniverse()</strong><br>\nGets a list of all cached instrument metadata items.</p>\n<p><strong>void Remove(string item)</strong><br>\nRemoves the cached instrument metadata for the specified item. Use this prior to reloading an instrument to ensure fresh data is fetched rather than using potentially stale cached data.</p>\n<p><strong>void Clear()</strong><br>\nClears all cached instrument metadata entries.</p>\n<h3 id=\"iinstrumentmetadatacachedefinition-methods\">IInstrumentMetadataCacheDefinition Methods</h3>\n<p><strong>IInstrumentMetadataCacheDefinition Universe(params string[] universe)</strong><br>\n<strong>IInstrumentMetadataCacheDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nSets the universe of instruments (e.g. RIC item names) whose metadata will be loaded. Replaces any universe set previously (a set, not an append).</p>\n<p><strong>IInstrumentMetadataCacheDefinition InstrumentMetadataTypes(params InstrumentMetadataTypes[] instrumentMetaTypes)</strong><br>\n<strong>IInstrumentMetadataCacheDefinition InstrumentMetadataTypes(IEnumerable&lt;InstrumentMetadataTypes&gt; instrumentMetaTypes)</strong><br>\nOverrides the default set of instrument metadata types to load for the specified universe (default: all types). Values: <code>MarketRulesData</code>, <code>Qualifiers</code>, <code>RuleReferenceData</code>, <code>TimeZone</code>, <code>TradingSessions</code>.</p>\n<p><strong>IMetadataCacheLoaderResponse Load(ISession session = null, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IMetadataCacheLoaderResponse&gt; LoadAsync(ISession session = null, CancellationToken cancellationToken = default)</strong><br>\nLoads all the registered metadata into the cache.</p>\n<p><strong>IInstrumentMetadataCacheDefinitionParams Properties { get; }</strong><br>\nThe current request parameters, including the configured universe (<code>Universe</code>, <code>InstrumentMetadataTypes</code>).</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IMetadataCacheLoaderResponse</code> - the aggregate result of a metadata prefetch operation:</p>\n<p>bool IsSuccess { get; }<br>\nIReadOnlyList&lt;IMetadataCacheLoaderError&gt; Errors { get; }<br></p>\n<p>Each entry in <strong>Errors</strong> is an <strong>IMetadataCacheLoaderError</strong> (one per singleton type, or per instrument RIC, that failed):</p>\n<p>MetadataType MetadataType { get; }<br>\nstring Item { get; }<br>\nstring Error { get; }<br></p>\n<p><code>GetCacheSnapshot()</code> methods return an <strong>IMetadataCacheData</strong>:</p>\n<p>MetadataType MetadataType { get; }<br>\nstring Item { get; }<br>\nJObject Data { get; }<br></p>\n<p><code>MetadataType</code> values: <code>FidDictionary</code>, <code>EnumDictionary</code>, <code>ConsolidatedFields</code>, <code>GlobalMetadata</code>, <code>InstrumentMetadata</code>.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates loading, reading and removing both singleton and per-instrument metadata.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Core;\nusing LSEG.Data.Metadata.Cache;\nusing LSEG.Data.Metadata.Interfaces;\n\nISession session = Sessions.GetSession();\nsession.Open();\n\n// Load ALL singleton metadata types (FID dictionary, enum dictionary, consolidated fields, global metadata) in one call.\nvar result = MetadataCache.Load();\n\n// Or load individual singleton types on demand.\nMetadataCache.GlobalMetadata.Load();\nMetadataCache.FidDictionary.Load();\nMetadataCache.EnumDictionary.Load();\n\n// Load instrument metadata for a universe. A bad RIC does not abort the others.\nvar instrumentResult = MetadataCache.InstrumentMetadata\n    .Definition(&quot;AAPL.O&quot;, &quot;NVDA.O&quot;, &quot;invalid&quot;)\n    .Load();\n\n// A new universe replaces the previous one (it does not append).\nvar instrumentResult2 = MetadataCache.InstrumentMetadata\n    .Definition()\n    .Universe(&quot;GOOGL.O&quot;)\n    .Load();\n\n// GetCacheSnapshot(...) NEVER hits the network - it returns what is cached.\n// Data is null when the item was never loaded (or failed).\nvar globalSnapshot = MetadataCache.GlobalMetadata.GetCacheSnapshot();\nvar aaplSnapshot = MetadataCache.InstrumentMetadata.GetCacheSnapshot(&quot;AAPL.O&quot;);\n\n// Removal is a pure cache operation.\nMetadataCache.InstrumentMetadata.Remove(&quot;NVDA.O&quot;);\nMetadataCache.FidDictionary.Remove();\n\n// Clear ALL instrument metadata at once.\nMetadataCache.InstrumentMetadata.Clear();\n\n// Clear everything.\nMetadataCache.Clear();\n\nsession.Close();\n</code></pre>\n"},{"location":"./sections/session-layer/desktop-direct-session","title":"DesktopDirectSession","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"desktopdirectsession\">DesktopDirectSession</h1>\n<p>The <code>DesktopDirectSession</code> communicates with the platform via <strong>WAG (Workspace API Gateway)</strong>. It is intended for applications that need direct access to the streaming and RESTful services exposed to the desktop without hosting the Workspace application. The session provides a means to retrieve content from the LSEG Data Platform via WAG.</p>\n<p>For a connection that hosts the full desktop application, see <a href=\"#/sections/session-layer/desktop-session\">DesktopSession</a>; to connect directly to the platform, see <a href=\"#/sections/session-layer/platform-session\">PlatformSession</a>.</p>\n<p>The types on this page live in the <code>LSEG.Data.Core</code> namespace.</p>\n<h3 id=\"entry-points\">Entry points</h3>\n<p>The <code>DesktopDirectSession</code> class exposes a <code>Definition(...)</code> factory that returns an <code>IDesktopDirectSessionDefinition</code> fluent builder; the builder&#39;s <code>GetSession()</code> method finalises the request and returns an <code>ISession</code>.</p>\n<p><strong>DesktopDirectSession.Definition(string sessionName = default)</strong><br>\n<strong>DesktopDirectSession.Definition(Stream stream, string resourceName = default)</strong><br>\n<strong>DesktopDirectSession.Definition(JObject config)</strong><br>\n<strong>DesktopDirectSession.Definition(string sessionName, Stream stream, string resourceName = default)</strong><br>\n<strong>DesktopDirectSession.Definition(string sessionName, JObject config)</strong><br>\nDefine a DesktopDirect Session request. When <code>sessionName</code> is omitted, the <code>sessions.desktop-direct.default</code> entry from the configuration is used.</p>\n<h3 id=\"idesktopdirectsessiondefinition-members\">IDesktopDirectSessionDefinition members</h3>\n<p><code>IDesktopDirectSessionDefinition</code> is the fluent builder returned by <code>Definition(...)</code>. Each setter returns the builder for chaining; <code>GetSession()</code> (inherited from <code>ISessionDefinition</code>) produces the <code>ISession</code>.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>IDesktopDirectSessionDefinition AppName(string appName)</code></td>\n<td>method</td>\n<td>Application name defined by the user and used for request-tracking purposes. Required.</td>\n</tr>\n<tr>\n<td><code>IDesktopDirectSessionDefinition DacsApplicationID(string applicationId)</code></td>\n<td>method</td>\n<td>The ID of the application connecting in. Optional. Default: 256.</td>\n</tr>\n<tr>\n<td><code>IDesktopDirectSessionDefinition DacsPosition(string position)</code></td>\n<td>method</td>\n<td>The IP-address position of the application logging in. Optional. Default: local IP address.</td>\n</tr>\n<tr>\n<td><code>IDesktopDirectSessionDefinition DacsUserName(string username)</code></td>\n<td>method</td>\n<td>The DACS user name. Optional. Default: based on the machine login ID.</td>\n</tr>\n<tr>\n<td><code>IDesktopDirectSessionDefinition Host(string host)</code></td>\n<td>method</td>\n<td>IP address or hostname and port of the Advanced Distribution Server (ADS) streaming real-time content. When defined, all streaming communication goes through this interface by default. Format: <code>&lt;IP&gt;|&lt;hostname&gt;:&lt;port&gt;</code>, e.g. <code>elektron:15000</code>.</td>\n</tr>\n<tr>\n<td><strong><code>IDesktopDirectSessionDefinition TakeRealTimeControl(bool takeRealTimeControl)</code></strong></td>\n<td>method</td>\n<td><strong>Defines whether a newly opened session will &quot;steal&quot; the real-time access to streaming data when the user already has an opened session. Optional. Default: <code>true</code>. Set to <code>false</code> to open a session that does not take over real-time access and user wants only to query the APIs without streaming capabilities.</strong></td>\n</tr>\n<tr>\n<td><strong><code>IDesktopDirectSessionDefinition WithAuthenticationProvider(IAuthenticationProvider provider)</code></strong></td>\n<td>method</td>\n<td><strong>Sets the authentication provider. Required — a DesktopDirect session cannot open without one. Currently only DesktopDirect supports authentication using Entra as IDP and Heimdall as an internal auth service; use the <code>EntraProvider</code> implementation described below.</strong></td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><code>WithAuthenticationProvider</code> and <code>TakeRealTimeControl</code> are the two settings that most directly affect how a DesktopDirect session behaves: the former is mandatory for the session to authenticate at all, and the latter decides whether opening this session takes real-time streaming access away from any other session already using the same identity.</p>\n</blockquote>\n<h3 id=\"authentication--entraprovider\">Authentication — EntraProvider</h3>\n<p>The only concrete <code>IAuthenticationProvider</code> implementation shipped by the library is <code>EntraProvider</code> (<code>LSEG.Data.Authentication.IdentityProviders.EntraProvider</code>). It authenticates using Entra as the identity provider and Heimdall as the internal auth service.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>EntraProvider(Func&lt;Task&lt;string&gt;&gt; idpTokenProvider)</code></td>\n<td>constructor</td>\n<td>Builds the provider from a callback that asynchronously returns an Entra ID token (for example, one backed by MSAL). Required; throws <code>ArgumentNullException</code> if <code>idpTokenProvider</code> is <code>null</code>.</td>\n</tr>\n<tr>\n<td><code>EntraProvider(ITokenProvider tokenProvider)</code></td>\n<td>constructor</td>\n<td>Builds the provider from an <code>ITokenProvider</code> implementation instead of a raw callback. Required; throws <code>ArgumentNullException</code> if <code>tokenProvider</code> is <code>null</code>.</td>\n</tr>\n</tbody></table>\n<p><code>ITokenProvider</code> (<code>LSEG.Data.Authentication.IdentityProviders.ITokenProvider</code>) is the contract users can implement to supply their own token-minting mechanism. It exposes a single member: <code>Task&lt;string&gt; GetAccessTokenAsync()</code>, which asynchronously returns the access token.</p>\n<h3 id=\"idesktopdirectsessiondefinitionparams-members\">IDesktopDirectSessionDefinitionParams members</h3>\n<p><code>IDesktopDirectSessionDefinitionParams</code> exposes the read-only view of the parameters defined for the session (retrieved via <code>IDesktopDirectSession.Definition</code>).</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>string AppName</code></td>\n<td>property</td>\n<td>Application name defined by the user in the case of human-friendly request tracking.</td>\n</tr>\n<tr>\n<td><code>IAuthenticationProvider AuthenticationProvider</code></td>\n<td>property</td>\n<td>Authentication provider which drives the mechanism with which the user authenticates.</td>\n</tr>\n<tr>\n<td><code>string DacsAppId</code></td>\n<td>property</td>\n<td>The ID of the application connecting in.</td>\n</tr>\n<tr>\n<td><code>string DacsPosition</code></td>\n<td>property</td>\n<td>The IP-address position of the application logging in.</td>\n</tr>\n<tr>\n<td><code>string DacsUser</code></td>\n<td>property</td>\n<td>The DACS user name.</td>\n</tr>\n<tr>\n<td><code>string Host</code></td>\n<td>property</td>\n<td>IP address or hostname and port of the Advanced Distribution Server (ADS) streaming real-time content. When defined, all streaming communication goes through this interface by default.</td>\n</tr>\n<tr>\n<td><code>bool? RealTimeAccessControl</code></td>\n<td>property</td>\n<td>Drives whether a newly opened session will &quot;steal&quot; the real-time access to streaming data.</td>\n</tr>\n</tbody></table>\n<h3 id=\"idesktopdirectsession-members\">IDesktopDirectSession members</h3>\n<p><code>IDesktopDirectSession</code> is the DesktopDirect-specific session interface. It extends the common <code>ISession</code> interface (see <a href=\"#/sections/session-layer/session\">Sessions</a> for <code>Open</code>, <code>OpenAsync</code>, <code>Close</code>, <code>OnState</code>, <code>OnEvent</code>, and the state/event members) with the following:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>IDesktopDirectSession OnStreamingEndpoint(Action&lt;string, IList&lt;IStreamingEndpoint&gt;, ISession&gt; cb)</code></td>\n<td>method</td>\n<td>Optional callback invoked to report all the DesktopDirect streaming endpoints.</td>\n</tr>\n<tr>\n<td><code>IDesktopDirectSessionDefinitionParams Definition</code></td>\n<td>property</td>\n<td>Retrieve the parameters defined for the DesktopDirect Session.</td>\n</tr>\n</tbody></table>\n<h3 id=\"example\">Example</h3>\n<p><strong>Create a DesktopDirect session authenticated with <code>EntraProvider</code>, controlling real-time access with <code>TakeRealTimeControl</code>:</strong></p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Authentication.IdentityProviders;\nusing LSEG.Data.Core;\n\n// Wrap your Entra/MSAL token acquisition in an async callback.\nstatic async Task&lt;string&gt; GetAccessToken() =&gt; await new MsalClient().GetIDPToken(&quot;&lt;your-entra-client-id&gt;&quot;);\n\n// takeRealTimeControl: true -&gt; this session will get real-time data,\n// &quot;stealing&quot; it from any other session already using the same identity.\nusing (ISession session = DesktopDirectSession.Definition()\n                                              .WithAuthenticationProvider(new EntraProvider(GetAccessToken))\n                                              .TakeRealTimeControl(true)\n                                              .GetSession())\n{\n    session.OnState((state, msg, s) =&gt; Console.WriteLine($&quot;State: {state} - {msg}&quot;))\n           .OnEvent((eventCode, msg, s) =&gt; Console.WriteLine($&quot;Event: {eventCode} - {msg}&quot;));\n\n    if (session.Open() == Session.State.Opened)\n    {\n        // Use the session with Content or Delivery layer objects\n    }\n}\n</code></pre>\n<!-- Example validation: not executed - requires network access to a Workspace API Gateway / ADS endpoint and an Entra app registration. Modeled on Examples/Refinitiv.Data/3.0-Core/3.0.12-Core-DesktopDirectSession/3.0.12-Core-DesktopDirectSession.cs; `MsalClient` is a sample helper from that example, not part of the public SDK surface. -->"},{"location":"./sections/session-layer/desktop-session","title":"DesktopSession","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"desktopsession\">DesktopSession</h1>\n<p>The <code>DesktopSession</code> connects to the platform through <strong>LSEG Eikon</strong> or <strong>LSEG Workspace</strong> running on the same machine as your application. Each application connecting to the desktop must include an application key. The desktop provides a means to retrieve content from the LSEG Data Platform.</p>\n<p>This session type does <strong>not</strong> work with Eikon Web or Workspace for Web. For a connection that does not host the full desktop application, see <a href=\"#/sections/session-layer/desktop-direct-session\">DesktopDirectSession</a>; to connect directly to the platform, see <a href=\"#/sections/session-layer/platform-session\">PlatformSession</a>.</p>\n<p>The types on this page live in the <code>LSEG.Data.Core</code> namespace.</p>\n<h3 id=\"entry-points\">Entry points</h3>\n<p>The <code>DesktopSession</code> class exposes a <code>Definition(...)</code> factory that returns an <code>IDesktopSessionDefinition</code> fluent builder; the builder&#39;s <code>GetSession()</code> method finalises the request and returns an <code>ISession</code>.</p>\n<p><strong>DesktopSession.Definition(string sessionName = default)</strong><br>\n<strong>DesktopSession.Definition(Stream stream, string resourceName = default)</strong><br>\n<strong>DesktopSession.Definition(JObject config)</strong><br>\n<strong>DesktopSession.Definition(string sessionName, Stream stream, string resourceName = default)</strong><br>\n<strong>DesktopSession.Definition(string sessionName, JObject config)</strong><br>\nDefine a Desktop Session request. When <code>sessionName</code> is omitted, the <code>sessions.desktop.default</code> entry from the configuration is used.</p>\n<h3 id=\"idesktopsessiondefinition-members\">IDesktopSessionDefinition members</h3>\n<p><code>IDesktopSessionDefinition</code> is the fluent builder returned by <code>Definition(...)</code>. Each setter returns the builder for chaining; <code>GetSession()</code> (inherited from <code>ISessionDefinition</code>) produces the <code>ISession</code>.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>IDesktopSessionDefinition AppKey(string appKey)</code></td>\n<td>method</td>\n<td>Desktop Application key necessary to authenticate the specific application with the session. Required.</td>\n</tr>\n<tr>\n<td><code>IDesktopSessionDefinition AppName(string appName)</code></td>\n<td>method</td>\n<td>Application name defined by the user and used for request-tracking purposes. Required.</td>\n</tr>\n<tr>\n<td><code>IDesktopSessionDefinition Port(IEnumerable&lt;string&gt; ports)</code></td>\n<td>method</td>\n<td>Optional Desktop Proxy ports. Default: value extracted from <code>.portInUse</code>.</td>\n</tr>\n<tr>\n<td><code>IDesktopSessionDefinition Port(params int[] ports)</code></td>\n<td>method</td>\n<td>Optional Desktop Proxy ports. Default: value extracted from <code>.portInUse</code>.</td>\n</tr>\n</tbody></table>\n<h3 id=\"idesktopsessiondefinitionparams-members\">IDesktopSessionDefinitionParams members</h3>\n<p><code>IDesktopSessionDefinitionParams</code> exposes the read-only view of the parameters defined for the session (retrieved via <code>IDesktopSession.Definition</code>).</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>string AppKey</code></td>\n<td>property</td>\n<td>Desktop Application key necessary to authenticate the specific application with the session.</td>\n</tr>\n<tr>\n<td><code>string AppName</code></td>\n<td>property</td>\n<td>Application name defined by the user in the case of human-friendly request tracking.</td>\n</tr>\n<tr>\n<td><code>int[] Ports</code></td>\n<td>property</td>\n<td>Specified Desktop Proxy ports via interface or configuration. If no value is defined upon definition, the value is set when the session is opened.</td>\n</tr>\n</tbody></table>\n<h3 id=\"idesktopsession-members\">IDesktopSession members</h3>\n<p><code>IDesktopSession</code> is the desktop-specific session interface. It extends the common <code>ISession</code> interface (see <a href=\"#/sections/session-layer/session\">Sessions</a> for <code>Open</code>, <code>OpenAsync</code>, <code>Close</code>, <code>OnState</code>, <code>OnEvent</code>, and the state/event members) with the following:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>IDesktopSession OnStreamingEndpoint(Action&lt;string, IList&lt;IStreamingEndpoint&gt;, ISession&gt; cb)</code></td>\n<td>method</td>\n<td>Optional callback invoked to report all the desktop streaming endpoints.</td>\n</tr>\n<tr>\n<td><code>IDesktopSessionDefinitionParams Definition</code></td>\n<td>property</td>\n<td>Retrieve the parameters defined for the Desktop Session.</td>\n</tr>\n</tbody></table>\n<h3 id=\"example\">Example</h3>\n<p><strong>Create a Desktop session in code:</strong></p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Core;\n\nusing (ISession session = DesktopSession.Definition()\n                                        .AppKey(&quot;&lt;your-app-key&gt;&quot;)\n                                        .AppName(&quot;MyApp&quot;)\n                                        .GetSession())\n{\n    if (session.Open() == Session.State.Opened)\n    {\n        // Use the session with Content or Delivery layer objects\n    }\n}\n</code></pre>\n<!-- Example validation: not executed - requires desktop environment (Eikon / Workspace running locally). -->"},{"location":"./sections/session-layer/intro","title":"About the Session Layer","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-the-session-layer\">About the Session Layer</h1>\n<p>This part of the documentation covers the session layer of the library.</p>\n<p>Accessing the Delivery Platform (formerly Refinitiv Data Platform) to retrieve content requires your application to authenticate and manage a  connection. LSEG Data Libraries provide this managed access through an interface called a session. The session is the interface to the  platform and is responsible for defining authentication details, managing connection resources, and implementing the necessary protocol for communication.</p>\n<p>Depending on the access point your application uses to connect, it can choose from one of the session implementations to initiate the connection. For the creation phase, all session implementations expose the same API and behave in the same way.\nOnce the session is created and opened, the application uses it in conjunction with objects of the Content or Delivery Layer to access the content and services available on the Data Platform.</p>\n<p>Depending on the access point your application uses to connect to the Delivery Platform (formerly Refinitiv Data Platform), it creates and opens one of the following sessions:</p>\n<ul>\n<li><p><strong>Desktop:</strong> This type of session is used to connect to the platform either through Eikon or Workspace. It requires that Eikon or Workspace are running alongside your application. This type of session does not work with Eikon Web or Workspace for Web. See <a href=\"#/sections/session-layer/desktop-session\">DesktopSession</a>.</p>\n</li>\n<li><p><strong>DesktopDirect:</strong> This type of session communicates with the platform via WAG (Workspace API Gateway). It is intended for applications that need direct access to the streaming and RESTful services exposed to the desktop without hosting Workspace application. See <a href=\"#/sections/session-layer/desktop-direct-session\">DesktopDirectSession</a>.</p>\n</li>\n<li><p><strong>Platform:</strong> This type of session is used to connect directly to the platform or through a local real-time enterprise platform. It requires a platform account (either a user or a machine account) if you would like to connect directly to RDP, you need to provide platform credentials to create the session. If you would like to work through a local platform, it requires the IP of the local platform and a user name (e.g. DACS user name). See <a href=\"#/sections/session-layer/platform-session\">PlatformSession</a>.</p>\n</li>\n</ul>\n<p>Only Platform and Desktop session types require an App Key that uniquely identifies your application. To obtain an App Key for your application, refer to the LSEG Data Libraries.</p>\n<p>DesktopDirect requires an Entra Application ID registered via the OnboardingApp first.</p>\n<p>Platform sessions authenticate against RDP using one of the OAuth 2.0 grant types exposed by the library — <code>GrantPassword</code> (resource owner password), <code>ClientCredentials</code> (client id + client secret), or <code>ClientAssertion</code> (client id + signed JWT). All three grant classes implement the common <code>IGrant</code> interface and are supplied to a platform session through <code>OAuthGrantType(IGrant grant)</code>.</p>\n"},{"location":"./sections/session-layer/logging","title":"Logging","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"logging\">Logging</h1>\n<p>The library utilizes the NLog framework internally to provide flexible and convenient logging capabilities, giving the application developer full control of logging output. NLog supports both a configuration file and a C# API to define logging targets and rules.</p>\n<p>The following mechanisms are available, applied in this order of priority:</p>\n<ol>\n<li><strong>Programmatically intercept all log output</strong> - by utilizing the <code>Log</code> interface, an application lambda expression can be defined to capture all library log messages. This can be useful if an application decides to manage library log messages within their own logging frameworks. This mechanism takes priority over the options below.</li>\n<li><strong>Define an NLog configuration</strong> - if no programmatic interface has been defined (option 1), the library will use the defined configuration (<code>NLog.config</code>) to determine logging targets and rules.</li>\n<li><strong>Default logging</strong> - if neither of the options above have been defined, a default logging target and rule applies. By default, all log messages with a log level of <code>LogLevel.Info</code> or higher are sent to a file named <code>RDPLog_&lt;pid&gt;.log</code>.</li>\n</ol>\n<h3 id=\"log-methods\">Log Methods</h3>\n<p><strong>Log.Level</strong> <em>(static property, <code>NLog.LogLevel</code>)</em><br>\nOverride the minimum NLog log level for all defined logging rules.  Default: <code>LogLevel.Off</code> (uses the default file-based configuration described above).</p>\n<p><strong>Log.Output</strong> <em>(static property, <code>Action&lt;LogEventInfo, object[]&gt;</code>)</em><br>\nSpecify the application lambda expression to manage the log events, intercepting all library log messages.</p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">using LSEG.Data;\n\n// Increase the logging verbosity to Trace\nLog.Level = NLog.LogLevel.Trace;\n\n// Alternatively, intercept all log messages programmatically\nLog.Output = (logEvent, args) =&gt; Console.WriteLine($&quot;{logEvent.Level}: {logEvent.FormattedMessage}&quot;);\n</code></pre>\n"},{"location":"./sections/session-layer/platform-session","title":"PlatformSession","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"platformsession\">PlatformSession</h1>\n<p>The <code>PlatformSession</code> connects directly to the platform (LSEG Data Platform / RDP) or through a local real-time enterprise platform. The <code>PlatformSession</code> specification details the properties specific to RDP, including how an RDP user is authenticated when accessing content from the platform. A session into RDP supports requests such as streaming data, non-streaming data, message queues, and bulk data.</p>\n<p>Connecting directly to RDP requires a platform account (a user or a machine account) and platform credentials. Working through a local platform requires the IP of the local platform and a user name (e.g. a DACS user name).</p>\n<p>For desktop connections, see <a href=\"#/sections/session-layer/desktop-session\">DesktopSession</a> and <a href=\"#/sections/session-layer/desktop-direct-session\">DesktopDirectSession</a>.</p>\n<p>The types on this page live in the <code>LSEG.Data.Core</code> namespace.</p>\n<h3 id=\"entry-points\">Entry points</h3>\n<p>The <code>PlatformSession</code> class exposes a <code>Definition(...)</code> factory that returns an <code>IPlatformSessionDefinition</code> fluent builder; the builder&#39;s <code>GetSession()</code> method finalises the request and returns an <code>ISession</code>.</p>\n<p><strong>PlatformSession.Definition(string sessionName = default)</strong><br>\n<strong>PlatformSession.Definition(Stream stream, string resourceName = default)</strong><br>\n<strong>PlatformSession.Definition(JObject config)</strong><br>\n<strong>PlatformSession.Definition(string sessionName, Stream stream, string resourceName = default)</strong><br>\n<strong>PlatformSession.Definition(string sessionName, JObject config)</strong><br>\nDefine a Platform Session request. When <code>sessionName</code> is omitted, the <code>sessions.platform.default</code> entry from the configuration is used.</p>\n<h3 id=\"iplatformsession-members\">IPlatformSession members</h3>\n<p><code>IPlatformSession</code> is the platform-specific session interface. It extends the common <code>ISession</code> interface (see <a href=\"#/sections/session-layer/session\">Sessions</a> for <code>Open</code>, <code>OpenAsync</code>, <code>Close</code>, <code>OnState</code>, <code>OnEvent</code>, and the state/event members) with the following:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>IPlatformSession OnStreamingEndpoint(Action&lt;string, IList&lt;IStreamingEndpoint&gt;, ISession&gt; cb)</code></td>\n<td>method</td>\n<td>Optional callback invoked to report all the RDP platform streaming endpoints.</td>\n</tr>\n<tr>\n<td><code>IPlatformSessionDefinitionParams Definition</code></td>\n<td>property</td>\n<td>Retrieve the parameters defined for the Platform Session.</td>\n</tr>\n</tbody></table>\n<h3 id=\"authentication--oauth-20-grant-types\">Authentication — OAuth 2.0 grant types</h3>\n<p><code>PlatformSession</code> authenticates against RDP with an <code>IGrant</code> implementation supplied to the session definition via <code>OAuthGrantType(IGrant grant)</code>. Three grant classes are available; all implement <code>IGrant</code>, are <code>IDisposable</code>, and are typically created inside a <code>using</code> scope.</p>\n<p><strong>GrantPassword</strong> — Resource-Owner Password Grant. Exchanges a user&#39;s credentials for an access token.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>GrantPassword UserName(string user)</code></td>\n<td>method</td>\n<td>Defines the user&#39;s username required by the grant type. Required.</td>\n</tr>\n<tr>\n<td><code>GrantPassword Password(string password)</code></td>\n<td>method</td>\n<td>Defines the user&#39;s password required by this grant type. Required.</td>\n</tr>\n<tr>\n<td><code>GrantPassword Scope(string scope)</code></td>\n<td>method</td>\n<td>Limits the scope of RDP services for this sign-on session. Optional. Default: <code>trapi</code> (full scope of services).</td>\n</tr>\n</tbody></table>\n<p><strong>ClientCredentials</strong> — Client Credentials Grant. Exchanges a client ID / client secret pair for an access token.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>ClientCredentials ClientID(string id)</code></td>\n<td>method</td>\n<td>Defines the client ID required by the grant type. Required.</td>\n</tr>\n<tr>\n<td><code>ClientCredentials ClientSecret(string secret)</code></td>\n<td>method</td>\n<td>Defines the client secret required by this grant type. Required.</td>\n</tr>\n<tr>\n<td><code>ClientCredentials Scope(string scope)</code></td>\n<td>method</td>\n<td>Limits the scope of RDP services for this sign-on session. Optional. Default: <code>trapi</code>.</td>\n</tr>\n</tbody></table>\n<p><strong>ClientAssertion</strong> — Client Credentials Grant with a signed JWT assertion.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>ClientAssertion ClientID(string id)</code></td>\n<td>method</td>\n<td>Defines the client ID required by the grant type. Required.</td>\n</tr>\n<tr>\n<td><code>ClientAssertion JWKFilename(string fname)</code></td>\n<td>method</td>\n<td>Defines the JWK file used to generate the assertion.</td>\n</tr>\n<tr>\n<td><code>ClientAssertion JsonWebKey(JObject jwk)</code></td>\n<td>method</td>\n<td>Defines the JWK used to generate the assertion.</td>\n</tr>\n<tr>\n<td><code>ClientAssertion Scope(string scope)</code></td>\n<td>method</td>\n<td>Limits the scope of RDP services for this sign-on session. Optional. Default: <code>trapi</code>.</td>\n</tr>\n</tbody></table>\n<h3 id=\"example\">Example</h3>\n<p><strong>Create a Platform session with a password grant:</strong></p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Core;\n\nusing var grantPassword = new GrantPassword().UserName(&quot;&lt;machine-id&gt;&quot;)\n                                             .Password(&quot;&lt;password&gt;&quot;);\n\nusing (var platformSession = PlatformSession.Definition()\n                                            .AppKey(&quot;&lt;your-app-key&gt;&quot;)\n                                            .OAuthGrantType(grantPassword)\n                                            .TakeSignonControl(true)\n                                            .GetSession())\n{\n    platformSession.OnStreamingEndpoint((api, endpoints, s) =&gt; { /* inspect endpoints */ })\n                   .OnState((state, msg, s) =&gt; Console.WriteLine($&quot;State: {state}. {msg}&quot;))\n                   .OnEvent((eventCode, msg, s) =&gt; Console.WriteLine($&quot;Event: {eventCode}. {msg}&quot;));\n\n    platformSession.Open();\n}\n</code></pre>\n<!-- Example validation: not executed - requires credentials and network access to RDP. -->\n\n<!-- Maintainer review required: the `IPlatformSessionDefinition` builder members used above (`AppKey`, `OAuthGrantType`, `TakeSignonControl`, and `Host` for deployed ADS connections) are taken from the SDK's official `Examples/` usage; `IPlatformSessionDefinition` and `IPlatformSessionDefinitionParams` are not present in the generated API inventory, so their exact signatures could not be confirmed. Verify against `LSEG.Data/Core/Session/PlatformSession/`. -->"},{"location":"./sections/session-layer/session","title":"Sessions","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"sessions---definitions-and-use-cases\">Sessions - Definitions and Use Cases</h1>\n<p>The following page will take you through session creation, configuration and usage.</p>\n<p>You will see examples on how to create a default session, a specific desktop or platform session, how to use multiple sessions in a given program and what options each of the session types has. Along the way, you will be introduced to several session related concepts, like session state, session events, several authentication and authorization features and configuration.</p>\n<p>The session-layer types described here live in the <code>LSEG.Data.Core</code> namespace. Each concrete session variant (<code>DesktopSession</code>, <code>DesktopDirectSession</code>, <code>PlatformSession</code>) exposes a <code>Definition(...)</code> factory returning a session-specific <code>I…Definition</code> fluent builder; the builder&#39;s <code>GetSession()</code> method finalises the request and returns an <code>ISession</code>.</p>\n<h3 id=\"entry-points\">Entry points</h3>\n<p>The <code>Session</code> class is the generic factory used when the session type is chosen from configuration (JSON file):</p>\n<p><strong>Session.Definition(string sessionName = default)</strong><br>\n<strong>Session.Definition(Stream stream, string resourceName = default)</strong><br>\n<strong>Session.Definition(JObject config)</strong><br>\n<strong>Session.Definition(string sessionName, Stream stream, string resourceName = default)</strong><br>\n<strong>Session.Definition(string sessionName, JObject config)</strong><br>\nDefine a session request. When <code>sessionName</code> is omitted, the <code>sessions.default</code> entry from the configuration is used. Each overload returns an <code>ISessionDefinition</code> whose <code>GetSession()</code> produces an <code>ISession</code>.</p>\n<p><strong>Session.DefaultSession</strong> <em>(static property, <code>ISession</code>)</em><br>\nThe last session created through any of the <code>Definition(...)</code> factories. Convenient for library-level code that needs an implicit session handle.</p>\n<p><strong>Session.StateMsg(State state, string sessionName)</strong> <em>(static)</em><br>\nText message associated with a <code>Session.State</code> code.</p>\n<p>For type-specific configuration in code (rather than JSON), use the dedicated factories described on their own pages:</p>\n<ul>\n<li><a href=\"#/sections/session-layer/desktop-session\">DesktopSession</a> — for Eikon / Workspace desktop connections.</li>\n<li><a href=\"#/sections/session-layer/desktop-direct-session\">D
