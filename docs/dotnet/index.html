esktopDirectSession</a> — for Workspace API Gateway (WAG) connections.</li>\n<li><a href=\"#/sections/session-layer/platform-session\">PlatformSession</a> — for direct Delivery Platform / RDP connections.</li>\n</ul>\n<h3 id=\"isession-members\">ISession members</h3>\n<p><code>ISession</code> is the common interface implemented by every session variant.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Member</strong></th>\n<th><strong>Kind</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>Session.State Open(CancellationToken cancellationToken = default)</code></td>\n<td>method</td>\n<td>Open the session synchronously. Blocks until authentication and platform-specific resource initialisation complete.</td>\n</tr>\n<tr>\n<td><code>Task&lt;Session.State&gt; OpenAsync(CancellationToken cancellationToken = default)</code></td>\n<td>method</td>\n<td>Open the session asynchronously.</td>\n</tr>\n<tr>\n<td><code>bool Close()</code></td>\n<td>method</td>\n<td>Close all opened resources.</td>\n</tr>\n<tr>\n<td><code>Task&lt;bool&gt; CloseAsync()</code></td>\n<td>method</td>\n<td>Close all opened resources asynchronously.</td>\n</tr>\n<tr>\n<td><code>ISession OnState(Action&lt;Session.State, string, ISession&gt; cb)</code></td>\n<td>method</td>\n<td>Register a callback invoked when the session state changes.</td>\n</tr>\n<tr>\n<td><code>ISession OnEvent(Action&lt;Session.EventCode, JObject, ISession&gt; cb)</code></td>\n<td>method</td>\n<td>Register a callback invoked when a session event is reported.</td>\n</tr>\n<tr>\n<td><code>Session.State OpenState</code></td>\n<td>property</td>\n<td>Current open state of the session.</td>\n</tr>\n<tr>\n<td><code>Session.EventCode LastEventCode</code></td>\n<td>property</td>\n<td>Latest event code reported for the session.</td>\n</tr>\n<tr>\n<td><code>object LastEventMessage</code></td>\n<td>property</td>\n<td>Latest event message payload reported for the session.</td>\n</tr>\n<tr>\n<td><code>Connection.State StreamingState</code></td>\n<td>property</td>\n<td>Current state of the underlying streaming connection.</td>\n</tr>\n<tr>\n<td><code>bool SupportsDataRequests</code></td>\n<td>property</td>\n<td>Whether the session supports RESTful data requests. Notably <code>false</code> for sessions configured only for deployed streaming services.</td>\n</tr>\n</tbody></table>\n<h3 id=\"session-state\">Session State</h3>\n<p><code>Session.State</code> (the <code>LSEG.Data.Core.State</code> enum).</p>\n<table>\n<thead>\n<tr>\n<th><strong>State</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>State.Pending</td>\n<td>The session is waiting to be opened or closed.</td>\n</tr>\n<tr>\n<td>State.Opened</td>\n<td>The session is open and ready to work.</td>\n</tr>\n<tr>\n<td>State.Closed</td>\n<td>The session is closed.</td>\n</tr>\n</tbody></table>\n<h3 id=\"session-event-codes\">Session Event Codes</h3>\n<p><code>Session.EventCode</code> (<code>LSEG.Data.Core.EventCode</code>).</p>\n<table>\n<thead>\n<tr>\n<th><strong>Event Code</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>EventCode.None</td>\n<td>EventCode not set.</td>\n</tr>\n<tr>\n<td>EventCode.StreamConnected</td>\n<td>Denotes the connection to the streaming service has been successfully established.</td>\n</tr>\n<tr>\n<td>EventCode.StreamDisconnected</td>\n<td>Denotes the connection to the streaming service is not established.</td>\n</tr>\n<tr>\n<td>EventCode.SessionAuthenticationSuccess</td>\n<td>Denotes the session has successfully authenticated this client.</td>\n</tr>\n<tr>\n<td>EventCode.SessionAuthenticationFailed</td>\n<td>Denotes the session has failed to authenticate this client.</td>\n</tr>\n<tr>\n<td>EventCode.StreamAuthenticationSuccess</td>\n<td>Denotes the stream has successfully authenticated this client.</td>\n</tr>\n<tr>\n<td>EventCode.StreamAuthenticationFailed</td>\n<td>Denotes the stream has failed to authenticate this client.</td>\n</tr>\n<tr>\n<td>EventCode.StreamDiscoveryFailed</td>\n<td>Unable to query the streaming service based on specified location during streaming service discovery.</td>\n</tr>\n<tr>\n<td>EventCode.TokenRefreshFailed</td>\n<td>The request to refresh the access token for the session has failed.</td>\n</tr>\n<tr>\n<td>EventCode.TokenRevokeFailed</td>\n<td>The request to revoke the refresh token failed.</td>\n</tr>\n<tr>\n<td>EventCode.RealTimeAccessAllowed</td>\n<td>Real-time access has been granted to this session.</td>\n</tr>\n<tr>\n<td>EventCode.RealTimeAccessDenied</td>\n<td>Real-time access has been denied for this session.</td>\n</tr>\n</tbody></table>\n<!-- Maintainer review required: `RealTimeAccessAllowed` and `RealTimeAccessDenied` are enum fields with no XML `<summary>` in the SDK; descriptions above are inferred from the field names. -->\n\n<h3 id=\"oauth-20-grant-types-for-platform-sessions\">OAuth 2.0 grant types for platform sessions</h3>\n<p><code>PlatformSession</code> authenticates against RDP with an <code>IGrant</code> implementation supplied via <code>OAuthGrantType(IGrant grant)</code>.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Grant class</strong></th>\n<th><strong>Purpose</strong></th>\n<th><strong>Required setters</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>GrantPassword</code></td>\n<td>Resource-Owner Password Grant. Exchanges a user&#39;s credentials for an access token.</td>\n<td><code>UserName(string)</code>, <code>Password(string)</code>, optionally <code>Scope(string)</code></td>\n</tr>\n<tr>\n<td><code>ClientCredentials</code></td>\n<td>Client Credentials Grant. Exchanges a client ID / client secret pair for an access token.</td>\n<td><code>ClientID(string)</code>, <code>ClientSecret(string)</code>, optionally <code>Scope(string)</code></td>\n</tr>\n<tr>\n<td><code>ClientAssertion</code></td>\n<td>Client Credentials Grant with a signed JWT assertion.</td>\n<td><code>ClientID(string)</code>, one of <code>JWKFilename(string)</code> / <code>JsonWebKey(JObject)</code>, optionally <code>Scope(string)</code></td>\n</tr>\n</tbody></table>\n<p>All three grant classes are <code>IDisposable</code> and are typically created inside a <code>using</code> scope.</p>\n<h3 id=\"examples\">Examples</h3>\n<p><strong>Create a session driven by configuration (session type comes from the JSON <code>sessions</code> block):</strong></p>\n<pre><code class=\"language-csharp\">using (ISession session = Session.Definition().GetSession())\n{\n    if (session.Open() == Session.State.Opened)\n    {\n        logger.Info(&quot;Created session. Done.&quot;);\n    }\n} \n</code></pre>\n<p><strong>Pick a named session from configuration:</strong></p>\n<pre><code class=\"language-csharp\">// Desktop Session (name matches the entry under `sessions.desktop.*` in configuration)\nusing (ISession desktopSession = Session.Definition(&quot;desktop&quot;).GetSession())\n{\n    // Open and use session here\n}\n\n// Platform Session created explicitly in code\nvar platformSession = PlatformSession.Definition().GetSession();\n</code></pre>\n<p>Sessions can also be configured by embedding a JSON configuration file in your project. The example below assumes there is an embedded resource at the root level. At runtime the assembly is queried for that resource, which is then passed as a stream to the session <code>Definition()</code> call. When using a custom configuration, several other details will be required as follows:</p>\n<pre><code class=\"language-csharp\">var resources = Assembly.GetExecutingAssembly().GetManifestResourceNames();\nusing var resource = Assembly.GetExecutingAssembly().GetManifestResourceStream(resources[0]);\n\n// We need to also specify an ADS (Advanced Distribution Server) host \nvar session = PlatformSession.Definition(resource)\n                             .Host(GlobalSettings.RTDSHost)\n                             .GetSession();\n\n// Alternatively, we can use an OAuth grant\n// We recommend using Global Settings to load this information from environment variables and avoid hard-coding\n\nusing var grantPassword = new GrantPassword().UserName(GlobalSettings.MachineID)\n                                             .Password(GlobalSettings.MachinePasswd);\n\nusing (var platformSession = PlatformSession.Definition(resource)\n                                            .AppKey(GlobalSettings.AppKey)\n                                            .OAuthGrantType(grantPassword)\n                                            .TakeSignonControl(true)\n                                            .GetSession())\n{\n    platformSession.OnStreamingEndpoint((api, endpoints, s) =&gt; DisplayEndpoints(api, endpoints))\n                   .OnState((state, msg, s) =&gt; Console.WriteLine($&quot;State: {state}. {msg}&quot;))\n                   .OnEvent((eventCode, msg, s) =&gt; Console.WriteLine($&quot;Event: {eventCode}. {msg}&quot;));\n}\n</code></pre>\n<!-- Maintainer review required: `GlobalSettings`, `AppKey` and `Host` on `IPlatformSessionDefinition` are referenced by existing examples but neither type appears as a public entry in the generated API inventory. Verify their public surface directly against the SDK. -->\n\n<p>The example below shows how to register and use callbacks for session state and events.</p>\n<pre><code class=\"language-csharp\">List&lt;Session.EventCode&gt; events = new();\nList&lt;Session.State&gt; states = new();\n\nvar platformSession = PlatformSession.Definition().GetSession();\n\nvar sessionState = platformSession.OnEvent((e, o, s) =&gt;\n                                  {\n                                      output.WriteLine($&quot;Event: {e} - {o}&quot;);\n                                      events.Add(e);\n                                  }).OnState((state, o, s) =&gt;\n                                  {\n                                      output.WriteLine($&quot;State: {state} - {o}&quot;);\n                                      states.Add(state);\n                                  }).Open();\n\nvar isSessionClosed = platformSession.Close();\n</code></pre>\n"}]})</script></html>
