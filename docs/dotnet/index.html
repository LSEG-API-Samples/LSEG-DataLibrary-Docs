true},{"title":"IPA","items":[{"title":"FinancialContracts","items":[{"title":"About FinancialContracts","location":"./sections/content-layer/ipa/financial-contracts/intro"},{"title":"FinancialContracts.Definition","location":"./sections/content-layer/ipa/financial-contracts/definition"},{"title":"Bond","location":"./sections/content-layer/ipa/financial-contracts/bond/intro"},{"title":"CapFloor","location":"./sections/content-layer/ipa/financial-contracts/cap-floor/intro"},{"title":"FxCross","location":"./sections/content-layer/ipa/financial-contracts/fx-cross/intro"},{"title":"Option","location":"./sections/content-layer/ipa/financial-contracts/option/intro"},{"title":"Swaption","location":"./sections/content-layer/ipa/financial-contracts/swaption/intro"}],"collapsed":true,"collapsible":true},{"title":"Surfaces","items":[{"title":"About Surfaces","location":"./sections/content-layer/ipa/surfaces/intro"},{"title":"VolatilitySurface.Definition","location":"./sections/content-layer/ipa/surfaces/definition"}],"collapsed":true,"collapsible":true}],"collapsed":true,"collapsible":true}],"collapsed":false,"collapsible":false},{"title":"DELIVERY LAYER","items":[{"title":"Intro","location":"./sections/delivery-layer/intro"},{"title":"Endpoint Request","items":[{"title":"Intro","location":"./sections/delivery-layer/endpoint-request/intro"},{"title":"Definition","location":"./sections/delivery-layer/endpoint-request/definition"}],"collapsed":true,"collapsible":true},{"title":"OMM streams","items":[{"title":"Intro","location":"./sections/delivery-layer/omm-stream/intro"},{"title":"Definition","location":"./sections/delivery-layer/omm-stream/definition"}],"collapsed":true,"collapsible":true},{"title":"RDP streams","items":[{"title":"Intro","location":"./sections/delivery-layer/rdp-stream/intro"},{"title":"Definition","location":"./sections/delivery-layer/rdp-stream/definition"}],"collapsed":true,"collapsible":true},{"title":"Queue","items":[{"title":"Intro","location":"./sections/delivery-layer/queue/intro"},{"title":"Definition","location":"./sections/delivery-layer/queue/definition"}],"collapsed":true,"collapsible":true},{"title":"RDP Websocket","location":"./sections/delivery-layer/rdp-websocket/intro"}],"collapsed":false,"collapsible":false},{"title":"METADATA","items":[{"title":"MetadataCache","location":"./sections/metadata/intro"}],"collapsed":false,"collapsible":false}],"menu":[],"routes":[{"location":"./","title":"Reference Guide - .NET Library","description":"","layout":"default","language_tabs":[],"html":"<p><img src=\"./resources/images/LSEG_tm_rgb.png\" alt=\"LSEG\"></p>\n<hr>\n<h1 id=\"lseg-data-library-for-net\">LSEG Data Library for .NET</h1>\n<h1 id=\"reference-guide\">Reference Guide</h1>\n"},{"location":"./sections/concepts-and-design","title":"Concepts and Design","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"concepts-and-design-of-lseg-data-libraries\">Concepts and Design of LSEG Data Libraries</h1>\n<h3 id=\"overview\">Overview</h3>\n<p>LSEG Data Libraries are designed with simple and consistent interfaces enabling your applications to connect to LSEG data through its different access points. Once connected, your applications can rely on easy-to-use objects and functions to access the breadth and depth of data services available on the platform. For very specific needs, you can also leverage the service-agnostic lower layer, providing you with access to the fine-grained details of each platform service.</p>\n<p><img src=\"./resources/images/lseg-data-libraries-features.png\" alt=\"LSEG Data Libraries - Features\"></p>\n<p><em><strong>Note:</strong> High performance scenarios, which represent a minority of customer use cases, are addressed by the LSEG Real-Time SDK (<a href=\"https://developers.refinitiv.com/en/api-catalog/refinitiv-real-time-opnsrc/rt-sdk-cc\">C++</a>, <a href=\"https://developers.refinitiv.com/en/api-catalog/refinitiv-real-time-opnsrc/rt-sdk-java\">Java</a>) and its APIs (Enterprise Message API, Enterprise Transport API).</em></p>\n<h3 id=\"general-considerations\">General considerations</h3>\n<p>As previously outlined, the developer has the choice to access the platform from a specific access point ranging from the desktop (Refinitiv Eikon or LSEG Workspace), through high-performance onsite deployments (LSEG&#39;s Real-Time Distribution System), or through cloud-based services (Data Platform).</p>\n<p>Depending on the specific access point, developers should not have to learn and use different APIs. The same API and libraries should work seamlessly across the platform, using the same paradigms, experience the same functional behavior and receive the same data regardless of how content is accessed.</p>\n<p>This API is able to be used by many different types of developers of varying skill levels and application goals, and for a wide range of different use case scenarios.</p>\n<p>These scenarios can be as basic as getting the current value of an instrument through a simple function call, or they may be as sophisticated as receiving an alert in real time when the value of an instrument changes within the market.</p>\n<p>LSEG Data Libraries will address these various needs by providing several abstraction layers and operation models, such as those described below.</p>\n<h3 id=\"platform-access-points\">Platform Access Points</h3>\n<p>Depending on the access point it uses to connect to the Delivery Platform (formerly Refinitiv Data Platform), either directly to the platform or via Eikon/LSEG Workspace or via a locally platform, your application will create and use one of the different session types defined by the libraries. With the exception of this session creation phase, the design of the LSEG Data Libraries is normalized to provide consistent interfaces, regardless how you access content. For example, applications built to access streaming content from the LSEG Workspace can seamlessly switch to another supporting access point (like direct access to the Data Platform) with minimal code changes. The goal is to provide the developer an intuitive interface that defines consistent APIs through multiple access points when accessing data services within the platform.</p>\n<p>The following diagram presents the different platform access points available to the developer:</p>\n<p><img src=\"./resources/images/lseg-data-libraries-access-points.png\" alt=\"LSEG Data Libraries - Access Points\"></p>\n<h3 id=\"abstraction-layers\">Abstraction Layers</h3>\n<p>The abstraction layers of LSEG Data Libraries target different needs as well as different types of developers.</p>\n<p>Depending on the skill and comfort level of the developer, the API offers general abstraction (session and delivery) layers specific to the delivery mode of the content, to more business-specific (content and access) layers defining interfaces more suited to the nature of the data. However, even the lower layers (session and delivery) provide an intuitive and easy-to-use interface.</p>\n<p>All these layers can be used together within the same application.</p>\n<p><img src=\"./resources/images/lseg-data-libraries-layers.png\" alt=\"LSEG Data Libraries - Layers\"></p>\n<h4 id=\"session-layer\">Session layer</h4>\n<p>Whichever access point is being used, access to LSEG data requires authentication and connection semantics to communicate and retrieve content. LSEG Data Libraries provide this managed access through an interface called a <a href=\"#/sections/session-layer/intro\">Session</a>. Once the session has been established, it can be used with objects and functions of other layers to retrieve data from the platform.</p>\n<h4 id=\"delivery-layer\">Delivery layer</h4>\n<p>The delivery layer implements classes that can be used to interact with the different delivery modes provided by the Data Platform to retrieve data:</p>\n<ul>\n<li>  Request (HTTP Request/Response)</li>\n<li>  Stream (WebSockets)</li>\n<li>  Queue (Alerts)</li>\n<li>  Files (bulk)</li>\n</ul>\n<p>For each of these delivery modes, defined classes can be used to retrieve data from the platform in raw JSON format.</p>\n<p>Classes defined in the delivery layer are not dependent on any specific data service. In other words, they are service agnostic. Designed as a low abstraction layer of the library, the delivery layer targets developers who need specific features that are not offered by other higher level abstraction layers (content and access). This layer targets the professional developer but can also be used by financial coders with good programming skills.</p>\n<h4 id=\"content-layer\">Content layer</h4>\n<p>The content layer refers to logical market data objects, largely representing financial items, such as level 1 market data prices and quotes, order books, news, historical pricing, company research data and so on. These objects are built on top of the delivery abstraction layer and provide value-added capabilities to manage and access the content within the interface.</p>\n<p>For example, the pricing interface is a thin layer on top of data services offering real-time market data. In addition, interfaces such as historical pricing and Environmental and Social Governance (ESG) are available to allow intuitive access to request and process results. While the native back-end data format supports JSON structured messages, the content layer conveniently prepares data messages in a user-friendly format specific to the programming language. Examples of these languages include Pandas DataFrames for Python, JSON in TypeScript or JavaScript and .NET.</p>\n<p>The Content layer can be used by both professional developers and financial coders. It provides great flexibility for familiar and commonly used financial data models.</p>\n<h4 id=\"access-layer\">Access layer</h4>\n<p>The access layer defines interfaces more suited to scripting languages such as Python. The goal of these interfaces is to allow researchers, data scientists or the casual developer to rapidly prototype solutions within interactive environments such as Jupyter Notebooks. The access  layer provides  data access in a single function call such as retrieving current data for pricing and fundamentals, retrieving historical intraday and interday data, and so on. Because this layer is built on top of the content layer, it will benefit from convenient abstractions such as preparing data formats suitable for the specific programming language.</p>\n<p>The access layer can be used by both professional developers and financial coders. It provides simple and familiar access to popular scripting languages and preparing data results useful for the particular language.</p>\n<p><em><strong>Note:</strong> This layer is only available in the <strong>LSEG Data Library for Python</strong>.</em></p>\n<hr>\n<h3 id=\"operation-models\">Operation Models</h3>\n<p>The abstraction layers outlined above provide several operation models that meet the needs of a large range of use cases, from the simplest to the most advanced. These models are synchronous, asynchronous, and event-driven.</p>\n<p><img src=\"./resources/images/lseg-data-libraries-operation-models.png\" alt=\"LSEG Data Libraries - Operation Models\"></p>\n<h4 id=\"synchronous\">Synchronous</h4>\n<p>Method or function calls are blocking. The result related to the call is available as soon as the method or function returns control to the calling thread. Synchronous calls are extremely useful when prototyping within scripting environments such as Jupyter Notebooks.</p>\n<p><em><strong>Note:</strong> Because of the asynchronous nature of TypeScript and JavaScript, the synchronous operation model is not available in the <strong>LSEG Data Library for TypeScript/JavaScript</strong></em></p>\n<h4 id=\"asynchronous\">Asynchronous</h4>\n<p>Method or function calls are non-blocking and return control to the calling thread almost immediately, before the result of the call is available. The asynchronous model allows the calling thread to perform other operations in parallel to the task requested by the method or function call. When performed with the other operations, the calling thread can wait for the requested result to be available (for example async or await paradigm). Applications that require more sophisticated interfaces, such as GUI-based applications, will greatly benefit from asynchronous calls.</p>\n<h4 id=\"event-driven\">Event-driven</h4>\n<p>With this model, the application registers callback methods or lambda expressions that are called when the requested results are available. Mostly applicable to streaming data, the event-driven model can be mixed with the synchronous model and the asynchronous model.</p>\n<p>When mixed with the synchronous model, some callback methods or lambda expressions are called before the method or function returns control to the calling thread. When mixed with the asynchronous model, callback methods or lambda expressions are generally called after the method or function returns control to the calling thread. Event-driven applications are common when building applications that work with streaming data.</p>\n"},{"location":"./sections/content-layer/esg/basic","title":"Basic","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"esgbasic-object\">ESG.Basic object</h1>\n<p><strong>Basic</strong> returns an ESG overview of 6 common data items from the latest Financials. Scores are based only for the current year.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Basic.Definition(params string[] universe)</code><br>\n<code>Basic.Definition(IEnumerable&lt;string&gt; universe)</code><br>\n<code>Basic.Definition()</code></p>\n<h3 id=\"basicdefinition-methods\">BasicDefinition Methods</h3>\n<p><strong>IBasicDefinition Universe(params string[] universe)</strong><br>\n<strong>IBasicDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nA comma-separated list of items defining the companies of interest.  Required.</p>\n<p><strong>IBasicDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IBasicDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IBasicDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IBasicDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IBasicDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IBasicDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IBasicDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IBasicDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.ESG;\n\nvar response = Basic.Definition(&quot;AAPL.O&quot;, &quot;MSFT.O&quot;).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/esg/dir-scores","title":"DirScores","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"esgdirscores-object\">ESG.DirScores object</h1>\n<p><strong>DirScores</strong> provides Diversity Inclusion Ratings Scores.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>DirScores.Definition(params string[] universe)</code><br>\n<code>DirScores.Definition(IEnumerable&lt;string&gt; universe)</code><br>\n<code>DirScores.Definition()</code></p>\n<h3 id=\"dirscoresdefinition-methods\">DirScoresDefinition Methods</h3>\n<p><strong>IDirScoresDefinition Universe(params string[] universe)</strong><br>\n<strong>IDirScoresDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nA comma-separated list of items defining the companies of interest.  Required.</p>\n<p><strong>IDirScoresDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IDirScoresDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IDirScoresDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IDirScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IDirScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IDirScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IDirScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IDirScoresDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.ESG;\n\nvar response = DirScores.Definition(&quot;MSFT.O&quot;, &quot;AAPL.O&quot;).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/esg/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-esg\">About ESG</h1>\n<p><strong>ESG</strong> (Environmental Social Governance) content objects give your application access to LSEG&#39;s ESG data, delivered at the Company Level, using multiple content objects belonging to the ESG group:</p>\n<ul>\n<li><a href=\"#/sections/content-layer/esg/basic\">Basic</a> - An overview of 6 common data items from the latest Financials, for the current year only.</li>\n<li><a href=\"#/sections/content-layer/esg/scores\">Scores</a> - LSEG&#39;s proprietary ESG Scores with full available history.</li>\n<li><a href=\"#/sections/content-layer/esg/measures\">Measures</a> - Full coverage of over 400 ESG data items, including LSEG&#39;s proprietary ESG Scores, with full available history.</li>\n<li><a href=\"#/sections/content-layer/esg/dir-scores\">DirScores</a> - Diversity Inclusion Ratings Scores.</li>\n<li><a href=\"#/sections/content-layer/esg/universe\">Universe</a> - The full universe of organizations, with relevant identifiers, that currently have ESG coverage.</li>\n</ul>\n<p>The user can use the following identifier types when specifying a universe - there is no need to define what identifier type is being used: Organization PermID, Instrument PermID, Quote PermID, RIC Code, ISIN, CUSIP, SEDOL, Valoren, Wert.</p>\n"},{"location":"./sections/content-layer/esg/measures","title":"Measures","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"esgmeasures-object\">ESG.Measures object</h1>\n<p><strong>Measures</strong> provides full coverage of over 400 ESG data items, including LSEG&#39;s proprietary ESG Scores, with full available history.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Measures.Definition(params string[] universe)</code><br>\n<code>Measures.Definition(IEnumerable&lt;string&gt; universe)</code><br>\n<code>Measures.Definition()</code></p>\n<h3 id=\"measuresdefinition-methods\">MeasuresDefinition Methods</h3>\n<p><strong>IMeasuresDefinition ServiceType(ServiceType type)</strong><br>\nThe <a href=\"#/sections/content-layer/esg/service-type\">service type</a> providing different coverage.  Optional.  Default: <code>ServiceType.full</code>.</p>\n<p><strong>IMeasuresDefinition Universe(params string[] universe)</strong><br>\n<strong>IMeasuresDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nA comma-separated list of items.  Required.</p>\n<p><strong>IMeasuresDefinition Start(int start)</strong><br>\n<strong>IMeasuresDefinition End(int end)</strong><br>\nRange representing the number of Financial Years of data to return. The options available start with <code>0</code> for the latest Financial and then negative numbers for further Financials - for example, <code>Start(0)</code> and <code>End(-2)</code> will return the last three Financial years.  Optional.  Default: -20.</p>\n<p><strong>IMeasuresDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IMeasuresDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IMeasuresDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>ServiceType</code>, <code>Universe</code>, <code>Start</code>, <code>End</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IMeasuresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IMeasuresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IMeasuresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IMeasuresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IMeasuresDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.ESG;\n\nvar response = Measures.Definition(&quot;AAPL.O&quot;).Start(0).End(-2).GetData();\n</code></pre>\n<h3 id=\"related-links\">Related links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/esg/service-type\">ServiceType</a></li>\n</ul>\n"},{"location":"./sections/content-layer/esg/scores","title":"Scores","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"esgscores-object\">ESG.Scores object</h1>\n<p><strong>Scores</strong> provides full coverage of LSEG&#39;s proprietary ESG Scores with full available history.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Scores.Definition(params string[] universe)</code><br>\n<code>Scores.Definition(IEnumerable&lt;string&gt; universe)</code><br>\n<code>Scores.Definition()</code></p>\n<h3 id=\"scoresdefinition-methods\">ScoresDefinition Methods</h3>\n<p><strong>IScoresDefinition ServiceType(ServiceType type)</strong><br>\nThe <a href=\"#/sections/content-layer/esg/service-type\">service type</a> providing different coverage.  Optional.  Default: <code>ServiceType.full</code>.</p>\n<p><strong>IScoresDefinition Universe(params string[] universe)</strong><br>\n<strong>IScoresDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nA comma-separated list of items.  Required.</p>\n<p><strong>IScoresDefinition Start(int start)</strong><br>\n<strong>IScoresDefinition End(int end)</strong><br>\nRange representing the number of Financial Years of data to return. The options available start with <code>0</code> for the latest Financial and then negative numbers for further Financials - for example, <code>Start(0)</code> and <code>End(-2)</code> will return the last three Financial years.  Optional.  Default: -20.</p>\n<p><strong>IScoresDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IScoresDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IScoresDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>ServiceType</code>, <code>Universe</code>, <code>Start</code>, <code>End</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IScoresDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IScoresDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.ESG;\n\nvar response = Scores.Definition(&quot;AAPL.O&quot;).GetData();\n</code></pre>\n<h3 id=\"related-links\">Related links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/esg/service-type\">ServiceType</a></li>\n</ul>\n"},{"location":"./sections/content-layer/esg/service-type","title":"ServiceType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"esgservicetype\">ESG.ServiceType</h1>\n<p>The supported ESG services, applicable to <a href=\"#/sections/content-layer/esg/measures\">Measures</a> and <a href=\"#/sections/content-layer/esg/scores\">Scores</a>:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ServiceType.full</td>\n<td>Provides coverage with full history.  Default.</td>\n</tr>\n<tr>\n<td>ServiceType.standard</td>\n<td>Provides coverage with limited history.</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/esg/universe","title":"Universe","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"esguniverse-object\">ESG.Universe object</h1>\n<p><strong>Universe</strong> provides access to the full universe of organizations, with relevant identifiers, that currently have ESG coverage.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Universe.Definition()</code></p>\n<h3 id=\"universedefinition-methods\">UniverseDefinition Methods</h3>\n<p><strong>IUniverseDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IUniverseDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IUniverseDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IUniverseDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IUniverseDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IUniverseDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IUniverseDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IUniverseDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.ESG;\n\nvar response = Universe.Definition().GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/fundamental-reference/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"fundamentalandreferencedefinition-object\">FundamentalAndReference.Definition object</h1>\n<p>This object defines a request definition used to retrieve Fundamental and Reference data.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>FundamentalAndReference.Definition()</code><br>\n<code>FundamentalAndReference.Definition(params string[] universe)</code><br>\n<code>FundamentalAndReference.Definition(IEnumerable&lt;string&gt; universe)</code><br></p>\n<h3 id=\"fundamentalandreference-parameters\">FundamentalAndReference Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>universe</td>\n<td>Single instrument, multiple instruments or list of instruments</td>\n<td>No</td>\n<td align=\"left\">-</td>\n</tr>\n</tbody></table>\n<p>You can set one or more instruments when calling the Definition() method.\nAnother way of specifying the instrument (RIC) is using the Universe() method in continuation of the Definition() method. \nFor a request to be valid, at least one universe is required. </p>\n<h3 id=\"fundamentalandreferencedefinition-methods\">FundamentalAndReferenceDefinition Methods</h3>\n<p><strong>IFundamentalAndReferenceDefinition Universe(params string[] universe)</strong><br>\n<strong>IFundamentalAndReferenceDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nA comma separated list of instruments supporting multiple instrument types, i.e. RIC, ISIN, SEDOL, etc.  Required.</p>\n<p><strong>IFundamentalAndReferenceDefinition Fields(params string[] fields)</strong><br>\n<strong>IFundamentalAndReferenceDefinition Fields(IEnumerable&lt;string&gt; fields)</strong><br>\n<strong>IFundamentalAndReferenceDefinition Fields(params FRField[] fields)</strong><br>\n<strong>IFundamentalAndReferenceDefinition Fields(IEnumerable&lt;FRField&gt; fields)</strong><br>\nA comma separated list of fields (e.g. <code>TR.PriceClose</code>). Can also contain local parameters (e.g. <code>TR.PriceClose(Curn:CAD)</code>).  Optional.</p>\n<p>Each <code>FRField(string field)</code> can further specify:<br>\n<strong>FRField Params(IDictionary&lt;string, string&gt; parameters)</strong> - a dictionary of parameters for the field.<br>\n<strong>FRField SortDirection(FRField.SortDirectionType sortDirection)</strong> - the sort direction (<code>Asc</code>, <code>Desc</code>).<br>\n<strong>FRField SortPriority(int priority)</strong> - the sort priority, where the highest priority is 0 (zero).</p>\n<p><strong>IFundamentalAndReferenceDefinition Parameters(JObject parameters)</strong><br>\nParameters to apply to all fields (global parameters). Name of a parameter is the name of a property in the object, value of the parameter is the value of that property (e.g. <code>&quot;SDate&quot;: &quot;-2D&quot;</code>).  Optional.</p>\n<p><strong>IFundamentalAndReferenceDefinition Output(string output)</strong><br>\nOutput layout for the service.  Optional.</p>\n<p><strong>IFundamentalAndReferenceDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IDataGridDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>Fields</code>, <code>Parameters</code>, <code>Output</code>, <code>Closure</code>).</p>\n<p><code>IFundamentalAndReferenceDefinition</code> extends the generic <strong>IDataSetDefinition</strong> interface, which contributes the parameterless <code>GetData</code>/<code>GetDataAsync</code> overloads below to every data-set-based content object (Fundamental and Reference, Historical Pricing Events/Summaries/SingleEvent).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IDataGridDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IDataGridDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IDataGridDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IDataGridDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IFundamentalAndReferenceDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<p>Each entry in <strong>Records</strong> is an <strong>IDataSetRecord</strong> describing the requested <code>Universe</code>, the <code>Fields</code> returned, and the corresponding <code>Data</code> points for that instrument.</p>\n<h3 id=\"idatasetrecord---properties\">IDataSetRecord - properties</h3>\n<p>IDataSetUniverse Universe { get; }<br>\nJArray Fields { get; }<br>\nIList&lt;JArray&gt; Data { get; }<br></p>\n<h3 id=\"idatasetuniverse---properties\">IDataSetUniverse - properties</h3>\n<p>string Instrument { get; }<br>\nstring CommonName { get; }<br>\nstring PermID { get; }<br>\nstring Currency { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a Fundamental And Reference object definition to get revenue for &quot;IBM.N&quot;</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.Data;\n\nvar definition = FundamentalAndReference.Definition(&quot;IBM.N&quot;).Fields(&quot;TR.Revenue&quot;);\n</code></pre>\n<p>Another example showing how to get real time data fields for Apple </p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.Data;\n\nvar definition = FundamentalAndReference.Definition()\n                                        .Universe(&quot;AAPL.O&quot;)\n                                        .Fields(&quot;BID&quot;, &quot;CF_BID&quot;, &quot;CF_ASK&quot;, &quot;CF_LAST&quot;);\n</code></pre>\n<p>One more example showing how to retrieve historical data between for a given interval, by specifying a start date and end date as parameters </p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.Data;\n\nvar definition = FundamentalAndReference.Definition(&quot;BHP.AX&quot;)\n                                        .Fields(&quot;TR.AdjmtFactorAdjustmentDate&quot;)\n                                        .Parameters(new JObject()\n                                        {\n                                            {&quot;SDate&quot;, &quot;1980-01-01&quot; },\n                                            {&quot;EDate&quot;, &quot;2018-09-29&quot; }\n                                        });\n</code></pre>\n"},{"location":"./sections/content-layer/fundamental-reference/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-fundamental-and-reference\">About Fundamental and reference</h1>\n<p><strong>FundamentalAndReference</strong> content objects give your application easy access to the large set of content that is available in LSEG Workspace via &quot;TR.&quot; data items.</p>\n<p>This content set includes:</p>\n<ul>\n<li>Fundamentals</li>\n<li>Price</li>\n<li>Estimates</li>\n<li>Indexes</li>\n<li>Corporate Actions</li>\n<li>Fixed Income</li>\n<li>Lippper</li>\n<li>Ownership, and so on.</li>\n</ul>\n<br>\n\"TR.\" data items and their parameters can easily be discovered in LSEG Workspace using the Data Item Browser app (DIB)."},{"location":"./sections/content-layer/historical-pricing/adjusments","title":"Adjustments","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"adjustments\">Adjustments</h1>\n<p>The list of adjustment types that tells the system whether to apply or not apply CORAX (Corporate Actions) events or exchange/manual corrections to historical time series data.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>&#39;unadjusted&#39;</td>\n<td>Not apply both exchange/manual corrections and CORAX</td>\n</tr>\n<tr>\n<td>&#39;exchangeCorrection&#39;</td>\n<td>Apply exchange correction adjustment to historical pricing</td>\n</tr>\n<tr>\n<td>&#39;manualCorrection&#39;</td>\n<td>Apply manual correction adjustment to historical pricing i.e. annotations made by content analysts</td>\n</tr>\n<tr>\n<td>&#39;CCH&#39;</td>\n<td>Apply Capital Change adjustment to historical Pricing due to Corporate Actions e.g. stock split</td>\n</tr>\n<tr>\n<td>&#39;CRE&#39;</td>\n<td>Apply Currency Redenomination adjustment when there is redenomination of currency</td>\n</tr>\n<tr>\n<td>&#39;RPO&#39;</td>\n<td>Apply Reuters Price Only adjustment to adjust historical price only not volume</td>\n</tr>\n<tr>\n<td>&#39;RTS&#39;</td>\n<td>Apply Reuters TimeSeries adjustment to adjust both historical price and volume</td>\n</tr>\n<tr>\n<td>&#39;qualifiers&#39;</td>\n<td>Apply price or volume adjustment to historical pricing according to trade/quote qualifier summarization actions</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/historical-pricing/event-types","title":"Event Types","description":"","layout":"default","language_tabs":[],"html":"<h2 id=\"eventtypes\">EventTypes</h2>\n<p>The list of supported market events types.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>&#39;trade&#39;</td>\n</tr>\n<tr>\n<td>&#39;quote&#39;</td>\n</tr>\n<tr>\n<td>&#39;correction&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/historical-pricing/events/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"eventsdefinition-object\">Events.Definition object</h1>\n<p>This object defines the request definition used to retrieve Historical pricing events data.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p> <code>Events.Definition()</code><br>\n <code>Events.Definition(params string[] items)</code><br>\n <code>Events.Definition(IEnumerable&lt;string&gt; items)</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>items</td>\n<td>Single instrument, multiple instruments or list of instruments</td>\n<td>No</td>\n<td align=\"left\">-</td>\n</tr>\n</tbody></table>\n<p>You can set one or more universes when calling the Definition() method.\nAnother way of specifying the universe is using the Universe() method in continuation of the Definition() method. \nFor a request to be valid, at least one universe is required. </p>\n<h3 id=\"eventsdefinition-methods\">EventsDefinition Methods</h3>\n<p><strong>IEventsDefinition Universe(params string[] universe)</strong><br>\n<strong>IEventsDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nList of instruments, e.g. RIC item names.  Required.</p>\n<p><strong>IEventsDefinition Fields(params string[] fields)</strong><br>\n<strong>IEventsDefinition Fields(IEnumerable&lt;string&gt; fields)</strong><br>\nA comma separated list of fields to be returned in the response.  Optional.</p>\n<p><strong>IEventsDefinition EventTypes(params Events.EventType[] eventTypes)</strong><br>\n<strong>IEventsDefinition EventTypes(IEnumerable&lt;Events.EventType&gt; eventTypes)</strong><br>\nA list of <a href=\"#/sections/content-layer/historical-pricing/event-types\">event</a> types to apply.  Optional.  Default: trade, quote, correction.</p>\n<p><strong>IEventsDefinition Start(DateTime date)</strong><br>\n<strong>IEventsDefinition Start(string date)</strong><br>\nThe start date (UTC) and timestamp of the query.  Optional.</p>\n<p><strong>IEventsDefinition End(DateTime date)</strong><br>\n<strong>IEventsDefinition End(string date)</strong><br>\nThe end date (UTC) and timestamp of the query.  Optional.</p>\n<p><strong>IEventsDefinition Adjustments(params Events.Adjustments[] adjustments)</strong><br>\n<strong>IEventsDefinition Adjustments(IEnumerable&lt;Events.Adjustments&gt; adjustments)</strong><br>\nA list of <a href=\"#/sections/content-layer/historical-pricing/adjusments\">adjustment</a> types to apply.  Optional.</p>\n<p><strong>IEventsDefinition Count(uint count)</strong><br>\nThis value is applicable for single instrument requests. The maximum number of data items returned. Optional.  Default: 20 (unless both <code>Start</code> and <code>End</code> are specified).</p>\n<p><strong>IEventsDefinition Sessions(params HistoricalPricing.Sessions[] sessions)</strong><br>\n<strong>IEventsDefinition Sessions(IEnumerable&lt;HistoricalPricing.Sessions&gt; sessions)</strong><br>\nThe list of <a href=\"#/sections/content-layer/historical-pricing/sessions\">market session</a> classifications to apply.  Optional.</p>\n<p><strong>IEventsDefinition Qos(HistoricalPricing.Qos qos)</strong><br>\nEnforce a specific historical pricing <a href=\"#/sections/content-layer/historical-pricing/qos-types\">Quality of Service</a>.  Optional.  Default: best quality based on permissions.</p>\n<p><strong>IEventsDefinition Service(string service)</strong><br>\nThe name of the service providing the desired streaming price data.  Optional.  Default: defined within the streaming platform.</p>\n<p><strong>IEventsDefinition PinStart(bool pinStart)</strong><br>\nDictates the position of the returned data within the time series.  Optional.  Default: false.</p>\n<p><strong>IEventsDefinition ExtendedParams(JObject extendedParams)</strong><br>\nSpecifies the parameters that will be merged with the request. Optional.</p>\n<p><strong>IEventsDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IEventsDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>View</code>, <code>EventTypes</code>, <code>StartDate</code>, <code>EndDate</code>, <code>Adjustments</code>, <code>MaxCount</code>, <code>Sessions</code>, <code>PinStart</code>, <code>ExtendedParams</code>, <code>Qos</code>, <code>Service</code>, <code>Closure</code>).</p>\n<p>When <strong>QoS</strong> is not specified, the default is real-time data retrieval, unless the universe name contains a &quot;/&quot;, indicating delayed QoS.</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IEventsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IEventsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IEventsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IEventsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<p><strong>IEventsStream GetStream()</strong><br>\n<strong>IEventsStream GetStream(ISession session)</strong><br>\nRetrieve a streaming interface to manage real-time updates for the specified historical pricing request. See <a href=\"#/sections/content-layer/historical-pricing/events/streams/intro\">Events.Stream</a>.</p>\n<h4 id=\"streaming-usage\">Streaming usage</h4>\n<p>The following example demonstrates how to retrieve streaming trade events for AAPL.O, blending real-time updates into the historical data.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar stream = Events.Definition(&quot;AAPL.O&quot;)\n                   .Fields(&quot;RTL&quot;, &quot;SEQNUM&quot;, &quot;TRDPRC_1&quot;, &quot;TRDVOL_1&quot;, &quot;HIGH_1&quot;, &quot;LOW_1&quot;, &quot;TRADE_ID&quot;, &quot;QUALIFIERS&quot;)\n                   .EventTypes(Events.EventType.trade)\n                   .Count(5)\n                   .GetStream();\n\nstream.OnInsert((data, s) =&gt; Console.WriteLine($&quot;INSERT: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{data.Table}&quot;))\n      .OnUpdate((update, s) =&gt; Console.WriteLine($&quot;UPDATE: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{update.Table}&quot;))\n      .OnStatus((status, s) =&gt; Console.WriteLine($&quot;Received status: {status}&quot;))\n      .OnError((error, s) =&gt; Console.WriteLine($&quot;Received error: {error}&quot;))\n      .Open();\n</code></pre>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IEventsDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<p>Each entry in <strong>Records</strong> is an <strong>IDataSetRecord</strong> describing the requested <code>Universe</code>, the <code>Fields</code> returned, and the corresponding <code>Data</code> points for that instrument.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a historical pricing events definition object for LSEG.L which retrieves the 20 most recent events.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar definition = Events.Definition(&quot;LSEG.L&quot;);\n</code></pre>\n<p>The following example demonstrates how to get the last 3 historical pricing data rows for VOD.L and truncate the data to retrieve only several specific fields:</p>\n<pre><code class=\"language-csharp\">var definition = Events.Definition().Universe(&quot;VOD.L&quot;)\n                                    .Count(3)\n                                    .Fields(&quot;DATE_TIME&quot;, &quot;EVENT_TYPE&quot;, &quot;BID&quot;, &quot;ASK&quot;, &quot;ASKSIZE&quot;);\n\nvar response = await definition.GetDataAsync();\n</code></pre>\n<p>The following example demonstrates how to get the last five historical pricing data rows for VOD.L, specifying the event type and adjustment type </p>\n<pre><code class=\"language-csharp\">var response = Events.Definition(&quot;VOD.L&quot;)\n                     .EventTypes(Events.EventType.trade)\n                     .Adjustments(Events.Adjustments.exchangeCorrection)\n                     .GetData();\n</code></pre>\n<h3 id=\"related-links\">Related Links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/historical-pricing/adjusments\">Adjustments</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/event-types\">Event types</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/qos-types\">Quality of Service (QoS)</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/sessions\">Market sessions</a></li>\n</ul>\n"},{"location":"./sections/content-layer/historical-pricing/events/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-historical-pricing-events\">About Historical Pricing Events</h1>\n<p>The Historical pricing events module provides access to the historical pricing data, and the ability to filter events by types, such as trade, quote or correction.</p>\n"},{"location":"./sections/content-layer/historical-pricing/events/streams/intro","title":"EventsStream","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-eventsstream-object\">About Events.Stream object</h1>\n<p><strong>Events.Stream objects</strong> are used to retrieve, process and manage real-time historical pricing events, blending live trades, quotes and corrections into the historical events retrieved via <a href=\"#/sections/content-layer/historical-pricing/events/definition\">Events.Definition</a>.</p>\n<h3 id=\"properties\">Properties</h3>\n<p><strong>Stream.State OpenState { get; }</strong><br>\nCurrent state of the stream.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>State.Pending</td>\n<td>The stream is waiting to be opened or is closed.</td>\n</tr>\n<tr>\n<td>State.Opened</td>\n<td>The stream is open and ready to work.</td>\n</tr>\n<tr>\n<td>State.Closed</td>\n<td>The stream is closed.</td>\n</tr>\n</tbody></table>\n<p><strong>ISession Session { get; }</strong><br>\nSession used to open the stream.</p>\n<p><strong>int LastMsgSeqNum { get; }</strong><br>\nThe sequence number (SeqNumber) for the last real-time message processed. This value can be used to cross-reference the generated INSERT or UPDATE record received.</p>\n<p><strong>JObject InstrumentMetadata { get; }</strong><br>\nThe instrument metadata for the given stream instrument.</p>\n<p><strong>IEventsDefinitionParams Definition { get; }</strong><br>\nRetrieve the parameters defined for the streaming request (see <a href=\"#/sections/content-layer/historical-pricing/events/definition\">Events.Definition Properties</a>).</p>\n<h3 id=\"events-stream-interface-methods\">Events Stream Interface methods</h3>\n<p><strong>Stream.State Open(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream synchronously. Request the data from the platform and wait until all initial responses have arrived.</p>\n<p><strong>Task&lt;Stream.State&gt; OpenAsync(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream asynchronously.</p>\n<p><strong>void Close()</strong><br>\n<strong>Task CloseAsync()</strong><br>\nClose all opened resources.</p>\n<p><strong>IEventsStream OnInsert(Action&lt;IDataSet, IEventsStream&gt; cb)</strong><br>\nCallback invoked upon receiving historical data bars to be inserted at specific points in time.</p>\n<p><strong>IEventsStream OnUpdate(Action&lt;IDataSet, IEventsStream&gt; cb)</strong><br>\nCallback invoked upon receiving an update to the most recent historical bar.</p>\n<p><strong>IEventsStream OnStatus(Action&lt;JObject, IEventsStream&gt; cb)</strong><br>\nCallback invoked when a stream status event occurs on the service.</p>\n<p><strong>IEventsStream OnError(Action&lt;string, IEventsStream&gt; cb)</strong><br>\nCallback invoked if an error occurs resulting from the request.  Required.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to retrieve streaming trade events for AAPL.O, blending real-time updates into the historical data.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar stream = Events.Definition(&quot;AAPL.O&quot;)\n                   .Fields(&quot;RTL&quot;, &quot;SEQNUM&quot;, &quot;TRDPRC_1&quot;, &quot;TRDVOL_1&quot;, &quot;HIGH_1&quot;, &quot;LOW_1&quot;, &quot;TRADE_ID&quot;, &quot;QUALIFIERS&quot;)\n                   .EventTypes(Events.EventType.trade)\n                   .Count(5)\n                   .GetStream();\n\nstream.OnInsert((data, s) =&gt; Console.WriteLine($&quot;INSERT: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{data.Table}&quot;))\n      .OnUpdate((update, s) =&gt; Console.WriteLine($&quot;UPDATE: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{update.Table}&quot;))\n      .OnStatus((status, s) =&gt; Console.WriteLine($&quot;Received status: {status}&quot;))\n      .OnError((error, s) =&gt; Console.WriteLine($&quot;Received error: {error}&quot;))\n      .Open();\n</code></pre>\n"},{"location":"./sections/content-layer/historical-pricing/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-historical-pricing\">About Historical Pricing</h1>\n<p>The Historical Pricing module provides the ability to create request definitions that are sent to the Delivery Platform (formerly Refinitiv Data Platform) to retrieve historical pricing summary, events, or single event data.</p>\n"},{"location":"./sections/content-layer/historical-pricing/qos-types","title":"QoS","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"qos---quality-of-service-types\">QoS - Quality of Service types</h1>\n<p>The quality of service (QoS) is used to define if the definition should retrieve delayed or real time data. </p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>&#39;delayed&#39;</td>\n</tr>\n</tbody></table>\n<br>\nIf the option is not specified, the QoS will be the one set on the server. \n<br>\nSome instruments might only have delayed data available."},{"location":"./sections/content-layer/historical-pricing/sessions","title":"Market Sessions","description":"","layout":"default","language_tabs":[],"html":"<h2 id=\"marketsession\">MarketSession</h2>\n<p>The Market Session represents a list of official durations in which trade and quote activities occur for a particular instrument.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PRE</td>\n<td>&quot;pre&quot;</td>\n<td>The definition should retrieve data during pre-market session</td>\n</tr>\n<tr>\n<td>NORMAL</td>\n<td>&quot;normal&quot;</td>\n<td>The definition should retrieve data during normal market session</td>\n</tr>\n<tr>\n<td>POST</td>\n<td>&quot;post&quot;</td>\n<td>The definition should retrieve data during post-market session</td>\n</tr>\n</tbody></table>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a historical pricing summaries definition for LSEG.L and get the 20 most recent summaries using only pre-market session data.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar definition = Summaries.Definition()\n                          .Universe(&quot;LSEG.L&quot;)\n                          .Sessions(HistoricalPricing.Sessions.pre)\n\nvar summariesData = definition.GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/historical-pricing/single-event/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"singleeventdefinition-object\">SingleEvent.Definition object</h1>\n<p>This object defines the request definition used to retrieve a single time series pricing event.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>SingleEvent.Definition()</code><br>\n<code>SingleEvent.Definition(string ric)</code></p>\n<h3 id=\"singleeventdefinition-methods\">SingleEventDefinition Methods</h3>\n<p><strong>ISingleEventDefinition Universe(string universe)</strong><br>\nA universe element, e.g. RIC item name.  Required.</p>\n<p><strong>ISingleEventDefinition Fields(params string[] fields)</strong><br>\n<strong>ISingleEventDefinition Fields(IEnumerable&lt;string&gt; fields)</strong><br>\nA comma separated list of fields to be returned in the response.  Optional.</p>\n<p><strong>ISingleEventDefinition EventTypes(params Events.EventType[] eventTypes)</strong><br>\n<strong>ISingleEventDefinition EventTypes(IEnumerable&lt;Events.EventType&gt; eventTypes)</strong><br>\nA list of <a href=\"#/sections/content-layer/historical-pricing/event-types\">event</a> types to apply.  Optional.  Default: trade, quote, correction.</p>\n<p><strong>ISingleEventDefinition Start(DateTime date)</strong><br>\n<strong>ISingleEventDefinition Start(string date)</strong><br>\nThe start date (UTC) and timestamp of the query.  Optional.</p>\n<p><strong>ISingleEventDefinition End(DateTime date)</strong><br>\n<strong>ISingleEventDefinition End(string date)</strong><br>\nThe end date (UTC) and timestamp of the query.  Optional.</p>\n<p><strong>ISingleEventDefinition Adjustments(params Events.Adjustments[] adjustments)</strong><br>\n<strong>ISingleEventDefinition Adjustments(IEnumerable&lt;Events.Adjustments&gt; adjustments)</strong><br>\nA list of <a href=\"#/sections/content-layer/historical-pricing/adjusments\">adjustment</a> types to apply.  Optional.</p>\n<p><strong>ISingleEventDefinition Qos(HistoricalPricing.Qos qos)</strong><br>\nEnforce a specific historical pricing <a href=\"#/sections/content-layer/historical-pricing/qos-types\">Quality of Service</a>.  Optional.  Default: best quality based on permissions.</p>\n<p><strong>ISingleEventDefinition Sessions(params HistoricalPricing.Sessions[] sessions)</strong><br>\n<strong>ISingleEventDefinition Sessions(IEnumerable&lt;HistoricalPricing.Sessions&gt; sessions)</strong><br>\nThe list of <a href=\"#/sections/content-layer/historical-pricing/sessions\">market session</a> classifications to apply.  Optional.</p>\n<p><strong>ISingleEventDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ISingleEventDefinition ExtendedParams(JObject extendedParams)</strong><br>\nSpecifies the parameters that will be merged with the request.  Optional.</p>\n<p><strong>ISingleEventDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>View</code>, <code>EventTypes</code>, <code>StartDate</code>, <code>EndDate</code>, <code>Adjustments</code>, <code>Qos</code>, <code>Sessions</code>, <code>ExtendedParams</code>, <code>Closure</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, ISingleEventDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, ISingleEventDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, ISingleEventDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, ISingleEventDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ISingleEventDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<p>Each entry in <strong>Records</strong> is an <strong>IDataSetRecord</strong> describing the requested <code>Universe</code>, the <code>Fields</code> returned, and the corresponding <code>Data</code> points for that instrument.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a single-event definition object for VOD.L, filtering trade events within a date range.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar response = SingleEvent.Definition(&quot;VOD.L&quot;)\n                          .EventTypes(Events.EventType.trade)\n                          .Start(new DateTime(2022, 1, 1, 0, 0, 0, DateTimeKind.Utc))\n                          .End(&quot;2022-01-10&quot;)\n                          .GetData();\n</code></pre>\n<h3 id=\"related-links\">Related links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/historical-pricing/adjusments\">Adjustments</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/event-types\">Event types</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/qos-types\">Quality of Service (QoS)</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/sessions\">Market sessions</a></li>\n</ul>\n"},{"location":"./sections/content-layer/historical-pricing/single-event/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-historical-pricing-single-event\">About Historical Pricing Single Event</h1>\n<p>The Historical Pricing Single Event module provides access to a single time series pricing event (trade, quote or correction) for one instrument, with the ability to filter by event type, adjustment, date range and market session durations.</p>\n"},{"location":"./sections/content-layer/historical-pricing/summaries/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"historicalpricingsummariesdefinition-object\">HistoricalPricing.Summaries.Definition object</h1>\n<p>This object defines the request definition used to retrieve particular historical pricing summaries data.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>HistoricalPricing.Summaries.Definition(params string[] items)</code><br>\n<code>HistoricalPricing.Summaries.Definition(IEnumearable&lt;string&gt; items)</code><br>\n<code>HistoricalPricing.Summaries.Definition()</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>items</td>\n<td>A collection of instruments</td>\n<td>No</td>\n<td align=\"left\">-</td>\n</tr>\n</tbody></table>\n<p>The universe can be specified using either the Definition() method or the Universe() method.\nFor a request to be valid it must specify at least one valid universe.</p>\n<h3 id=\"summariesdefinition-methods\">SummariesDefinition Methods</h3>\n<p><strong>ISummariesDefinition Universe(params string[] universe)</strong><br>\n<strong>ISummariesDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nList of instruments, e.g. RIC item names.  Note: Multiple items only applicable for interday.  Required.</p>\n<p><strong>ISummariesDefinition Fields(params string[] fields)</strong><br>\n<strong>ISummariesDefinition Fields(IEnumerable&lt;string&gt; fields)</strong><br>\nA comma separated list of fields to be returned in the response.  Optional.  Default: all available fields.</p>\n<p><strong>ISummariesDefinition Interval(Summaries.Interval interval)</strong><br>\nThe interval specification.  Optional.  Default: the backend returns the lowest interday interval.</p>\n<p><strong>ISummariesDefinition Start(DateTime date)</strong><br>\n<strong>ISummariesDefinition Start(string date)</strong><br>\nThe start date (ISO8601 format) of the period.  Required for Intraday intervals.</p>\n<p><strong>ISummariesDefinition End(DateTime date)</strong><br>\n<strong>ISummariesDefinition End(string date)</strong><br>\nThe end date (ISO8601 format) of the period.  Required for Intraday intervals.</p>\n<p><strong>ISummariesDefinition Adjustments(params Summaries.Adjustments[] adjustments)</strong><br>\n<strong>ISummariesDefinition Adjustments(IEnumerable&lt;Summaries.Adjustments&gt; adjustments)</strong><br>\nA list of <a href=\"#/sections/content-layer/historical-pricing/adjusments\">adjustment</a> types to apply.  Optional.</p>\n<p><strong>ISummariesDefinition Count(uint count)</strong><br>\nThe maximum number of data items returned.  Optional.  Default: 20 (unless both <code>Start</code> and <code>End</code> are specified).</p>\n<p><strong>ISummariesDefinition Sessions(params HistoricalPricing.Sessions[] sessions)</strong><br>\n<strong>ISummariesDefinition Sessions(IEnumerable&lt;HistoricalPricing.Sessions&gt; sessions)</strong><br>\nThe list of <a href=\"#/sections/content-layer/historical-pricing/sessions\">market session</a> classifications to apply.  Applicable to intraday summary intervals only.  Optional.</p>\n<p><strong>ISummariesDefinition TimestampLabel(Summaries.TimestampLabel label)</strong><br>\nThe pattern of timestamp label in the response.  Optional.</p>\n<p><strong>ISummariesDefinition Qos(HistoricalPricing.Qos qos)</strong><br>\nEnforce a specific historical pricing <a href=\"#/sections/content-layer/historical-pricing/qos-types\">Quality of Service</a>.  Optional.  Default: best quality based on permissions.</p>\n<p><strong>ISummariesDefinition Service(string service)</strong><br>\nThe name of the service providing the desired streaming price data.  Optional.  Default: defined within the streaming platform.</p>\n<p><strong>ISummariesDefinition PinStart(bool pinStart)</strong><br>\nDictates the position of the returned data within the time series.  Optional.  Default: false.</p>\n<p><strong>ISummariesDefinition UseChunking(bool useChunking)</strong><br>\nEnables the chunking feature, fetching intraday summaries directly from the CDN. Advised for use with large amounts of data.  Optional.  Default: false.</p>\n<p><strong>ISummariesDefinition ExtendedParams(JObject extendedParams)</strong><br>\nSpecifies the parameters that will be merged with the request.  Optional.</p>\n<p><strong>ISummariesDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ISummariesDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>View</code>, <code>Interval</code>, <code>StartDate</code>, <code>EndDate</code>, <code>Adjustments</code>, <code>MaxCount</code>, <code>Sessions</code>, <code>TimestampLabel</code>, <code>Qos</code>, <code>Service</code>, <code>PinStart</code>, <code>ExtendedParams</code>, <code>Closure</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IChunkDetails, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IChunkDetails, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the chunked data from the backend service. Streams multiple responses as chunks are received and processed, then aggregates them into a single response once all chunks have been processed. Use <code>IChunkDetails</code> to identify the chunk details like index, position, or the total number of records available for that specific chunk.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IChunkDetails, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IChunkDetails, ISummariesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the chunked data from the backend service. To stream chunks as they are retrieved, implement the callback in this overload.</p>\n<p><strong>ISummariesStream GetStream()</strong><br>\n<strong>ISummariesStream GetStream(ISession session)</strong><br>\nRetrieve a streaming interface to manage real-time updates for the specified historical pricing request. See <a href=\"#/sections/content-layer/historical-pricing/summaries/streams/intro\">Summaries.Stream</a>.</p>\n<h4 id=\"streaming-usage\">Streaming usage</h4>\n<p>The following example demonstrates how to retrieve streaming daily summaries for AAPL.O, blending real-time updates into the initial historical snapshot.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar stream = Summaries.Definition(&quot;AAPL.O&quot;)\n                      .Fields(&quot;HIGH_1&quot;, &quot;LOW_1&quot;, &quot;OPEN_PRC&quot;, &quot;TRDPRC_1&quot;, &quot;HST_CLOSE&quot;, &quot;NUM_MOVES&quot;, &quot;ACVOL_UNS&quot;)\n                      .Interval(Summaries.Interval.P1D)\n                      .Count(5)\n                      .GetStream();\n\nstream.OnInsert((data, s) =&gt; Console.WriteLine($&quot;INSERT: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{data.Table}&quot;))\n      .OnUpdate((update, s) =&gt; Console.WriteLine($&quot;UPDATE: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{update.Table}&quot;))\n      .OnStatus((status, s) =&gt; Console.WriteLine($&quot;Received status: {status}&quot;))\n      .OnError((error, s) =&gt; Console.WriteLine($&quot;Received error: {error}&quot;))\n      .BlendRealtimeInSnapshot(true)\n      .Open();\n</code></pre>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ISummariesDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<p>Each entry in <strong>Records</strong> is an <strong>IDataSetRecord</strong> describing the requested <code>Universe</code>, the <code>Fields</code> returned, and the corresponding <code>Data</code> points for that instrument.</p>\n<h4 id=\"usage\">Usage</h4>\n<p>The following examples demonstrates how
