to create a historical pricing summaries definition object for LSEG.L and retrieve data. </p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar definition = Summaries.Definition(&quot;LSEG.L&quot;);\n\nvar summariesData = definition.GetData();\n</code></pre>\n<p>The universe can be specified using either the Definition() method or the Universe() method.\nFor a request to be valid it specify at least one valid universe. </p>\n<p>The following example creates a summaries definition with several details.</p>\n<p>A summary interday interval of 1 Day (Summaries.Interval.P1D) means that the definition will retrieve daily bars. </p>\n<p>Another detail is the Quality of Service (QoS) that is explicitly specified as &quot;delayed&quot;. \nThis means that we are requesting delayed data for the instrument defined in the Universe() method.\nIf no QoS is defined, the definition will attempt to retrieve real-time data. \nIf the user has no permissions to retrieve real time data, it will retrieve delayed data. </p>\n<p>The Fields() method can be used to specify which fields should be retrieved. \nIf no fields are defined, then all the available fields of the instrument will be retrieved.</p>\n<p>The Count() method can be used to specify the maximum number of rows. </p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar response = Summaries.Definition()\n                        .Universe(&quot;AAPL.O&quot;)\n                        .Interval(Summaries.Interval.P1D)\n                        .Qos(HistoricalPricing.Qos.delayed)\n                        .Fields(&quot;DATE&quot;, &quot;HIGH_1&quot;, &quot;LOW_1&quot;)\n                        .Count(1000)\n                        .GetData();\n</code></pre>\n<p>The example below shows how to retrieve data by specifying the interday interval of 1 Month.\nWe can also mention a desired time interval using the Start() and End() methods.   </p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar response = Summaries.Definition(&quot;VOD.L&quot;)\n                        .Interval(Summaries.Interval.P1M) // Interday - 1 Month \n                        .Fields(&quot;TRDPRC_1&quot;, &quot;LOW_1&quot;, &quot;HIGH_1&quot;)\n                        .Start(new DateTime(2022, 1, 1, 0, 0, 0, DateTimeKind.Utc))\n                        .End(&quot;2022-01-10&quot;)\n                        .GetData();\n</code></pre>\n<h3 id=\"summaries-intervals\">Summaries Intervals</h3>\n<p>The list of intervals for interday and intraday for Summaries.Interval</p>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>P1D</td>\n<td>One (1) day (daily) duration Interday interval.</td>\n</tr>\n<tr>\n<td>P7D</td>\n<td>Seven (7) day (weekly) duration Interday interval.</td>\n</tr>\n<tr>\n<td>P1W</td>\n<td>One (1) week (weekly) duration Interday interval.</td>\n</tr>\n<tr>\n<td>P1M</td>\n<td>One (1) month (monthly) duration Interday interval.</td>\n</tr>\n<tr>\n<td>P3M</td>\n<td>Three (3) month (quarterly) duration Interday interval.</td>\n</tr>\n<tr>\n<td>P12M</td>\n<td>Twelve (12) month (yearly) duration Interday interval.</td>\n</tr>\n<tr>\n<td>P1Y</td>\n<td>One (1) year (yearly) duration Interday interval.</td>\n</tr>\n<tr>\n<td>PT1M</td>\n<td>One (1) minute duration Intraday interval.</td>\n</tr>\n<tr>\n<td>PT5M</td>\n<td>Five (5) minute duration Intraday interval.</td>\n</tr>\n<tr>\n<td>PT10M</td>\n<td>Ten (10) minute duration Intraday interval.</td>\n</tr>\n<tr>\n<td>PT30M</td>\n<td>Thirty (30) minute duration Intraday interval.</td>\n</tr>\n<tr>\n<td>PT60M</td>\n<td>Sixty (60) minute (hourly) duration Intraday interval.</td>\n</tr>\n<tr>\n<td>PT1H</td>\n<td>One (1) hours (hourly) duration Intraday interval.</td>\n</tr>\n</tbody></table>\n<h3 id=\"related-links\">Related Links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/historical-pricing/adjusments\">Adjustments</a></li>\n<li><a href=\"#/sections/content-layer/historical-pricing/sessions\">Market sessions</a></li>\n</ul>\n"},{"location":"./sections/content-layer/historical-pricing/summaries/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-historical-pricing-summaries\">About Historical Pricing Summaries</h1>\n<p>The Historical pricing summaries module provides access to the historical pricing intraday and interday summary data, depending on the interval specified, with the ability to filter them by types, such as start time, end time, and market session durations.</p>\n"},{"location":"./sections/content-layer/historical-pricing/summaries/streams/intro","title":"SummariesStream","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-summariesstream-object\">About Summaries.Stream object</h1>\n<p><strong>Summaries.Stream objects</strong> are used to retrieve, process and manage real-time historical pricing summaries (Interday and Intraday bars), blending live updates into the historical summaries retrieved via <a href=\"#/sections/content-layer/historical-pricing/summaries/definition\">Summaries.Definition</a>.</p>\n<h3 id=\"properties\">Properties</h3>\n<p><strong>Stream.State OpenState { get; }</strong><br>\nCurrent state of the stream.</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>State.Pending</td>\n<td>The stream is waiting to be opened or is closed.</td>\n</tr>\n<tr>\n<td>State.Opened</td>\n<td>The stream is open and ready to work.</td>\n</tr>\n<tr>\n<td>State.Closed</td>\n<td>The stream is closed.</td>\n</tr>\n</tbody></table>\n<p><strong>ISession Session { get; }</strong><br>\nSession used to open the stream.</p>\n<p><strong>int LastMsgSeqNum { get; }</strong><br>\nThe sequence number (SeqNumber) for the last real-time message processed. This value can be used to cross-reference the generated INSERT or UPDATE record received.</p>\n<p><strong>JObject InstrumentMetadata { get; }</strong><br>\nThe instrument metadata for the given stream instrument.</p>\n<p><strong>Summaries.Interval Interval { get; }</strong><br>\nThe specified interval for the timeseries bars.</p>\n<p><strong>ISummariesDefinitionParams Definition { get; }</strong><br>\nRetrieve the parameters defined for the streaming request (see <a href=\"#/sections/content-layer/historical-pricing/summaries/definition\">Summaries.Definition Properties</a>).</p>\n<h3 id=\"summaries-stream-interface-methods\">Summaries Stream Interface methods</h3>\n<p><strong>Stream.State Open(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream synchronously. Request the data from the platform and wait until all initial responses have arrived.</p>\n<p><strong>Task&lt;Stream.State&gt; OpenAsync(CancellationToken cancellationToken = default)</strong><br>\nOpen the stream asynchronously.</p>\n<p><strong>void Close()</strong><br>\n<strong>Task CloseAsync()</strong><br>\nClose all opened resources.</p>\n<p><strong>ISummariesStream OnInsert(Action&lt;IDataSet, ISummariesStream&gt; cb)</strong><br>\nCallback invoked upon receiving historical data bars to be inserted at specific points in time.</p>\n<p><strong>ISummariesStream OnUpdate(Action&lt;IDataSet, ISummariesStream&gt; cb)</strong><br>\nCallback invoked upon receiving an update to the most recent historical bar.</p>\n<p><strong>ISummariesStream OnStatus(Action&lt;JObject, ISummariesStream&gt; cb)</strong><br>\nCallback invoked when a stream status event occurs on the service.</p>\n<p><strong>ISummariesStream OnError(Action&lt;string, ISummariesStream&gt; cb)</strong><br>\nCallback invoked if an error occurs resulting from the request.  Required.</p>\n<p><strong>ISummariesStream BlendRealtimeInSnapshot(bool blendRealtimeInSnapshot)</strong><br>\nEnables or disables the blending of real-time updates with the historical data for the initial snapshot retrieval.  Optional.  Default: false.</p>\n<p><strong>ISummariesStream Streaming(bool streaming)</strong><br>\nSpecify whether the stream will deliver the initial image followed by updates. A value of false implies no streaming and that only the initial image will be delivered (a snapshot).  Optional.  Default: true.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to retrieve streaming daily summaries for AAPL.O, blending real-time updates into the initial historical snapshot.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.HistoricalPricing;\n\nvar stream = Summaries.Definition(&quot;AAPL.O&quot;)\n                      .Fields(&quot;HIGH_1&quot;, &quot;LOW_1&quot;, &quot;OPEN_PRC&quot;, &quot;TRDPRC_1&quot;, &quot;HST_CLOSE&quot;, &quot;NUM_MOVES&quot;, &quot;ACVOL_UNS&quot;)\n                      .Interval(Summaries.Interval.P1D)\n                      .Count(5)\n                      .GetStream();\n\nstream.OnInsert((data, s) =&gt; Console.WriteLine($&quot;INSERT: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{data.Table}&quot;))\n      .OnUpdate((update, s) =&gt; Console.WriteLine($&quot;UPDATE: {DateTime.Now}. RT Seqnum: {s.LastMsgSeqNum}\\n{update.Table}&quot;))\n      .OnStatus((status, s) =&gt; Console.WriteLine($&quot;Received status: {status}&quot;))\n      .OnError((error, s) =&gt; Console.WriteLine($&quot;Received error: {error}&quot;))\n      .BlendRealtimeInSnapshot(true)\n      .Open();\n</code></pre>\n"},{"location":"./sections/content-layer/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-the-content-layer\">About the Content Layer</h1>\n<p>The <strong>Content layer</strong> refers to logical market data objects, representing financial items like level 1 market data prices and quotes, Order Books, News, Historical Pricing, Company Research data and so on. \nThese objects are built on top of the <a href=\"#/sections/delivery-layer/intro\">Delivery layer</a> and provide value-add capabilities to manage and access the content within the interface. </p>\n<p>For example, the <a href=\"#/sections/content-layer/pricing/pricing-stream\">Pricing.Stream</a> interface is a thin layer on top of the data services offering realtime market data. </p>\n<p>In addition, interfaces such as <a href=\"#/sections/content-layer/historical-pricing/historical-pricing\">Historical Pricing</a> and Environmental &amp; Social Governance (ESG) are available to allow intuitive access to request and process results. \nWhile the native back-end data format supports <strong>JSON</strong> structured messages, the Content layer conveniently prepares data messages in a <strong>user-friendly format</strong> specific to the programming language. For example, Pandas DataFrames for Python, JSON in TypeScript/JavaScript and .NET.</p>\n<p>Because <strong>Content layer</strong> objects are designed to simplify access to specific Web Services exposed by the Data Platform, these objects have a strong dependency on specific API versions of these services. </p>\n<p>They are easy to use but also service dependant. This is not the case for the object of the Delivery layer that are lower level but also service agnostic. Please refer to the <a href=\"#/sections/delivery-layer/intro\">Delivery layer</a> documentation to learn more about these objects and when to use them.</p>\n<p>The Content layer can easily be used by both professional developers and financial coders. It provides great flexibility for familiar and commonly used financial data models.</p>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/ammortization","title":"Ammortization","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"ammortization\">Ammortization</h1>\n<br>\n\n<h3 id=\"ammortization-frequency\">Ammortization Frequency</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>AmortizationFreq.EveryCoupon</td>\n<td>&#39;EveryCoupon&#39;</td>\n</tr>\n<tr>\n<td>AmortizationFreq.Every2ndCoupon</td>\n<td>&#39;Every2ndCoupon&#39;</td>\n</tr>\n<tr>\n<td>AmortizationFreq.Every3rdCoupon</td>\n<td>&#39;Every3rdCoupon&#39;</td>\n</tr>\n<tr>\n<td>AmortizationFreq.Every4thCoupon</td>\n<td>&#39;Every4thCoupon&#39;</td>\n</tr>\n<tr>\n<td>AmortizationFreq.Every12thCoupon</td>\n<td>&#39;Every12thCoupon&#39;</td>\n</tr>\n</tbody></table>\n<br>\n\n<h3 id=\"ammortization-type\">Ammortization Type</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>AmortizationType.None</td>\n<td>&#39;None&#39;</td>\n</tr>\n<tr>\n<td>AmortizationType.Linear</td>\n<td>&#39;Linear&#39;</td>\n</tr>\n<tr>\n<td>AmortizationType.Annuity</td>\n<td>&#39;Annuity&#39;</td>\n</tr>\n<tr>\n<td>AmortizationType.Schedule</td>\n<td>&#39;Schedule&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/benchmark-yield-selection-mode","title":"BenchmarkYieldSelectionMode","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"bondbenchmarkyieldselectionmode\">Bond.BenchmarkYieldSelectionMode</h1>\n<p><strong>BenchmarkYieldSelectionMode</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>BenchmarkYieldSelectionMode.Nearest</td>\n<td>&#39;Nearest&#39;</td>\n</tr>\n<tr>\n<td>BenchmarkYieldSelectionMode.Interpolate</td>\n<td>&#39;Interpolate&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/bond-adjustment","title":"Adjustment","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"adjustment\">Adjustment</h1>\n<p><strong>Adjustment</strong> for the financial contracts instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Unadjusted</td>\n<td>&#39;Unadjusted&#39;</td>\n</tr>\n<tr>\n<td>Adjusted</td>\n<td>&#39;Adjusted&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/business-day-methods","title":"BusinessDayMethods","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"businessdaymethods\">BusinessDayMethods</h1>\n<p><strong>BusinessDayMethods</strong> enumeration for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>BusinessDayMethods.PreviousBusinessDay</td>\n<td>&#39;PreviousBusinessDay&#39;</td>\n</tr>\n<tr>\n<td>BusinessDayMethods.NextBusinessDay</td>\n<td>&#39;NextBusinessDay&#39;</td>\n</tr>\n<tr>\n<td>BusinessDayMethods.ModifiedFollowing</td>\n<td>&#39;ModifiedFollowing&#39;</td>\n</tr>\n<tr>\n<td>BusinessDayMethods.NoMoving</td>\n<td>&#39;NoMoving&#39;</td>\n</tr>\n<tr>\n<td>BusinessDayMethods.BBSWModifiedFollowing</td>\n<td>&#39;BBSWModifiedFollowing&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/compounding-method","title":"CompoundingMethod","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"compoundingmethod\">CompoundingMethod</h1>\n<p><strong>CompoundingMethod</strong> enumeration for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CompoundingMethod.Compounded</td>\n<td>&#39;Compounded&#39;</td>\n</tr>\n<tr>\n<td>CompoundingMethod.Average</td>\n<td>&#39;Average&#39;</td>\n</tr>\n<tr>\n<td>CompoundingMethod.Constant</td>\n<td>&#39;Constant&#39;</td>\n</tr>\n<tr>\n<td>CompoundingMethod.AdjustedCompounded</td>\n<td>&#39;AdjustedCompounded&#39;</td>\n</tr>\n<tr>\n<td>CompoundingMethod.MexicanCompounded</td>\n<td>&#39;MexicanCompounded&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/date-rolling","title":"DateRolling","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"daterolling\">DateRolling</h1>\n<p><strong>DateRolling</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>DateRolling.Last</td>\n<td>&#39;Last&#39;</td>\n</tr>\n<tr>\n<td>DateRolling.Same</td>\n<td>&#39;Same&#39;</td>\n</tr>\n<tr>\n<td>DateRolling.Last28</td>\n<td>&#39;Last28&#39;</td>\n</tr>\n<tr>\n<td>DateRolling.Same28</td>\n<td>&#39;Same28&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/day-count-methods","title":"DayCountMethods","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"daycountmethods\">DayCountMethods</h1>\n<p><strong>DayCountMethods</strong> enumeration for Bonds:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>DayCountMethods.Dcb_30_360</td>\n<td>&#39;Dcb_30_360&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_360_US</td>\n<td>&#39;Dcb_30_360_US&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30E_30_ISMA</td>\n<td>&#39;Dcb_30E_30_ISMA&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30E_360_ISMA</td>\n<td>&#39;Dcb_30E_360_ISMA&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_360_ISDA</td>\n<td>&#39;Dcb_30_360_ISDA&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_365_ISDA</td>\n<td>&#39;Dcb_30_365_ISDA&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_Actual_ISDA</td>\n<td>&#39;Dcb_30_Actual_ISDA&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_360_German</td>\n<td>&#39;Dcb_30_360_German&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_365_German</td>\n<td>&#39;Dcb_30_365_German&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_Actual_German</td>\n<td>&#39;Dcb_30_Actual_German&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_Actual</td>\n<td>&#39;Dcb_30_Actual&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_360</td>\n<td>&#39;Dcb_Actual_360&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_364</td>\n<td>&#39;Dcb_Actual_364&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_365</td>\n<td>&#39;Dcb_Actual_365&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_Actual</td>\n<td>&#39;Dcb_Actual_Actual&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_Actual_ISDA</td>\n<td>&#39;Dcb_Actual_Actual_ISDA&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_Actual_AFB</td>\n<td>&#39;Dcb_Actual_Actual_AFB&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_WorkingDays_252</td>\n<td>&#39;Dcb_WorkingDays_252&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_365L</td>\n<td>&#39;Dcb_Actual_365L&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_ActualLeapDay_365</td>\n<td>&#39;Dcb_ActualLeapDay_365&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_ActualLeapDay_360</td>\n<td>&#39;Dcb_ActualLeapDay_360&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_36525</td>\n<td>&#39;Dcb_Actual_36525&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_365_CanadianConvention</td>\n<td>&#39;Dcb_Actual_365_CanadianConvention&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Constant</td>\n<td>&#39;Dcb_Constant&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_Actual_365P</td>\n<td>&#39;Dcb_Actual_365P&#39;</td>\n</tr>\n<tr>\n<td>DayCountMethods.Dcb_30_365_Brazil</td>\n<td>&#39;Dcb_30_365_Brazil&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/definition","title":"Bond","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-bond\">About Financial Contracts Bond</h1>\n<p>In this page we exemplify several ways of using bond definitions to retrieve bonds data.</p>\n<h4 id=\"syntax\">Syntax</h4>\n<p><code>Bond.Definition(params string[] instrumentCodes)</code> <br>\n<code>Bond.PricingDefinition()</code> <br>\n<code>Bond.AmortizationItemDefinition(double amount)</code></p>\n<p><code>IBondDefinition</code> exposes a large set of fluent methods to describe every aspect of a bond contract (instrument identification, dates, coupon/rate details, redemption, rounding, pricing parameters, etc.). The examples below demonstrate the most common patterns; the enumerations referenced by these methods are documented in the Related Links below.</p>\n<h4 id=\"retrieving-data\">Retrieving data</h4>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IBondDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IBondDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IBondDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IBondDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<p><strong>IBondDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request.</p>\n<h4 id=\"returned-value\">Returned value</h4>\n<p><code>IBondDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type (<code>Raw</code>, <code>Table</code>, <code>Records</code>, <code>Errors</code>, <code>IsEmpty</code> - see <a href=\"#/sections/content-layer/ipa/financial-contracts/definition\">FinancialContracts.Definition</a>).</p>\n<h4 id=\"bond-helper-builders\">Bond helper builders</h4>\n<p><strong>Bond.PricingDefinition()</strong> returns a <strong>Bond.IPricingDefinition</strong> (properties: <strong>Bond.IPricingRequestParams</strong>), passed to <code>PricingParams()</code> above. It exposes a large set of fluent methods controlling bond pricing calculations - e.g. <code>MarketValueInDealCcy</code>, <code>MarketValueInReportCcy</code>, <code>ProjectedIndexCalculationMethod</code>, <code>ComputeCashFlowFromIssueDate</code>, <code>ComputeCashFlowWithReportCcy</code>, <code>AdjustedCleanPrice</code>, <code>AdjustedDirtyPrice</code>, and more, mirroring the <a href=\"#/sections/content-layer/ipa/financial-contracts/bond/redemption-date-type\">Redemption Date Type</a>, <a href=\"#/sections/content-layer/ipa/financial-contracts/bond/projected-index-calculation-method\">Projected Index Calculation Method</a> and other Related Links enumerations below.</p>\n<p><strong>Bond.AmortizationItemDefinition(double amount)</strong> returns a <strong>Bond.IAmortizationItemDefinition</strong> (properties: <strong>Bond.IAmortizationItemRequestParams</strong>), passed to a bond&#39;s amortization schedule.<br>\n<code>AmortizationFrequency</code>, <code>AmortizationType</code>, <code>StartDate</code>, <code>EndDate</code>, <code>RemainingNotional</code>, <code>Amount</code>.</p>\n<h4 id=\"usage\">Usage</h4>\n<p>The following examples demonstrate how to create various definitions for <strong>Bond</strong> financial contracts: </p>\n<ol>\n<li>A definition for a single bond with defaults </li>\n</ol>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\n\nvar data = Bond.Definition(&quot;US10YT=RR&quot;).GetData();\n</code></pre>\n<ol>\n<li> A definition for multiple bond instruments, requesting a subset out of all available fields. </li>\n</ol>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\n\nvar data = Bond.Definition(&quot;US10YT=RR&quot;, &quot;US20YT=RR&quot;)\n               .Fields(&quot;InstrumentCode&quot;, &quot;BondType&quot;, &quot;EndDate&quot;, &quot;CouponRatePercent&quot;)\n               .GetData();\n</code></pre>\n<ol start=\"3\">\n<li>A definition for a single bond using various property methods.</li>\n</ol>\n<p>Some of these property methods require enumeration values as parameters.\nThe enumeration types used by the property methods are described in the related pages below. </p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\n\nvar data = Bond.Definition().InstrumentCode(&quot;US10YT=RR&quot;)\n                            .IssueDate(&quot;2002-02-28&quot;)\n                            .EndDate(&quot;2032-02-28&quot;)\n                            .NotionalCcy(&quot;USD&quot;)\n                            .InterestPaymentFrequency(Bond.IndexFrequency.Annual)\n                            .FixedRatePercent(7)\n                            .InterestCalculationMethod(Bond.DayCountMethods.Dcb_30_Actual)\n                            .PricingParams(Bond.PricingDefinition().CleanPrice(102))\n                            .Fields(&quot;InstrumentDescription&quot;, &quot;InstrumentCode&quot;, &quot;BondType&quot;, &quot;RIC&quot;,\n                                    &quot;Isin&quot;, &quot;Ticker&quot;, &quot;Cusip&quot;, &quot;IssuePrice&quot;, &quot;CouponRatePercent&quot;,\n                                    &quot;CouponType&quot;, &quot;CouponTypeDescription&quot;)\n                            .GetData();\n</code></pre>\n<ol start=\"4\">\n<li>An example of an invalid bond, where the instrument name can be invalid or unknown </li>\n</ol>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\n\nvar data = Bond.Definition(&quot;JUNK&quot;)\n               .Fields(&quot;InstrumentCode&quot;, &quot;BondType&quot;, &quot;EndDate&quot;, &quot;CouponRatePercent&quot;)\n               .GetData();\n</code></pre>\n<ol start=\"5\">\n<li>A definition for a single bond using <strong>extended parameters</strong> to apply a single parameter </li>\n</ol>\n<p>An equivalent would be to use a Bond defition method like the following: </p>\n<p>&quot; .PricingParams(Bond.PricingDefinition().BenchmarkAtIssueYieldPercent(44)) &quot;</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\n\nvar data = Bond.Definition(&quot;US10YT=RR&quot;).Fields(&quot;InstrumentCode&quot;, &quot;BondType&quot;, &quot;EndDate&quot;)\n                                       .ExtendedParams(new JObject()\n                                       {\n                                           [&quot;pricingParameters&quot;] = new JObject()\n                                           {\n                                               [&quot;benchmarkAtIssueYieldPercent&quot;] = 44\n                                           }\n                                       })\n                                       .GetData();\n</code></pre>\n<h3 id=\"related-links\">Related Links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/bond-adjustment\">Adjustment</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/ammortization\">Ammortization</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/benchmark-yield-selection-mode\">Benchmark Yield</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/business-day-methods\">Business Day Methods</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/compounding-method\">Compounding Methods</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/date-rolling\">Date Rolling</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/day-count-methods\">Day Count Methods</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/direction\">Direction</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/fallback-logic\">Fallback Logic</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/index-frequency\">Index Frequency</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/interest-type\">Interest Type</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/price-side\">Price Side</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/projected-index-calculation-method\">Projected Index Calculation Method</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/redemption-date-type\">Redemption Date Type</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/rounding-type\">Rounding Type</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/rounding\">Rounding</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/stub-rules\">Stub Rules</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/yield-type\">Yield Type</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/output\">Output</a></li>\n</ul>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/direction","title":"Direction","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"direction\">Direction</h1>\n<p><strong>Direction</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</ d>&#39;Every91Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every182Days</td>\n<td>&#39;Every182Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every364Days</td>\n<td>&#39;Every364Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every365Days</td>\n<td>&#39;Every365Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every90Days</td>\n<td>&#39;Every90Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every92Days</td>\n<td>&#39;Every92Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every93Days</td>\n<td>&#39;Every93Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every180Days</td>\n<td>&#39;Every180Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every183Days</td>\n<td>&#39;Every183Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every184Days</td>\n<td>&#39;Every184Days&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Every4Months</td>\n<td>&#39;Every4Months&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.R2</td>\n<td>&#39;R2&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.R4</td>\n<td>&#39;R4&#39;</td>\n</tr>\n<tr>\n<td>IndexFrequency.Zero</td>\n<td>&#39;Zero&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/interest-type","title":"InterestType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"interesttype\">InterestType</h1>\n<p><strong>InterestType</strong> enumeration for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>InterestType.Fixed</td>\n<td>&#39;Fixed&#39;</td>\n</tr>\n<tr>\n<td>InterestType.Float</td>\n<td>&#39;Float&#39;</td>\n</tr>\n<tr>\n<td>InterestType.Stepped</td>\n<td>&#39;Stepped&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-bond\">About Financial Contracts Bond</h1>\n<p>A <strong>Bond</strong> static class allows rong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>RedemptionDateType.RedemptionAtMaturityDate</td>\n<td>&#39;RedemptionAtMaturityDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtCallDate</td>\n<td>&#39;RedemptionAtCallDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtPutDate</td>\n<td>&#39;RedemptionAtPutDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtWorstDate</td>\n<td>&#39;RedemptionAtWorstDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtBestDate</td>\n<td>&#39;RedemptionAtBestDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtSinkDate</td>\n<td>&#39;RedemptionAtSinkDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtParDate</td>\n<td>&#39;RedemptionAtParDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtPremiumDate</td>\n<td>&#39;RedemptionAtPremiumDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtMakeWholeCallDate</td>\n<td>&#39;RedemptionAtMakeWholeCallDate&#39;</td>\n</tr>\n<tr>\n<td>RedemptionDateType.RedemptionAtCustomDate</td>\n<td>&#39;RedemptionAtCustomDate&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/rounding-type","title":"RoundingType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"bondroundingtype\">Bond.RoundingType</h1>\n<p><strong>RoundingType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>RoundingType.Default</td>\n<td>&#39;Default&#39;</td>\n</tr>\n<tr>\n<td>RoundingType.Near</td>\n<td>&#39;Near&#39;</td>\n</tr>\n<tr>\n<td>RoundingType.Up</td>\n<td>&#39;Up&#39;</td>\n</tr>\n<tr>\n<td>RoundingType.Down</td>\n<td>&#39;Down&#39;</td>\n</tr>\n<tr>\n<td>RoundingType.Floor</td>\n<td>&#39;Floor&#39;</td>\n</tr>\n<tr>\n<td>RoundingType.Ceil</td>\n<td>&#39;Ceil&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/rounding","title":"Rounding","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"bondrounding\">Bond.Rounding</h1>\n<p><strong>Rounding</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Rounding.Zero</td>\n<td>&#39;Zero&#39;</td>\n</tr>\n<tr>\n<td>Rounding.One</td>\n<td>&#39;One&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Two</td>\n<td>&#39;Two&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Three</td>\n<td>&#39;Three&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Four</td>\n<td>&#39;Four&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Five</td>\n<td>&#39;Five&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Six</td>\n<td>&#39;Six&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Seven</td>\n<td>&#39;Seven&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Eight</td>\n<td>&#39;Eight&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Default</td>\n<td>&#39;Default&#39;</td>\n</tr>\n<tr>\n<td>Rounding.Unrounded</td>\n<td>&#39;Unrounded&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/stub-rules","title":"StubRules","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"stubrules\">StubRules</h1>\n<p><strong>StubRules</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>StubRules.Issue</td>\n<td>&#39;Issue&#39;</td>\n</tr>\n<tr>\n<td>StubRules.Maturity</td>\n<td>&#39;Maturity&#39;</td>\n</tr>\n<tr>\n<td>StubRules.ShortFirstProRata</td>\n<td>&#39;ShortFirstProRata&#39;</td>\n</tr>\n<tr>\n<td>StubRules.ShortFirstFull</td>\n<td>&#39;ShortFirstFull&#39;</td>\n</tr>\n<tr>\n<td>StubRules.LongFirstFull</td>\n<td>&#39;LongFirstFull&#39;</td>\n</tr>\n<tr>\n<td>StubRules.ShortLastProRata</td>\n<td>&#39;ShortLastProRata&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/bond/yield-type","title":"YieldType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"bondyieldtype\">Bond.YieldType</h1>\n<p><strong>YieldType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>YieldType.Native</td>\n<td>&#39;Native&#39;</td>\n</tr>\n<tr>\n<td>YieldType.UsGovt</td>\n<td>&#39;UsGovt&#39;</td>\n</tr>\n<tr>\n<td>YieldType.UsTBills</td>\n<td>&#39;UsTBills&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Isma</td>\n<td>&#39;Isma&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Euroland</td>\n<td>&#39;Euroland&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Discount_Actual_360</td>\n<td>&#39;Discount_Actual_360&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Discount_Actual_365</td>\n<td>&#39;Discount_Actual_365&#39;</td>\n</tr>\n<tr>\n<td>YieldType.MoneyMarket_Actual_360</td>\n<td>&#39;MoneyMarket_Actual_360&#39;</td>\n</tr>\n<tr>\n<td>YieldType.MoneyMarket_Actual_365</td>\n<td>&#39;MoneyMarket_Actual_365&#39;</td>\n</tr>\n<tr>\n<td>YieldType.MoneyMarket_Actual_Actual</td>\n<td>&#39;MoneyMarket_Actual_Actual&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Bond_Actual_364</td>\n<td>&#39;Bond_Actual_364&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Japanese_Simple</td>\n<td>&#39;Japanese_Simple&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Japanese_Compounded</td>\n<td>&#39;Japanese_Compounded&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Moosmueller</td>\n<td>&#39;Moosmueller&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Braess_Fangmeyer</td>\n<td>&#39;Braess_Fangmeyer&#39;</td>\n</tr>\n<tr>\n<td>YieldType.Weekend</td>\n<td>&#39;Weekend&#39;</td>\n</tr>\n<tr>\n<td>YieldType.TurkishCompounded</td>\n<td>&#39;TurkishCompounded&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/buy-sell","title":"BuySell","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"buysell\">BuySell</h1>\n<p><strong>BuySell</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>FinancialContracts.BuySell.Buy</td>\n<td>&#39;Buy&#39;</td>\n</tr>\n<tr>\n<td>FinancialContracts.BuySell.Sell</td>\n<td>&#39;Sell&#39;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/cap-floor/example","title":"Example","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-capfloor\">About Financial Contracts CapFloor</h1>\n<p>A <strong>CapFloor</strong> is an instrument type that can be requested using the <strong>FinancialContracts</strong> definition. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>FinancialContracts.Definition(JObject capFloorRequest)</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th align=\"left\"><strong>Data type</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>capFloorRequest</td>\n<td>A JObject describing the requested instrument and its details.</td>\n<td align=\"left\">JObject</td>\n<td>No</td>\n<td align=\"left\">null</td>\n</tr>\n</tbody></table>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IFinancialContractsDefinition</code> object.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a <strong>FinancialContractsDefinition</strong> instance by providing a request object for <strong>CapFloor</strong>:</p>\n<pre><code class=\"language-csharp\">using Newtonsoft.Json.Linq;\nusing LSEG.Data.Content.IPA;\nusing LSEG.Data.Core;\n\n    var capFloor = new JObject()\n    {\n        [&quot;fields&quot;] = new JArray(&quot;InstrumentDescription&quot;, &quot;StartDate&quot;, &quot;EndDate&quot;, &quot;InterestPaymentFrequency&quot;, \n                                &quot;IndexRic&quot;, &quot;NotionalCcy&quot;, &quot;NotionalAmount&quot;, &quot;PremiumBp&quot;),\n        [&quot;universe&quot;] = new JArray(new JObject()\n        {\n            [&quot;instrumentType&quot;] = &quot;CapFloor&quot;,\n            [&quot;instrumentDefinition&quot;] = new JObject()\n            {\n                [&quot;stubRule&quot;] = &quot;Maturity&quot;,\n                [&quot;notionalCcy&quot;] = &quot;USD&quot;,\n                [&quot;startDate&quot;] = &quot;2018-06-15&quot;,\n                [&quot;endDate&quot;] = &quot;2022-06-15&quot;,\n                [&quot;notionalAmount&quot;] = 1000000,\n                [&quot;indexName&quot;] = &quot;Composite&quot;,\n                [&quot;indexTenor&quot;] = &quot;5Y&quot;,\n                [&quot;cmsTemplate&quot;] = &quot;USD_SB3L&quot;,\n                [&quot;interestCalculationMethod&quot;] = &quot;Dcb_Actual_360&quot;,\n                [&quot;interestPaymentFrequency&quot;] = &quot;Quarterly&quot;,\n                [&quot;buySell&quot;] = &quot;Buy&quot;,\n                [&quot;capStrikePercent&quot;] = 1\n            }\n        }),\n        [&quot;pricingParameters&quot;] = new JObject()\n        {\n            [&quot;skipFirstCapFloorlet&quot;] = false,\n            [&quot;valuationDate&quot;] = &quot;2020-02-07&quot;\n        }\n    };\n\n    var data = FinancialContracts.Definition(capFloor).GetData();\n</code></pre>\n<p>In the <strong>instrumentDefinition</strong> object, some values could be provided using the enumerations under the LSEG.Data.Content.IPA.Bond namespace.</p>\n<p>The <strong>instrumentType</strong> must be &quot;CapFloor&quot; to retrieve relevant data for this specific case.</p>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/cap-floor/intro","title":"CapFloor","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-capfloor\">About Financial Contracts CapFloor</h1>\n<p>A <strong>CapFloor</strong> is an instrument type that can be requested using the <strong>FinancialContracts</strong> definition with a specific request object. <br></p>\n<p>Example is provided at <a href=\"#/sections/content-layer/ipa/financial-contracts/cap-floor/example\">CapFloor Examples</a></p>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/definition","title":"FinancialContracts.Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"ipafinancialcontractsdefinition-object\">IPA.FinancialContracts.Definition object</h1>\n<p><strong>Definition</strong> allows you to retrieve data about financial instruments within a specific session.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>FinancialContracts.Definition(JObject request = null)</code></p>\n<h3 id=\"financialcontracts-definition-parameters\">FinancialContracts Definition Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>request</td>\n<td>A request object required to price a series of financial contracts to the pricing engine.</td>\n<td>Yes</td>\n<td align=\"left\">null</td>\n</tr>\n</tbody></table>\n<h3 id=\"financialcontractsdefinition-methods\">FinancialContractsDefinition Methods</h3>\n<p><strong>IFinancialContractsDefinition NativeRequestParams(JObject request)</strong><br>\nThe native JSON request. The request object is a flexible interface supporting all IPA Financial Contract interfaces.  Optional.</p>\n<p><strong>IFinancialContractsDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IFinancialContractsDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>NativeRequestParams</code>, <code>Closure</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<p><strong>IFinancialContractsStream GetStream()</strong><br>\n<strong>IFinancialContractsStream GetStream(ISession session)</strong><br>\nRetrieve a streaming interface to manage real-time updates for the specified financial contract.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IFinancialContractsDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type.</p>\n<h3 id=\"idataset---properties\">IDataSet - properties</h3>\n<p>JToken Raw { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;IDataSetRecord&gt; Records { get; }<br>\nJToken Errors { get; }<br>\nbool IsEmpty { get; }<br></p>\n<h3 id=\"ifinancialcontractsstream---properties-and-methods\">IFinancialContractsStream - properties and methods</h3>\n<p><strong>IFinancialContractsStream OnResponse(Action&lt;JArray, IFinancialContractsStream&gt; cb)</strong><br>\nCallback invoked upon receiving a Response message containing the specified fields (the initial image received after opening the stream).</p>\n<p><strong>IFinancialContractsStream OnUpdate(Action&lt;JArray, IFinancialContractsStream&gt; cb)</strong><br>\nCallback invoked upon receiving an Update message containing the updated fields.</p>\n<p><strong>IFinancialContractsStream OnState(Action&lt;JObject, IFinancialContractsStream&gt; cb)</strong><br>\nCallback invoked when a stream state event occurs on the service.</p>\n<p><strong>JArray GetCacheSnapshot { get; }</strong><br>\nRetrieve a snapshot from the live cache.  The snapshot is a copy of the values from the cache.</p>\n<p><strong>JArray Fields { get; }</strong><br>\nRetrieve the list of fields associated with the data returned.</p>\n<p><strong>IFinancialContractsDefinitionParams Definition { get; }</strong><br>\nRetrieve the parameters defined for the streaming request.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example shows how to get data from multiple definitions of multiple FinancialContract groups:</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\n\nvar bondData = Bond.Definition(&quot;US10YT=RR&quot;).GetData();\n\nvar optionEtiData = OptionEti.Definition(&quot;AAPLM192420500.U&quot;).GetData();\n\nvar binaryDefinitionData = OptionFx.BinaryDefinition(OptionFx.BinaryType.OneTouchDeferred, 1.2001)\n                                   .PayoutAmount(1000000)\n                                   .GetData();\n\nvar contractRequestDetails = new JObject()\n{\n    // Details about the universe, definition, other parameters go here\n};\n\nvar financialContractsData = FinancialContracts.Definition(contractRequestDetails).GetData();\n</code></pre>\n<h3 id=\"related-links\">Related links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/output\">Outputs</a></li>\n</ul>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/fx-cross/example","title":"Example","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-fxcross\">About Financial Contracts FxCross</h1>\n<p>A <strong>FxCross</strong> is an instrument type that can be requested using the <strong>FinancialContracts</strong> definition. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>FinancialContracts.Definition(JObject fxCrossRequest)</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th align=\"left\"><strong>Data type</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>fxCrossRequest</td>\n<td>An JObject describing the requested instrument and its details.</td>\n<td align=\"left\">JObject</td>\n<td>No</td>\n<td align=\"left\">null</td>\n</tr>\n</tbody></table>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IFinancialContractsDefinition</code> object.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following examples demonstrate how to create a <strong>FinancialContractsDefinition</strong> instance by providing a request object for <strong>FxCross</strong>:</p>\n<ol>\n<li>An example retrieving specific fields for <strong>FxSpot</strong> instrument type for <strong>USDAUD</strong> instrument code. <br>\nThe universe instrumentType must be <strong>FxCross</strong> and the fxCrossType must be <strong>FxSpot</strong> to retrieve relevant data for this example.</li>\n</ol>\n<pre><code class=\"language-csharp\"> var fxSpotRequest = new JObject()\n {\n     [&quot;fields&quot;] = new JArray(&quot;FxSpot_BidMidAsk&quot;, &quot;Ccy1SpotDate&quot;, &quot;Ccy2SpotDate&quot;, &quot;ErrorCode&quot;),\n     [&quot;universe&quot;] = new JArray(new JObject()\n     {\n         [&quot;instrumentType&quot;] = &quot;FxCross&quot;,\n         [&quot;instrumentDefinition&quot;] = new JObject()\n         {\n             [&quot;fxCrossType&quot;] = &quot;FxSpot&quot;,\n             [&quot;fxCrossCode&quot;] = &quot;USDAUD&quot;\n         }\n     }),\n     [&quot;marketData&quot;] = new JObject()\n     {\n         [&quot;fxSpots&quot;] = new JArray()\n         {\n             new JObject()\n             {\n                 [&quot;spotDefinition&quot;] = new JObject()\n                 {\n                     [&quot;fxCrossCode&quot;] = &quot;AUDUSD&quot;,\n                     [&quot;Source&quot;] = &quot;Composite&quot;\n                 }\n             }\n         }\n     }\n };\n \n var fxSpotData = FinancialContracts.Definition(fxSpotRequest).GetData();\n</code></pre>\n<br>\n\n<ol start=\"2\">\n<li>An example retrieving specific fields for <strong>FxSwap</strong> instrument type for <strong>CHFJPY</strong> instrument code. <br>\nThe universe instrumentType must be <strong>FxCross</strong> and the fxCrossType must be <strong>FxSwap</strong> to retrieve relevant data for this example.</li>\n</ol>\n<pre><code class=\"language-csharp\">var fxSwapRequest = new JObject()\n{\n    [&quot;fields&quot;] = new JArray(&quot;InstrumentDescription&quot;, &quot;ValuationDate&quot;, &quot;EndDate&quot;,\n                            &quot;FxSwapsCcy1&quot;, &quot;FxSwapsCcy2&quot;, &quot;FxSwapsCcy1Ccy2&quot;,\n                            &quot;FxOutrightCcy1Ccy2&quot;),\n    [&quot;universe&quot;] = new JArray(new JObject()\n    {\n        [&quot;instrumentType&quot;] = &quot;FxCross&quot;,\n        [&quot;instrumentDefinition&quot;] = new JObject()\n        {\n            [&quot;fxCrossType&quot;] = &quot;FxSwap&quot;,\n            [&quot;fxCrossCode&quot;] = &quot;CHFJPY&quot;,\n            [&quot;legs&quot;] = new JArray(new JObject()\n            {\n                [&quot;dealCcyBuySell&quot;] = &quot;Buy&quot;,\n                [&quot;fxLegType&quot;] = &quot;SwapNear&quot;,\n                [&quot;dealAmount&quot;] = 1000000,\n                [&quot;contraAmount&quot;] = 897008.3,\n                [&quot;tenor&quot;] = &quot;1M&quot;\n            }, new JObject()\n            {\n                [&quot;dealCcyBuySell&quot;] = &quot;Sell&quot;,\n                [&quot;fxLegType&quot;] = &quot;SwapFar&quot;,\n                [&quot;dealAmount&quot;] = 1000000,\n                [&quot;contraAmount&quot;] = 900000,\n                [&quot;tenor&quot;] = &quot;1Y&quot;\n            })\n        }\n    }),\n    [&quot;pricingParameters&quot;] = new JObject()\n    {\n        [&quot;valuationDate&quot;] = &quot;2018-02-17T00:00:00Z&quot;,\n        [&quot;priceSide&quot;] = &quot;Ask&quot;\n    }\n};\n\nvar data = FinancialContracts.Definition(fxSwapRequest).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/fx-cross/intro","title":"FxCross","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-fxcross\">About Financial Contracts FxCross</h1>\n<p>An <strong>FxCross</strong> is an instrument type that can be requested using the <strong>FinancialContracts</strong> definition with a specific request object. <br></p>\n<p>Example is provided at <a href=\"#/sections/content-layer/ipa/financial-contracts/fx-cross/example\">FxCross Examples</a></p>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/intro","title":"About FinancialContracts","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts\">About Financial Contracts</h1>\n<p><strong>Financial Contracts</strong> allows you to retrieve data about financial instruments using multiple content objects belonging to the Financial Contracts group that includes:</p>\n<ul>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/bond/definition\">Bond</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/cap-floor/intro\">CapFloor</a> </li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/fx-cross/intro\">FxCross</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/intro\">Option</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/swaption/intro\">Swaption</a></li>\n</ul>\n<p>Each asset type (<code>Bond</code>, <code>OptionEti</code>, <code>OptionFx</code>, etc.) implements the common <strong>IFinancialAssetType</strong> interface, exposing a single <code>JToken Serialize()</code> method used internally to package the asset&#39;s parameters into the JSON structure expected by the Financial Contracts endpoint.</p>\n<p>Similarly, the pricing-parameter sub-definitions used by each asset type (e.g. <code>Bond.PricingDefinition()</code>) implement the common <strong>IPricingParameters</strong> interface, also exposing a <code>JToken Serialize()</code> method.</p>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/option/barrier-mode","title":"BarrierMode","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"barriermode\">BarrierMode</h1>\n<p><strong>BarrierMode</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>BarrierMode.European</td>\n<td>&#39;European&#39;</td>\n</tr>\n<tr>\n<td>BarrierMode.American</td>\n<td>&#39;American&#39;</td>\n</tr>\n<tr>\n<td>BarrierMode.ForwardStartWindow</td>\n<td>&#39;ForwardStartWindow&#39;</td>\n</tr>\n<tr>\n<td>BarrierMode.EarlyEndWindow</td>\n<td>&#39;EarlyEndWindow&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/binary-type","title":"BinaryType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"binarytype\">BinaryType</h1>\n<p><strong>BinaryType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>BinaryType.OneTouch</td>\n<td>&#39;OneTouch&#39;</td>\n</tr>\n<tr>\n<td>BinaryType.NoTouch</td>\n<td>&#39;NoTouch&#39;</td>\n</tr>\n<tr>\n<td>BinaryType.Digital</td>\n<td>&#39;Digital&#39;</td>\n</tr>\n<tr>\n<td>BinaryType.OneTouchImmediate</td>\n<td>&#39;OneTouchImmediate&#39;</td>\n</tr>\n<tr>\n<td>BinaryType.OneTouchDeferred</td>\n<td>&#39;OneTouchDeferred&#39;</td>\n</tr>\n</tbody></table>\n<br>\nAll the options apply to **LSEG.Data.Content.IPA.OptionFx**.\n\n<br>\nOnly first 3 options apply to **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/call-put","title":"CallPut","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"financialcontractscallput\">FinancialContracts.CallPut</h1>\n<p><strong>CallPut</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>FinancialContracts.CallPut.Call</td>\n<td>&#39;Call&#39;</td>\n</tr>\n<tr>\n<td>FinancialContracts.CallPut.Put</td>\n<td>&#39;Put&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/dividend-type","title":"DividendType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"dividendtype\">DividendType</h1>\n<p><strong>DividendType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>DividendType.None</td>\n<td>&#39;None&#39;</td>\n</tr>\n<tr>\n<td>DividendType.ForecastTable</td>\n<td>&#39;ForecastTable&#39;</td>\n</tr>\n<tr>\n<td>DividendType.HistoricalYield</td>\n<td>&#39;HistoricalYield&#39;</td>\n</tr>\n<tr>\n<td>DividendType.ForecastYield</td>\n<td>&#39;ForecastYield&#39;</td>\n</tr>\n<tr>\n<td>DividendType.ImpliedYield</td>\n<td>&#39;ImpliedYield&#39;</td>\n</tr>\n<tr>\n<td>DividendType.ImpliedTable</td>\n<td>&#39;ImpliedTable&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/double-binary-type","title":"DoubleBinaryType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionfxdoublebinarytype\">OptionFx.DoubleBinaryType</h1>\n<p><strong>DoubleBinaryType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>DoubleBinaryType.DoubleNoTouch</td>\n<td>&#39;DoubleNoTouch&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies only to **LSEG.Data.Content.IPA.OptionFx**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/exercise-style","title":"ExerciseStyle","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"exercisestyle\">ExerciseStyle</h1>\n<p><strong>ExerciseStyle</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ExerciseStyle.Euro</td>\n<td>&#39;EURO&#39;</td>\n</tr>\n<tr>\n<td>ExerciseStyle.Amer</td>\n<td>&#39;AMER&#39;</td>\n</tr>\n<tr>\n<td>ExerciseStyle.Berm</td>\n<td>&#39;BERM&#39;</td>\n</tr>\n</tbody></table>\n<br>\nAll the options apply to **LSEG.Data.Content.IPA.OptionFx**.\n\n<br>\nOnly first 2 options apply to **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/in-or-out","title":"InOrOut","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optioninorout\">Option.InOrOut</h1>\n<p><strong>InOrOut</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>InOrOut.In</td>\n<td>&#39;In&#39;</td>\n</tr>\n<tr>\n<td>InOrOut.Out</td>\n<td>&#39;Out&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/intro","title":"Option","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-the-financial-contracts-option\">About the Financial Contracts Option</h1>\n<p>An <strong>Option</strong> static class allows to form the financial instrument from the instrument code and parameters.</p>\n<p>Options are grouped in 2 categories: </p>\n<ul>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/option-eti\">Option ETI</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/option-fx\">Option FX</a></li>\n</ul>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/option/option-eti","title":"OptionETI","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-the-financial-contracts-option-eti\">About the Financial Contracts Option ETI</h1>\n<p>Financial Contracts provide 2 main definition for retrieving options data:</p>\n<p><strong>OptionFxDefinition</strong><br>\n<strong>OptionEtiDefinition</strong></p>\n<p>Alternatively, option data can also be retrieved using <strong>FinancialContractsDefinition</strong> with a specific request object.</p>\n<h3 id=\"optionetidefinition---options-methods\">OptionEtiDefinition - options methods</h3>\n<p><strong>InstrumentTag(string tag)</strong><br>\nA user-defined string to identify the instrument.</p>\n<p><strong>InstrumentCode(string code)</strong><br>\nRIC of an ETI option, used to retrieve the option contract description. Optional.<br>If not specified, instrumentCode of UnderlyingDefinition must be provided.</p>\n<p><strong>PricingParams(OptionEti.IEtiPricingDefintion pricing)</strong><br>\nProperties used to control the Fx pricing calculations.</p>\n<p><strong>Fields(params string[] fields)</strong><br>\nThe collection of fields included within the response. Default: all available on the server.</p>\n<p><strong>Fields(IEnumerable<string> fields)</strong><br>\nThe collection of fields included within the response. Default: all available on the server.</p>\n<p><strong>Outputs(params FinancialContracts.Output[] outputs)</strong><br>\nDefines the sections that will be returned within the response.</p>\n<p><strong>Outputs(IEnumerable&lt;FinancialContracts.Output&gt; outputs)</strong><br>\nDefines the sections that will be returned within the response.</p>\n<p><strong>Strike(double strike)</strong><br>\nOption strike price. Required only if pricing an OTC Option.</p>\n<p><strong>BuySell(FinancialContracts.BuySell buySell)</strong><br>\nThe side of the deal.  Optional. Default: Buy.</p>\n<p><strong>CallPut(FinancialContracts.CallPut callPut)</strong><br>\nDefines the type of an option.  Optional. Default: Call.</p>\n<p><strong>ExcerciseStyle(OptionEti.ExerciseStyle style)</strong><br>\nDefines the exercise style of the option.  Optional. Default: Euro.</p>\n<p><strong>EndDate(DateTime date)</strong><br>\nThe Option expiry date expressed in ISO 8601 format. Required only when pricing an OTC Option.</p>\n<p><strong>EndDate(string date)</strong><br>\nThe Option expiry date expressed in ISO 8601 format. Required only when pricing an OTC Option.</p>\n<p><strong>UnderlyingInstrument(string underlying)</strong><br>\nDetails of the underlying Instrument Code.</p>\n<p><strong>AsianDefinition(OptionEti.IEtiAsianDefinition asian)</strong><br>\nAn Asian option is an option type where the payoff depends on the average price of the underlying asset over a certain period of time.</p>\n<p><strong>BarrierDefinition(OptionEti.IEtiBarrierDefintion barrier)</strong><br>\nDetails of a barrier option. Required only when defining a barrier option.</p>\n<p><strong>DoubleBarriersDefinition(OptionEti.IEtiDoubleBarrierDefinition barrier)</strong><br>\nDetails of an FX double barrier option. Required only when defining a barrier option.</p>\n<p><strong>BinaryDefinition(OptionEti.IEtiBinaryDefinition binary)</strong><br>\nDetails of an Fx binary option. Required only when defining a binary option.</p>\n<p><strong>CBBCDefinition(OptionEti.IEtiCbbcDefinition cbbc)</strong><br>\nDetails for CBBC (Call Bear/Bull Contract) option. Required only when defining a CBBC option</p>\n<p><strong>LotSize(double lotSize)</strong><br>\nThe lot size (the number of options bought or sold in one transaction). Optional.  Default: 2.</p>\n<p><strong>DealContract(int contract)</strong><br>\nNumber of contracts bought or sold in the deal.  Optional</p>\n<p><strong>Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.\nThe extended params acts as a fallback measure in case properties are unavailable. \nIt is also an alternative for users that prefer to define the request using native json definitions.</p>\n<p><strong>IOptionEtiDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Fields</code>, <code>Outputs</code>, <code>InstrumentTag</code>, <code>InstrumentCode</code>, <code>Strike</code>, <code>BuySell</code>, <code>CallPut</code>, <code>ExerciseStyle</code>, <code>EndDate</code>, <code>UnderlyingInstrument</code>, <code>PricingDefinition</code>, <code>AsianDefinition</code>, <code>BarrierDefinition</code>, <code>DoubleBarrierDefinition</code>, and more).</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IOptionEtiDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type (<code>Raw</code>, <code>Table</code>, <code>Records</code>, <code>Errors</code>, <code>IsEmpty</code> - see <a href=\"#/sections/content-layer/ipa/financial-contracts/definition\">FinancialContracts.Definition</a>).</p>\n<h3 id=\"sub-definition-builders\">Sub-definition builders</h3>\n<p>The following static builders create the sub-definition objects accepted by <code>PricingParams()</code>, <code>AsianDefinition()</code>, <code>BarrierDefinition()</code>, <code>DoubleBarriersDefinition()</code>, <code>BinaryDefinition()</code> and <code>CBBCDefinition()</code> above. Each exposes its own <code>Properties</code> companion interface (<code>...Params</code>) describing the values within the defined sub-request.</p>\n<p><strong>OptionEti.PricingDefinition()</strong> returns an <strong>IEtiPricingDefintion</strong> (properties: <strong>IEtiPricingDefinitionParams</strong>)<br>\n<code>ValuationDate</code>, <code>MarketDataDate</code>, <code>ReportCcy</code>, <code>MarketValueInDealCcy</code>, <code>PricingModelType</code>, <code>DividendType</code>, <code>DividendYieldPercent</code>, <code>VolatilityPercent</code>, <code>RiskFreeRatePercent</code>, <code>UnderlyingPrice</code>, <code>VolatilityType</code>, <code>OptionPriceSide</code>, <code>OptionTimeStamp</code>, <code>UnderlyingPriceSide</code>, <code>UnderlyingTimeStamp</code>.</p>\n<p><strong>OptionEti.BarrierDefinition(BarrierStyle style, double level)</strong> returns an <strong>IEtiBarrierDefintion</strong> (properties: <strong>IEtiBarrierDefinitionParams</strong>)<br>\n<code>UpOrDown</code>, <code>InOrOut</code>.  <code>BarrierStyle</code> values: <code>None</code>, <code>American</code>, <code>European</code>.</p>\n<p><strong>OptionEti.AsianDefinition</strong> → <strong>IEtiAsianDefinition</strong> (properties: <strong>IEtiAsianDefinitionParams</strong>)<br>\n<code>AverageSoFar</code>, <code>AverageType</code>, <code>FixingCalendar</code>, <code>FixingFrequency</code>, <code>FixingStartDate</code>, <code>FixingEndDate</code>, <code>IncludeHolidays</code>, <code>IncludeWeekends</code>.</p>\n<p><strong>OptionEti.DoubleBarrierDefinition</strong> → <strong>IEtiDoubleBarrierDefinition</strong> (properties: <strong>IEtiDoubleBarrierDefinitionParams</strong>)<br>\n<code>InOrOut</code>.  Properties also expose <code>BarrierMode</code> and the upper/lower <code>Option.IDoubleBarrierInfoDefinition</code> (<code>BarrierUp</code>/<code>BarrierDown</code>).</p>\n<p><strong>OptionEti.BinaryDefinition</strong> → <strong>IEtiBinaryDefinition</strong> (properties: <strong>IEtiBinaryDefinitionParams</strong>)<br>\n<code>NotionalAmount</code>.  Properties also expose <code>BinaryType</code>, <code>Level</code> and <code>UpOrDown</code>.</p>\n<p><strong>OptionEti.CBBCDefinition</strong> → <strong>IEtiCbbcDefinition</strong> (properties: <strong>IEtiCbbcDefinitionParams</strong>)<br>\n<code>ConversionRatio</code>.  Properties also expose <code>Level</code>.</p>\n<h3 id=\"usage\">Usage</h3>\n<ol>\n<li>An example of a simple ETI option with default parameters\n```csharp</li>\n</ol>\n<p>var data = OptionEti.Definition(&quot;AAPLM192420500.U&quot;).GetData();</p>\n<pre><code>\n2. An example of multiple ETI options requesting specific fields data retrieval\n```csharp\nvar data = OptionEti.Definition(&quot;AAPLA192420000.U&quot;, &quot;AAPLA192426000.U&quot;)\n                    .Fields(&quot;InstrumentCode&quot;, &quot;StrikePrice&quot;, &quot;EndDate&quot;, &quot;ExerciseType&quot;,\n                            &quot;OptionPrice&quot;, &quot;UnderlyingRIC&quot;, &quot;ErrorMessage&quot;)\n                    .GetData();\n</code></pre>\n<ol start=\"3\">\n<li><p>An example of an ETI option with multiple specific properties </p>\n<pre><code class=\"language-csharp\">var data  = OptionEti.Definition()\n                  .ExcerciseStyle(OptionEti.ExerciseStyle.Amer)\n                  .Strike(255)\n                  .EndDate(DateTime.Now.AddDays(30))\n                  .BuySell(FinancialContracts.BuySell.Sell)\n                  .CallPut(FinancialContracts.CallPut.Call)\n                  .UnderlyingInstrument(&quot;AAPL.O&quot;)\n                  .Fields(&quot;InstrumentCode&quot;, &quot;ExerciseType&quot;, &quot;ValuationDate&quot;, &quot;EndDate&quot;,\n                          &quot;StrikePrice&quot;, &quot;OptionPrice&quot;, &quot;UnderlyingRIC&quot;, &quot;UnderlyingPrice&quot;,\n                          &quot;ExerciseStyle&quot;, &quot;ErrorMessage&quot;)\n                  .GetData();\n</code></pre>\n</li>\n<li><p>An example of requesting an ETI option using the Financial Contracts definition with a specific request object \n```csharp \nvar eti = new JObject()\n{\n [&quot;universe&quot;] = new JArray(new JObject()\n {</p>\n<pre><code> [&quot;instrumentType&quot;] = &quot;Option&quot;,\n [&quot;instrumentDefinition&quot;] = new JObject()\n {\n     [&quot;InstrumentCode&quot;] = &quot;AAPLM192420500.U&quot;,\n     [&quot;underlyingType&quot;] = &quot;Eti&quot;\n }\n</code></pre>\n<p> })\n};</p>\n</li>\n</ol>\n<p>var data = FinancialContracts.Definition(eti).GetData();</p>\n<pre><code>\n5. An example of requesting multiple ETI options using the Financial Contracts definition with a specific request object \n```csharp \nvar eti = new JObject()\n{\n    [&quot;fields&quot;] = new JArray(&quot;InstrumentCode&quot;, &quot;StrikePrice&quot;, &quot;EndDate&quot;, &quot;ExerciseType&quot;,\n                            &quot;OptionPrice&quot;, &quot;UnderlyingRIC&quot;, &quot;ErrorMessage&quot;),\n    [&quot;universe&quot;] = new JArray(new JObject()\n    {\n        [&quot;instrumentType&quot;] = &quot;Option&quot;,\n        [&quot;instrumentDefinition&quot;] = new JObject()\n        {\n            [&quot;InstrumentCode&quot;] = &quot;AAPLA192420000.U&quot;,\n            [&quot;underlyingType&quot;] = &quot;Eti&quot;\n        }\n    }, new JObject()\n    {\n        [&quot;instrumentType&quot;] = &quot;Option&quot;,\n        [&quot;instrumentDefinition&quot;] = new JObject()\n        {\n            [&quot;InstrumentCode&quot;] = &quot;AAPLA192426000.U&quot;,\n            [&quot;underlyingType&quot;] = &quot;Eti&quot;\n        }\n    })\n};\n\nvar data = FinancialContracts.Definition(eti).GetData();\n</code></pre>\n<ol start=\"6\">\n<li>An example of requesting an ETI option with multiple definition properties usign the Financial Contracts definition with a specific request object.\n```csharp \nvar eti = new JObject()\n{\n [&quot;fields&quot;] = new JArray(&quot;InstrumentCode&quot;, &quot;ExerciseType&quot;, &quot;ValuationDate&quot;, &quot;EndDate&quot;,<pre><code>                     &quot;StrikePrice&quot;, &quot;OptionPrice&quot;, &quot;UnderlyingRIC&quot;, &quot;UnderlyingPrice&quot;,\n                     &quot;ExerciseStyle&quot;, &quot;ErrorMessage&quot;),\n</code></pre>\n [&quot;universe&quot;] = new JArray(new JObject()\n {<pre><code> [&quot;instrumentType&quot;] = &quot;Option&quot;,\n [&quot;instrumentDefinition&quot;] = new JObject()\n {\n     [&quot;underlyingType&quot;] = &quot;Eti&quot;,\n     [&quot;buySell&quot;] = &quot;Sell&quot;,\n     [&quot;callPut&quot;] = &quot;Call&quot;,\n     [&quot;endDate&quot;] = $&quot;{DateTime.Now.AddDays(30):O}&quot;,\n     [&quot;exerciseStyle&quot;] = &quot;Amer&quot;,\n     [&quot;strike&quot;] = 255,\n     [&quot;UnderlyingDefinition&quot;] = new JObject() { [&quot;instrumentCode&quot;] = &quot;AAPL.O&quot; }\n }\n</code></pre>\n })\n};</li>\n</ol>\n<p>var data = FinancialContracts.Definition(eti).GetData();</p>\n<p>```</p>\n<h4 id=\"related-links\">Related Links</h4>\n<ul>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/barrier-mode\">BarrierMode</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/binary-type\">BinaryType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/buy-sell\">BuySell</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/call-put\">CallPut</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/dividend-type\">DividendType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/double-binary-type\">DoubleBinaryType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/exercise-style\">ExerciseStyle</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/in-or-out\">InOrOut</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/pricing-model-type\">PricingModelType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/settlement-type\">SettlementType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/time-stamp\">TimeStamp</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/time-zone\">TimeZone</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/up-or-down\">UpOrDown</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/volatility-model\">VolatilityModel</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/volatility-type\">VolatilityType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/output\">Output</a></li>\n</ul>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/option/option-fx","title":"OptionFX","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-the-financial-contracts-option-fx\">About the Financial Contracts Option FX</h1>\n<p>Financial Contracts provide 2 main definition for retrieving options data:</p>\n<p><strong>OptionFxDefinition</strong><br>\n<strong>OptionEtiDefinition</strong></p>\n<br>\nAlternatively, option data can also be retrieved using **FinancialContractsDefinition** with a specific request object.\n\n<h3 id=\"optionfxdefinition---options-methods\">OptionFxDefinition - options methods</h3>\n<p><strong>InstrumentTag(string tag)</strong><br>\nA user-defined string to identify the instrument.<br></p>\n<p><strong>FxCrossCode(string code)</strong><br>\nThe currency pair. Should contain the two currencies, ex EURUSD.<br></p>\n<p><strong>PricingParams(OptionFx.IFxPricingDefinition pricing)</strong><br>\nProperties used to control the Fx pricing calculations.<br></p>\n<p><strong>Fields(params string[] fields)</strong><br>\nThe collection of fields included within the response. Default: all available on the server.<br></p>\n<p><strong>Fields(IEnumerable<string> fields)</strong><br>\nThe collection of fields included within the response. Default: all available on the server.<br></p>\n<p><strong>Outputs(params FinancialContracts.Output[] outputs)</strong><br>\nDefines the sections that will be returned within the response.<br></p>\n<p><strong>Outputs(IEnumerable&lt;FinancialContracts.Output&gt; outputs)</strong><br>\nDefines the sections that will be returned within the response.<br></p>\n<p><strong>Strike(double strike)</strong><br>\nOption strike price. Required only if pricing an OTC Option.<br></p>\n<p><strong>BuySell(FinancialContracts.BuySell buySell)</strong><br>\nThe side of the deal.  Optional. Default: Buy.<br></p>\n<p><strong>CallPut(FinancialContracts.CallPut callPut)</strong><br>\nDefines the type of an option.  Optional. Default: Call.<br></p>\n<p><strong>ExcerciseStyle(OptionFx.ExerciseStyle style)</strong><br>\nDefines the exercise style of the option.  Optional. Default: Euro.<br></p>\n<p><strong>EndDate(DateTime date)</strong><br>\nThe Option expiry date expressed in ISO 8601 format. Required only when pricing an OTC Option.<br></p>\n<p><strong>EndDate(string date)</strong><br>\nThe Option expiry date expressed in ISO 8601 format. Required only when pricing an OTC Option.<br></p>\n<p><strong>AsianDefinition(OptionFx.IFxAsianDefinition asian)</strong><br>\nAn Asian option is an option type where the payoff depends on the average price of the underlying asset over a certain period of time.</p>\n<p><strong>BarrierDefinition(OptionFx.IFxBarrierDefinition barrier)</strong><br>\nDetails of a barrier option. Required only when defining a barrier option.</p>\n<p><strong>DoubleBarriersDefinition(OptionFx.IFxDoubleBarrierDefinition barrier)</strong><br>\nDetails of an FX double barrier option. Required only when defining a barrier option.</p>\n<p><strong>BinaryDefinition(OptionFx.IFxBinaryDefinition binary)</strong><br>\nDetails of an Fx binary option. Required only when defining a binary option.</p>\n<p><strong>DoubleBinaryDefinition(OptionFx.IFxDoubleBinaryDefinition binary)</strong><br>\nDetails of double binary option. Required only when defining a double binary option.</p>\n<p><strong>ForwardStartDefinition(OptionFx.IFxForwardStartDefinition forward)</strong><br>\nDetails of a forward start option.</p>\n<p><strong>Tenor(string tenor)</strong><br>\nThe tenor of the option (if expiry is not defined).</p>\n<p><strong>DeliveryDate(DateTime date)</strong><br>\nThe delivery date of the option.</p>\n<p><strong>DeliveryDate(string date)</strong><br>\nThe delivery date of the option.</p>\n<p><strong>NotionalAmount(double amount)</strong><br>\nThe unsigned amount of traded currency actually bought or sold.</p>\n<p><strong>NotionalCcy(string ccy)</strong><br>\nThe ISO code of the traded currency. If the option is a EURGBP Call option, the deal currency can be in EUR or GBP.</p>\n<p><strong>SettlementType(Optio
