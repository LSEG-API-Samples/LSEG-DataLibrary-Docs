nFx.SettlementType settlementType)</strong><br>\nSpecifies the delivery type of the binary option.  Optional.  Required if payoutCcy is not specified.</p>\n<p><strong>FxDualCurrencyDefinition(DateTime depositeStartDate, double marginPct = 0)</strong><br>\nDetails for dual currency option.</p>\n<p><strong>FxDualCurrencyDefinition(string depositeStartDate, double marginPct = 0)</strong><br>\nDetails for dual currency option.</p>\n<p><strong>Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.\nThe extended params acts as a fallback measure in case properties are unavailable. \nIt is also an alternative for users that prefer to define the request using native json definitions.</p>\n<p><strong>IOptionFxDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Fields</code>, <code>Outputs</code>, <code>InstrumentTag</code>, <code>FxCrossCode</code>, <code>PricingDefinition</code>, <code>Strike</code>, <code>BuySell</code>, <code>CallPut</code>, <code>ExerciseStyle</code>, <code>EndDate</code>, and more).</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IOptionFxDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type (<code>Raw</code>, <code>Table</code>, <code>Records</code>, <code>Errors</code>, <code>IsEmpty</code> - see <a href=\"#/sections/content-layer/ipa/financial-contracts/definition\">FinancialContracts.Definition</a>).</p>\n<h3 id=\"sub-definition-builders\">Sub-definition builders</h3>\n<p>The following static builders create the sub-definition objects accepted by <code>PricingParams()</code>, <code>AsianDefinition()</code>, <code>BarrierDefinition()</code>, <code>DoubleBarriersDefinition()</code>, <code>BinaryDefinition()</code>, <code>DoubleBinaryDefinition()</code>, <code>ForwardStartDefinition()</code> and <code>FxDualCurrencyDefinition()</code> above. Each exposes its own <code>Properties</code> companion interface (<code>...Params</code>) describing the values within the defined sub-request.</p>\n<p><strong>OptionFx.PricingDefinition()</strong> returns an <strong>IFxPricingDefinition</strong> (properties: <strong>IFxPricingDefinitionParams</strong>)<br>\n<code>ValuationDate</code>, <code>MarketDataDate</code>, <code>ReportCcy</code>, <code>MarketValueInDealCcy</code>, <code>PricingModelType</code>, <code>PriceSide</code>, <code>VolatilityModel</code>, <code>FxSwapCalculationMethod</code>, <code>FxSpotObject</code>, <code>AtmVolatilityObject</code>, <code>RiskReversal10DObject</code>, <code>RiskReversal25DObject</code>, <code>Butterfly10DObject</code>, <code>Butterfly25DObject</code>, <code>ForwardPointsObject</code>, <code>ForeignDepositRatePercentObject</code>, <code>DomesticDepositRatePercentObject</code>, <code>ImpliedVolatilityObject</code>, <code>CutoffTimeZone</code>, <code>CutoffTime</code>.  <code>FxSwapCalculationMethod</code> is an <strong>OptionFx.SwapCalculationMethod</strong> value: <code>FxSwap</code>, <code>FxSwapImpliedFromDeposit</code>, <code>DepositCcy1ImpliedFromFxSwap</code>, <code>DepositCcy2ImpliedFromFxSwap</code>.</p>\n<p><strong>OptionFx.BidAskMidDefinition()</strong> returns an <strong>IBidAskMid</strong> (properties: <strong>IBidAskMidParams</strong>)<br>\n<code>Bid</code>, <code>Ask</code>, <code>Mid</code>.  Used to supply the <code>*Object</code> parameters of <code>PricingDefinition()</code> above (e.g. <code>FxSpotObject</code>, <code>AtmVolatilityObject</code>).</p>\n<p><strong>OptionFx.AsianDefinition</strong> → <strong>IFxAsianDefinition</strong> (properties: <strong>IFxAsianDefinitionParams</strong>)<br>\n<code>AverageSoFar</code>, <code>AverageType</code>, <code>FixingFrequency</code>, <code>FixingRicSource</code>, <code>FixingStartDate</code>, <code>FixingEndDate</code>, <code>IncludeHolidays</code>, <code>IncludeWeekends</code>.</p>\n<p><strong>OptionFx.BarrierDefinition(double level)</strong> → <strong>IFxBarrierDefinition</strong> (properties: <strong>IFxBarrierDefinitionParams</strong>)<br>\n<code>BarrierMode</code>, <code>UpOrDown</code>, <code>InOrOut</code>, <code>WindowStartDate</code>, <code>WindowEndDate</code>, <code>RebateAmount</code>.</p>\n<p><strong>OptionFx.DoubleBarrierDefinition</strong> → <strong>IFxDoubleBarrierDefinition</strong> (properties: <strong>IFxDoubleBarrierDefinitionParams</strong>)<br>\nNo direct setters; properties expose <code>BarrierMode</code> and the upper/lower <code>Option.IDoubleBarrierInfoDefinition</code> (<code>BarrierUp</code>/<code>BarrierDown</code>).</p>\n<p><strong>OptionFx.BinaryDefinition</strong> → <strong>IFxBinaryDefinition</strong> (properties: <strong>IFxBinaryDefinitionParams</strong>)<br>\n<code>PayoutAmount</code>, <code>PayoutCcy</code>.  Properties also expose <code>BinaryType</code>, <code>Trigger</code> and <code>SettlementType</code>.</p>\n<p><strong>OptionFx.DoubleBinaryDefinition</strong> → <strong>IFxDoubleBinaryDefinition</strong> (properties: <strong>IFxDoubleBinaryDefinitionParams</strong>)<br>\n<code>SettlementType</code>, <code>PayoutAmount</code>, <code>PayoutCcy</code>.  Properties also expose <code>BinaryType</code>, <code>TriggerUp</code> and <code>TriggerDown</code>.</p>\n<p><strong>OptionFx.ForwardStartDefinition</strong> → <strong>IFxForwardStartDefinition</strong> (properties: <strong>IFxForwardStartDefinitionParams</strong>)<br>\n<code>ForwardStartDate</code>.  Properties also expose <code>ForwardStartTenor</code> and <code>StrikePercent</code>.</p>\n<p><strong>IFxDualCurrencyDefinition</strong> (properties: <strong>IFxDualCurrencyDefinitionParams</strong>)<br>\nProvides the details on the dual currency deposit terms (can be combined with the vanilla option definition, <code>FxBarrierDefinition</code> or <code>FxDoubleBarrierDefinition</code>). No direct setters; properties expose <code>DepositStartDate</code> and <code>MarginPercent</code>.</p>\n<h3 id=\"usage\">Usage</h3>\n<ol>\n<li>An example of an OptionFx pricing definition with multiple properties specified<pre><code class=\"language-csharp\">var pricing = OptionFx.PricingDefinition().CutoffTimeZone(OptionFx.CutoffTimeZone.GMT)\n                                       .FxSpotObject(OptionFx.BidAskMidDefinition().Mid(2.5))\n                                       .CutoffTime(&quot;1500PM&quot;)\n                                       .PricingModelType(OptionFx.PricingModelType.VannaVolga);\n</code></pre>\n<br></li>\n<li>An example of an OptionFx binary definition with multiple properties specified</li>\n</ol>\n<pre><code class=\"language-csharp\">var binaryDefinition = OptionFx\n    .BinaryDefinition(OptionFx.BinaryType.OneTouchDeferred, 1.2001)\n    .PayoutAmount(1000000);\n</code></pre>\n<br>\n\n<ol start=\"3\">\n<li>An example of an OptionFx definition with multiple properties specified<pre><code class=\"language-csharp\">var data = OptionFx.Definition().Fields(&quot;FxCrossCode&quot;, &quot;EndDate&quot;, &quot;ForeignCcy&quot;, &quot;FxSwap&quot;, &quot;ErrorMessage&quot;)\n                             .FxCrossCode(&quot;EURUSD&quot;)\n                             .SettlementType(OptionFx.SettlementType.Cash)\n                             .Tenor(&quot;1M&quot;)\n                             .BinaryDefinition(binary)\n                             .PricingParams(pricing)\n                             .GetData();\n</code></pre>\n</li>\n</ol>\n<br>\n\n<ol start=\"4\">\n<li>An example of requesting an OptionFx data using the Financial Contracts definition with a specific request object \n```csharp \n// FX Option (include some pricing and binary properties)\nvar fx = new JObject()\n{\n [&quot;fields&quot;] = new JArray(&quot;FxCrossCode&quot;, &quot;EndDate&quot;, &quot;ForeignCcy&quot;, &quot;FxSwap&quot;, &quot;ErrorMessage&quot;),\n [&quot;universe&quot;] = new JArray(new JObject()\n {<pre><code> [&quot;instrumentType&quot;] = &quot;Option&quot;,\n [&quot;instrumentDefinition&quot;] = new JObject()\n {\n     [&quot;underlyingType&quot;] = &quot;Fx&quot;,\n     [&quot;UnderlyingDefinition&quot;] = new JObject() { [&quot;fxCrossCode&quot;] = &quot;EURUSD&quot; },\n     [&quot;binaryDefinition&quot;] = new JObject()\n     {\n         [&quot;binaryType&quot;] = &quot;OneTouchDeferred&quot;,\n         [&quot;trigger&quot;] = 1.2001,\n         [&quot;payoutAmount&quot;] = 1000000\n     },\n     [&quot;settlementType&quot;] = &quot;Cash&quot;,\n     [&quot;tenor&quot;] = &quot;1M&quot;\n }\n</code></pre>\n }),\n [&quot;pricingParameters&quot;] = new JObject()\n {<pre><code> [&quot;pricingModelType&quot;] = &quot;VannaVolga&quot;,\n [&quot;fxSpotObject&quot;] = new JObject() { [&quot;mid&quot;] = 2.5 },\n [&quot;cutoffTimeZone&quot;] = &quot;GMT&quot;,\n [&quot;CutoffTime&quot;] = &quot;1500PM&quot;\n</code></pre>\n }\n};</li>\n</ol>\n<p>var data = FinancialContracts.Definition(fx).GetData();</p>\n<p>```</p>\n<h4 id=\"related-links\">Related Links</h4>\n<ul>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/barrier-mode\">BarrierMode</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/binary-type\">BinaryType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/buy-sell\">BuySell</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/call-put\">CallPut</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/dividend-type\">DividendType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/double-binary-type\">DoubleBinaryType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/exercise-style\">ExerciseStyle</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/in-or-out\">InOrOut</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/pricing-model-type\">PricingModelType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/settlement-type\">SettlementType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/time-stamp\">TimeStamp</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/time-zone\">TimeZone</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/up-or-down\">UpOrDown</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/volatility-model\">VolatilityModel</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/option/volatility-type\">VolatilityType</a></li>\n<li><a href=\"#/sections/content-layer/ipa/financial-contracts/output\">Output</a></li>\n</ul>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/option/pricing-model-type","title":"PricingModelType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionpricingmodeltype\">Option.PricingModelType</h1>\n<p><strong>PricingModelType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>PricingModelType.BlackScholes</td>\n<td>&#39;BlackScholes&#39;</td>\n</tr>\n<tr>\n<td>PricingModelType.Whaley</td>\n<td>&#39;Whaley&#39;</td>\n</tr>\n<tr>\n<td>PricingModelType.Binomial</td>\n<td>&#39;Binomial&#39;</td>\n</tr>\n<tr>\n<td>PricingModelType.Trinomial</td>\n<td>&#39;Trinomial&#39;</td>\n</tr>\n<tr>\n<td>PricingModelType.VannaVolga</td>\n<td>&#39;VannaVolga&#39;</td>\n</tr>\n</tbody></table>\n<br>\nAll the options apply to **LSEG.Data.Content.IPA.OptionFx**.\n\n<br>\nThe last option does not apply to **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/settlement-type","title":"SettlementType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionfxsettlementtype\">OptionFx.SettlementType</h1>\n<p><strong>SettlementType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>SettlementType.Cash</td>\n<td>&#39;Cash&#39;</td>\n</tr>\n<tr>\n<td>SettlementType.Asset</td>\n<td>&#39;Asset&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies only to **LSEG.Data.Content.IPA.OptionFx**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/time-stamp","title":"Timestamp","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionoptionselection\">Option.OptionSelection</h1>\n<p><strong>OptionSelection</strong> for the financial instruments defines how the timestamp of the option is selected:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>OptionSelection.Open</td>\n<td>&#39;Open&#39;</td>\n</tr>\n<tr>\n<td>OptionSelection.Close</td>\n<td>&#39;Close&#39;</td>\n</tr>\n<tr>\n<td>OptionSelection.Default</td>\n<td>&#39;Default&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/time-zone","title":"TimeZone","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionfxcutofftimezone\">OptionFx.CutoffTimeZone</h1>\n<p><strong>CutoffTimeZone</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>CutoffTimeZone.BJS</td>\n<td>&#39;BJS&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.BKK</td>\n<td>&#39;BKK&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.BOM</td>\n<td>&#39;BOM&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.BUD</td>\n<td>&#39;BUD&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.FFT</td>\n<td>&#39;FFT&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.HKG</td>\n<td>&#39;HKG&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.KUL</td>\n<td>&#39;KUL&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.LON</td>\n<td>&#39;LON&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.MNL</td>\n<td>&#39;MNL&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.NYC</td>\n<td>&#39;NYC&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.SAO</td>\n<td>&#39;SAO&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.SEL</td>\n<td>&#39;SEL&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.SIN</td>\n<td>&#39;SIN&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.TPE</td>\n<td>&#39;TPE&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.TOK</td>\n<td>&#39;TOK&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.WAW</td>\n<td>&#39;WAW&#39;</td>\n</tr>\n<tr>\n<td>CutoffTimeZone.GMT</td>\n<td>&#39;GMT&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/up-or-down","title":"UpOrDown","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionupordown\">Option.UpOrDown</h1>\n<p><strong>UpOrDown</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>UpOrDown.Up</td>\n<td>&#39;Up&#39;</td>\n</tr>\n<tr>\n<td>UpOrDown.Down</td>\n<td>&#39;Down&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/volatility-model","title":"VolatilityModel","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"optionfxvolatilitymodel\">OptionFx.VolatilityModel</h1>\n<p><strong>VolatilityModel</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>VolatilityModel.SABR</td>\n<td>&#39;SABR&#39;</td>\n</tr>\n<tr>\n<td>VolatilityModel.CubicSpline</td>\n<td>&#39;CubicSpline&#39;</td>\n</tr>\n<tr>\n<td>VolatilityModel.SVI</td>\n<td>&#39;SVI&#39;</td>\n</tr>\n<tr>\n<td>VolatilityModel.TwinLognormal</td>\n<td>&#39;TwinLognormal&#39;</td>\n</tr>\n<tr>\n<td>VolatilityModel.VannaVolga</td>\n<td>&#39;VannaVolga&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies only to **LSEG.Data.Content.IPA.OptionFx**."},{"location":"./sections/content-layer/ipa/financial-contracts/option/volatility-type","title":"VolatilityType","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"volatilitytype\">VolatilityType</h1>\n<p><strong>VolatilityType</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>VolatilityType.Implied</td>\n<td>&#39;Implied&#39;</td>\n</tr>\n<tr>\n<td>VolatilityType.SVISurface</td>\n<td>&#39;SVISurface&#39;</td>\n</tr>\n</tbody></table>\n<br>\nThis enumeration applies to both **LSEG.Data.Content.IPA.OptionFx** and **LSEG.Data.Content.IPA.OptionEti**."},{"location":"./sections/content-layer/ipa/financial-contracts/output","title":"Output","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"output\">Output</h1>\n<p><strong>Output</strong> for the financial instruments:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>FinancialContracts.Output.Headers</td>\n<td>&#39;Headers&#39;</td>\n</tr>\n<tr>\n<td>FinancialContracts.Output.Statuses</td>\n<td>&#39;Statuses&#39;</td>\n</tr>\n<tr>\n<td>FinancialContracts.Output.Data</td>\n<td>&#39;Data&#39;</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>Headers</strong>: Include the header details including the requested fields and their types within the response.</li>\n<li><strong>Data</strong>: The Data elements generated from the server. This data object will contain rows for each instrument object defined in the universe and columns for each calculation field defined in the fields of the request. This is the main output, which contains the requested calculations, and is mandatory.</li>\n<li><strong>Statuses</strong>: Defines the collection of status codes corresponding to the fields within the response:<ul>\n<li>0 - Not Applicable. There is no applicable status for this field.</li>\n<li>1 - User Override. This data item was provided in the request.</li>\n<li>2 - From Market Data. This data has been derived from market data (e.g. interpolated).</li>\n<li>3 - Computed output. This field has been computed.</li>\n<li>4 - Error. The calculation has returned an error. If you need more details about the returned error, specify the &quot;ErrorCode&quot; and/or &quot;ErrorMessage&quot; properties in the fields array and send the request again.</li>\n</ul>\n</li>\n</ul>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/swaption/example","title":"Example","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-swaption\">About Financial Contracts Swaption</h1>\n<p>A <strong>Swaption</strong> is an instrument type that can be requested using the <strong>FinancialContracts</strong> definition. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>FinancialContracts.Definition(JObject swaptionRequest)</code></p>\n<h4 id=\"parameters\">Parameters</h4>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th align=\"left\"><strong>Data type</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>swaptionRequest</td>\n<td>A JObject describing the requested instrument and its details.</td>\n<td align=\"left\">JObject</td>\n<td>No</td>\n<td align=\"left\">null</td>\n</tr>\n</tbody></table>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IFinancialContractsDefinition</code> object.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a <strong>FinancialContractsDefinition</strong> instance by providing a request object for <strong>Swaption</strong>:\nWe will try to use as many options as possible in one example, but the request object can be modified to fit particular needs. </p>\n<pre><code class=\"language-csharp\"> // Swaption\nvar swaption = new JObject()\n{\n    [&quot;fields&quot;] = new JArray(&quot;InstrumentDescription&quot;, &quot;ValuationDate&quot;, &quot;ExpiryDate&quot;,\n                            &quot;OptionType&quot;, &quot;ExerciseStyle&quot;, &quot;NotionalAmount&quot;, &quot;ErrorMessage&quot;,\n                            &quot;NotionalCcy&quot;, &quot;SettlementType&quot;, &quot;SettlementCcy&quot;,\n                            &quot;Tenor&quot;, &quot;UnderlyingTenor&quot;, &quot;StrikePercent&quot;,\n                            &quot;MarketValueInDealCcy&quot;, &quot;PremiumPercent&quot;, &quot;ForwardPremiumInDealCcy&quot;,\n                            &quot;ImpliedVolatilityPercent&quot;, &quot;DeltaPercent&quot;, &quot;DeltaAmountInDealCcy&quot;,\n                            &quot;ThetaAmountInDealCcy&quot;, &quot;VegaAmountInDealCcy&quot;, &quot;GammaAmountInDealCcy&quot;,\n                            &quot;DiscountCurveName&quot;, &quot;ForwardCurveName&quot;),\n    [&quot;universe&quot;] = new JArray(new JObject()\n    {\n        [&quot;instrumentType&quot;] = &quot;Swaption&quot;,\n        [&quot;instrumentDefinition&quot;] = new JObject()\n        {\n            [&quot;settlementType&quot;] = &quot;Cash&quot;,\n            [&quot;tenor&quot;] = &quot;7Y&quot;,\n            [&quot;strikePercent&quot;] = 2.75,\n            [&quot;buySell&quot;] = &quot;Buy&quot;,\n            [&quot;callPut&quot;] = &quot;Call&quot;,\n            [&quot;exerciseStyle&quot;] = &quot;BERM&quot;,\n            [&quot;bermudanSwaptionDefinition&quot;] = new JObject() { [&quot;exerciseScheduleType&quot;] = &quot;FloatLeg&quot; },\n            [&quot;underlyingDefinition&quot;] = new JObject()\n            {\n                [&quot;tenor&quot;] = &quot;3Y&quot;,\n                [&quot;template&quot;] = &quot;NOK_AB6O&quot;\n            }\n        },\n        [&quot;pricingParameters&quot;] = new JObject() { [&quot;valuationDate&quot;] = &quot;2020-04-24&quot; }\n    })\n};\n\nvar swaptionData = FinancialContracts.Definition(swaption).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/ipa/financial-contracts/swaption/intro","title":"Swaption","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-financial-contracts-swaption\">About Financial Contracts Swaption</h1>\n<p>An <strong>Swaption</strong> is an instrument type that can be requested using the <strong>FinancialContracts</strong> definition using a specific request object <br></p>\n<p>Example is provided at <a href=\"#/sections/content-layer/ipa/financial-contracts/swaption/example\">Swaption Examples</a></p>\n"},{"location":"./sections/content-layer/ipa/surfaces/definition","title":"VolatilitySurface.Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"ipavolatilitysurfacedefinition-object\">IPA.VolatilitySurface.Definition object</h1>\n<p><strong>Definition</strong> allows you to retrieve Volatility Surface data within a specific session.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>VolatilitySurface.Definition(JObject request = null)</code></p>\n<h3 id=\"volatilitysurface-definition-parameters\">VolatilitySurface Definition Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>request</td>\n<td>A request object required to price a Volatility Surface.</td>\n<td>Yes</td>\n<td align=\"left\">null</td>\n</tr>\n</tbody></table>\n<h3 id=\"volatilitysurfacedefinition-methods\">VolatilitySurfaceDefinition Methods</h3>\n<p><strong>IVolatilitySurfaceDefinition NativeRequestParams(JObject request)</strong><br>\nThe native JSON request. The request object is a flexible interface supporting all IPA Financial Contract interfaces.  Optional.</p>\n<p><strong>IVolatilitySurfaceDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IFinancialContractsDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>NativeRequestParams</code>, <code>Closure</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IDataSetResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IDataSetResponse GetData(ISession session, Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IDataSetResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IDataSetResponse&gt; GetDataAsync(ISession session, Action&lt;IDataSetResponse, IFinancialContractsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IVolatilitySurfaceDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IDataSetResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IDataSet</strong> type (<code>Raw</code>, <code>Table</code>, <code>Records</code>, <code>Errors</code>, <code>IsEmpty</code> - see <a href=\"#/sections/content-layer/ipa/financial-contracts/definition\">FinancialContracts.Definition</a>).</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to request an ETI and an FX Volatility Surface using native request objects:</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.IPA;\nusing Newtonsoft.Json.Linq;\n\nvar etiSurface = new JObject()\n{\n    [&quot;surfaceTag&quot;] = &quot;myEti&quot;,\n    [&quot;underlyingType&quot;] = &quot;Eti&quot;,\n    [&quot;underlyingDefinition&quot;] = new JObject()\n    {\n        [&quot;instrumentCode&quot;] = &quot;BNPP.PA&quot;\n    },\n    [&quot;surfaceParameters&quot;] = new JObject()\n    {\n        [&quot;priceSide&quot;] = &quot;Mid&quot;,\n        [&quot;volatilityModel&quot;] = &quot;SSVI&quot;,\n        [&quot;xAxis&quot;] = &quot;Date&quot;,\n        [&quot;yAxis&quot;] = &quot;Moneyness&quot;\n    },\n    [&quot;surfaceLayout&quot;] = new JObject()\n    {\n        [&quot;format&quot;] = &quot;Matrix&quot;,\n        [&quot;yPointCount&quot;] = 10\n    }\n};\n\nvar fxSurface = new JObject()\n{\n    [&quot;surfaceTag&quot;] = &quot;myFx&quot;,\n    [&quot;underlyingType&quot;] = &quot;Fx&quot;,\n    [&quot;underlyingDefinition&quot;] = new JObject()\n    {\n        [&quot;fxCrossCode&quot;] = &quot;EURUSD&quot;\n    },\n    [&quot;surfaceParameters&quot;] = new JObject()\n    {\n        [&quot;calculationDate&quot;] = &quot;2018-08-20T00:00:00Z&quot;,\n        [&quot;returnAtm&quot;] = true,\n        [&quot;xAxis&quot;] = &quot;Date&quot;,\n        [&quot;yAxis&quot;] = &quot;Strike&quot;\n    },\n    [&quot;surfaceLayout&quot;] = new JObject()\n    {\n        [&quot;format&quot;] = &quot;Matrix&quot;\n    }\n};\n\nvar requestDetails = new JObject()\n{\n    [&quot;universe&quot;] = new JArray(etiSurface, fxSurface)\n};\n\nvar response = VolatilitySurface.Definition(requestDetails).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/ipa/surfaces/intro","title":"About Surfaces","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-curves-and-surfaces\">About Curves and Surfaces</h1>\n<p><strong>Volatility Surface</strong> data can be retrieved at the Content layer using the <a href=\"#/sections/content-layer/ipa/surfaces/definition\">VolatilitySurface.Definition</a> object, similar to <a href=\"#/sections/content-layer/ipa/financial-contracts/definition\">FinancialContracts.Definition</a>.<br></p>\n<p>Alternatively, the same data can also be retrieved using the <strong>EndpointRequestDefinition</strong> at the <strong>Delivery</strong> layer, as shown below.</p>\n<p>An example is provided below as follows: </p>\n<pre><code class=\"language-csharp\">\n var etiSurface = new JObject()\n {\n     [&quot;surfaceTag&quot;] = &quot;myEti&quot;,\n     [&quot;underlyingType&quot;] = &quot;Eti&quot;,\n     [&quot;underlyingDefinition&quot;] = new JObject()\n     {\n         [&quot;instrumentCode&quot;] = &quot;BNPP.PA&quot;\n     },\n     [&quot;surfaceParameters&quot;] = new JObject()\n     {\n         [&quot;priceSide&quot;] = &quot;Mid&quot;,\n         [&quot;volatilityModel&quot;] = &quot;SSVI&quot;,\n         [&quot;xAxis&quot;] = &quot;Date&quot;,\n         [&quot;yAxis&quot;] = &quot;Moneyness&quot;\n     },\n     [&quot;surfaceLayout&quot;] = new JObject()\n     {\n         [&quot;format&quot;] = &quot;Matrix&quot;,\n         [&quot;yPointCount&quot;] = 10\n     }\n };\n\n var fxSurface = new JObject()\n {\n     [&quot;surfaceTag&quot;] = &quot;myFx&quot;,\n     [&quot;underlyingType&quot;] = &quot;Fx&quot;,\n     [&quot;underlyingDefinition&quot;] = new JObject()\n     {\n         [&quot;fxCrossCode&quot;] = &quot;EURUSD&quot;\n     },\n     [&quot;surfaceParameters&quot;] = new JObject()\n     {\n         [&quot;calculationDate&quot;] = &quot;2018-08-20T00:00:00Z&quot;,\n         [&quot;returnAtm&quot;] = true,\n         [&quot;xAxis&quot;] = &quot;Date&quot;,\n         [&quot;yAxis&quot;] = &quot;Strike&quot;\n     },\n     [&quot;surfaceLayout&quot;] = new JObject()\n     {\n         [&quot;format&quot;] = &quot;Matrix&quot;\n     }\n };\n\n var requestDetails = new JObject()\n {\n     [&quot;universe&quot;] = new JArray(etiSurface, fxSurface)\n };\n\n var response = EndpointRequest.Definition(intradayEndpoint)\n                               .Method(EndpointRequest.Method.POST)\n                               .BodyParameters(requestDetails)\n                               .GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/news/analyze","title":"Analyze","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"analyze\">Analyze</h1>\n<h3 id=\"description\">Description</h3>\n<p>Computes a tree expression from a user query string. <br>\nBreaks down a user query string into News related entities, then aggregates them into a boolean filtering tree.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Analyze.Definition()</code><br>\n<code>Analyze.Definition(string query)</code></p>\n<h3 id=\"analyzedefinition-methods\">AnalyzeDefinition Methods</h3>\n<p><strong>IAnalyzeDefinition Query(string query)</strong><br>\nA news query expression.  Optional.  Default: no query conditions.</p>\n<p><strong>IAnalyzeDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IAnalyzeDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IAnalyzeDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Query</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IAnalyzeResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IAnalyzeResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IAnalyzeResponse GetData(Action&lt;IAnalyzeResponse, IAnalyzeDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IAnalyzeResponse GetData(ISession session, Action&lt;IAnalyzeResponse, IAnalyzeDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IAnalyzeResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IAnalyzeResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IAnalyzeResponse&gt; GetDataAsync(Action&lt;IAnalyzeResponse, IAnalyzeDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IAnalyzeResponse&gt; GetDataAsync(ISession session, Action&lt;IAnalyzeResponse, IAnalyzeDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IAnalyzeDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IAnalyzeResponse</strong> object (implements <code>IResponse</code>). Unlike the other News responses, the response object&#39;s &quot;<strong>Data</strong>&quot; property is a plain <code>JObject</code> representing the computed tree expression - there is no nested data interface.</p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">    // Analyze the following news query string\n    string query = &quot;AA&quot;;   // All Alerts\n    \n    //query = &quot;PresetTopic:[Energy Market] AND &#39;carbon&#39;&quot;;\n    var response = Analyze.Definition(query).GetData();\n\n    var tree = response.Data; // JObject representing the boolean filtering tree\n</code></pre>\n"},{"location":"./sections/content-layer/news/headlines","title":"Headlines","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"headlines\">Headlines</h1>\n<p>Headlines news data can be retrieved as a list of headlines using the Headlines definition.<br></p>\n<p>Each headline contains a raw content field, a story ID, a headline title and several metadata fields. <br></p>\n<p>These metadata fields contain information about the creators, sources, languages, subjects and instrument codes.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Headlines.Definition()</code></p>\n<h3 id=\"headlinesdefinition-methods\">HeadlinesDefinition Methods</h3>\n<p><strong>IHeadlinesDefinition Query(string query)</strong><br>\nA news query expression.  Optional.  Default: all headlines.</p>\n<p><strong>IHeadlinesDefinition Count(uint count)</strong><br>\nThe number of headlines.  Optional.  Default: 100. A value of 0 (zero) retrieves all available headlines within the query - typically only used when the query specifies a date range.</p>\n<p><strong>IHeadlinesDefinition Sort(Headlines.SortOrder sort)</strong><br>\nThe sort order of the headlines (<code>newToOld</code>, <code>oldToNew</code>).  Optional.  Default: newToOld.</p>\n<p><strong>IHeadlinesDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IHeadlinesDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IHeadlinesDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Query</code>, <code>Count</code>, <code>Sort</code>, <code>PageSize</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IHeadlinesResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IHeadlinesResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IHeadlinesResponse GetData(Action&lt;IHeadlinesResponse, IHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IHeadlinesResponse GetData(ISession session, Action&lt;IHeadlinesResponse, IHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IHeadlinesResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IHeadlinesResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IHeadlinesResponse&gt; GetDataAsync(Action&lt;IHeadlinesResponse, IHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IHeadlinesResponse&gt; GetDataAsync(ISession session, Action&lt;IHeadlinesResponse, IHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IHeadlinesDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IHeadlinesResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IHeadlinesData</strong> type.</p>\n<h3 id=\"iheadlinesdata---properties\">IHeadlinesData - properties</h3>\n<p>IList&lt;IHeadlineData&gt; Headlines { get; }<br>\nJToken Raw { get; }<br></p>\n<p>Each entry in <strong>Headlines</strong> is an <strong>IHeadlineData</strong> (extends <code>INewsItem</code>):</p>\n<h3 id=\"iheadlinedata---properties\">IHeadlineData - properties</h3>\n<p>string StoryId { get; }<br>\nIList&lt;string&gt; Creators { get; }<br>\nNewsUrgencyType Urgency { get; }<br>\nstring HeadlineTitle { get; }<br>\nIList&lt;string&gt; Sources { get; }<br>\nIList&lt;string&gt; Languages { get; }<br>\nIList&lt;string&gt; Subjects { get; }<br>\nIList&lt;string&gt; RICCodes { get; }<br>\nDateTime CreationDate { get; }<br>\nDateTime UpdateDate { get; }<br>\nJObject Raw { get; }<br></p>\n<p><code>NewsUrgencyType</code> values: <code>Regular</code>, <code>Hot</code>.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The code snipet bellow, exemplifies a couple of use cases for retrieving headlines data. </p>\n<pre><code class=\"language-csharp\">\n    var definition = Headlines.Definition();\n\n    // Default Count: Retrieve the most recent 100 headlines about any instrument\n    var response1 = definition.GetData();\n\n    // Default Count: Retrieve most recent 100 headlines for Apple\n    var response2 = Headlines.Definition().Query(&quot;R:AAPL.O&quot;).GetData();\n\n    // Specify Count: Retrieve most recent N headlines for Apple\n    var response3 = Headlines.Definition().Query(&quot;R:AAPL.O&quot;).Count(15).GetData();\n    \n    // Retrieve a large number of headlines and a callback to retrieve each page.  Each page contains 100 headlines.\n    Headlines.Definition()\n              .Query(&quot;R:AAPL.O&quot;)\n              .Count(350)\n              .GetData((response, def, s) =&gt;\n              {\n                  // Use the response object and display the desired headlines details\n              });\n\n    // Retrieve headlines using queries and sort the result.\n    var startdate = DateTime.Now.AddMonths(-15);\n    var enddate = startdate.AddDays(1);\n\n    var query = $&quot;Apple daterange:\\&quot;{startdate:yyyy-MM-dd},{enddate:yyyy-MM-dd}\\&quot;&quot;;\n    \n    var response = Headlines.Definition()\n                            .Query(query)\n                            .Count(0)\n                            .Sort(Headlines.SortOrder.oldToNew)\n                            .GetData();\n</code></pre>\n<p>Headline entries can be sorted using the <strong>Sort()</strong> and providing a <strong>Headlines.ShortOrder</strong> value. <br>\nThe available values are <strong>&quot;oldToNew&quot;</strong> and <strong>&quot;newToOld&quot;</strong>.</p>\n"},{"location":"./sections/content-layer/news/images","title":"Images","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"news-images\">News Images</h1>\n<p>News Images can be retrieved using an image ID, typically found within News Online Reports or Top News Headlines content.</p>\n<pre><code class=\"language-csharp\">IImageResponse response = Image.Definition(imageId).GetData();\n\nbyte[] imageBytes = response.Data.Image;\n</code></pre>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Image.Definition()</code><br>\n<code>Image.Definition(string imageId)</code></p>\n<h3 id=\"imagedefinition-methods\">ImageDefinition Methods</h3>\n<p><strong>IImageDefinition ImageId(string imageId)</strong><br>\nThe ID of the image.  Required.</p>\n<p><strong>IImageDefinition ImageType(Image.ImageType type)</strong><br>\nSpecify if we want the response to come back in an HTML format (<code>JSON</code>, <code>IMAGE</code>).  Optional.  Default: <code>JSON</code>.</p>\n<p><strong>IImageDefinition Rendition(string rendition)</strong><br>\nSpecifies the rendition type for the image. For Online Reports only. Available values: <code>baseImage</code>, <code>filedImage</code>, <code>thumbnail</code>, <code>viewImage</code>.  Optional.</p>\n<p><strong>IImageDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IImageDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IImageDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>ImageId</code>, <code>ImageType</code>, <code>Rendition</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IImageResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IImageResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IImageResponse GetData(Action&lt;IImageResponse, IImageDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IImageResponse GetData(ISession session, Action&lt;IImageResponse, IImageDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IImageResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IImageResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IImageResponse&gt; GetDataAsync(Action&lt;IImageResponse, IImageDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IImageResponse&gt; GetDataAsync(ISession session, Action&lt;IImageResponse, IImageDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IImageDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IImageResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IImageData</strong> type.</p>\n<h3 id=\"iimagedata---properties\">IImageData - properties</h3>\n<p>byte[] Image { get; }<br>\nJToken Raw { get; }<br></p>\n"},{"location":"./sections/content-layer/news/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-news\">About News</h1>\n<p>The News content object allows you to retrieve Headlines and Story data stored on the Delivery Platform (formerly Refinitiv Data Platform).\nSeveral news types can be retrieved using different definitions contained in the <strong>LSEG.Data.Content.News</strong> namespace.\nA short description for each is provided below. Clicking on the bolded definition names will lead to details page for each. </p>\n<p><a href=\"#/sections/content-layer/news/headlines\"><strong>Headlines</strong></a> <br>\nWe can retrieve headline data using the <strong>Headlines.Definition()</strong></p>\n<p><a href=\"#/sections/content-layer/news/top-news\"><strong>TopNews</strong></a> <br>\nWe can retrieve the top news categories using the <strong>TopNews.Definition()</strong></p>\n<p><a href=\"#/sections/content-layer/news/top-news-headlines\"><strong>Top News Headlines</strong></a> <br>\nOnce we have a Top News page ID, its headlines can be retrieved using the <strong>TopNewsHeadlines.Definition(newsID)</strong></p>\n<p><a href=\"#/sections/content-layer/news/stories\"><strong>News Stories</strong></a> <br>\nNews stories with their headline and content can be retrieved using the <strong>Story.Definition(storyID)</strong></p>\n<p><a href=\"#/sections/content-layer/news/reports\"><strong>Online Reports</strong></a> <br>\nOnline reports listing can be retrieved using the <strong>OnlineReportsListing.Definition()</strong> <br>\nThe definition <strong>GetData()</strong> will retrieve a list of listings containg report IDs and other details <br>\nWe can use a report ID to retrieve its detials using an <strong>OnlineReports.Definition(reportID)</strong> <br>\nWhen retrieving the details we can also choose to retrieve it&#39;s full content or truncated data.</p>\n<p><a href=\"#/sections/content-layer/news/images\"><strong>Images</strong></a> <br>\nNews images referenced by Online Reports or Top News Headlines can be retrieved using the <strong>Image.Definition(imageID)</strong></p>\n<p><a href=\"#/sections/content-layer/news/analyze\"><strong>Analyze</strong></a> <br>\nNews data can also be retrieved as a tree structure using the <strong>Analyze.Definition(query)</strong><br>\nThis definition breaks down a user query string into news related entities, then aggregates them into a boolean filtering tree.</p>\n<p><a href=\"#/sections/content-layer/news/mrn\"><strong>Machine Readable News</strong></a> <br>\nThis definition is responsible for requesting, packaging and presenting Machine Readable News (MRN) as headlines and stories. <br>\nIt will perform all the heavy lifting of breaking down the MRN compressed news segments and packaging them up in simple,application-ready objects.</p>\n"},{"location":"./sections/content-layer/news/mrn","title":"Machine Readable News","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"machine-readable-news-mrn-definition\">Machine Readable News (MRN) Definition</h1>\n<p>Using this definition, we can retrieve real-time news headlines, stories, news analytics about companies and their assets and macroeconomic events. Machine Readable News data is retrieved using streams. The streams can be setup with callbacks for different events like incoming data (stream inserts or updates), the stream status and in case any errors are encountered. </p>\n<pre><code class=\"language-csharp\">    var definition = MachineReadableNews.Definition();\n\n    // Set the datafeed then retrieve a streaming object.\n    using (var stream = definition.NewsDatafeed(feed).GetStream())\n    {\n        // A token can be provided to end the ongoing task after a certain period\n        var tokenSource = new CancellationTokenSource(TimeSpan.FromSeconds(10));\n        \n        // Define our real-time processing then open the stream...\n        stream\n            .OnError((err, s) =&gt; { })\n            .OnStatus((status, s) =&gt; { })\n            .OnNewsStory((newsItem, s) =&gt; { })\n            .OnNewsAnalyticsAssets((newsItem, s) =&gt; { })\n            .OnNewsAnalyticsEvents((newsItem, s) =&gt; { })\n            .Open(tokenSource.Token);\n\n        Console.ReadLine();\n    } \n</code></pre>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>MachineReadableNews.Definition()</code></p>\n<h3 id=\"mrndefinition-methods\">MRNDefinition Methods</h3>\n<p><strong>IMRNDefinition NewsDatafeed(MachineReadableNews.Datafeed dataFeed)</strong><br>\n<strong>IMRNDefinition NewsDatafeed(string dataFeed)</strong><br>\nThe MRN data feed to subscribe to (<code>MRN_STORY</code>, <code>MRN_NA_ENT0</code>, <code>MRN_NA_DOC</code>).  Optional.  Default: <code>MRN_STORY</code> - headlines and news stories.</p>\n<p><strong>IMRNDefinition Service(string service)</strong><br>\nOverride the default service used to manage the real-time streaming data.  Optional.  Default: defined within the streaming platform.</p>\n<p><strong>IMRNDefinition ExtendedParams(JObject extendedParams)</strong><br>\nDefine additional request properties, formed as defined within the WebSocket Request specifications, that will be merged with all other properties specified.  Optional.</p>\n<p><strong>IMRNDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Service</code>, <code>DataFeed</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IMRNStream GetStream()</strong><br>\n<strong>IMRNStream GetStream(ISession session)</strong><br>\nRetrieve a streaming interface to manage real-time updates for the specified data feed.</p>\n<h3 id=\"mrnstream-interface-methods\">MRNStream Interface methods</h3>\n<p><strong>IMRNStream OnNewsStory(Action&lt;IMRNStoryData, IMRNStream&gt; newsCb)</strong><br>\nCallback invoked when a complete news story has been received from the MRN service.  Required.</p>\n<p><strong>IMRNStream OnNewsAnalyticsAssets(Action&lt;IMRNAnalyticsData, IMRNStream&gt; newsCb)</strong><br>\nCallback invoked when a complete News Analytics: Company and C&amp;E assets item has been received from the MRN service.  Required.</p>\n<p><strong>IMRNStream OnNewsAnalyticsEvents(Action&lt;IMRNAnalyticsData, IMRNStream&gt; newsCb)</strong><br>\nCallback invoked when a complete News Analytics: Macroeconomic News &amp; Events item has been received from the MRN service.  Required.</p>\n<p><strong>IMRNStream OnNewsGenericEvents(Action&lt;JObject, IMRNStream&gt; newsCb)</strong><br>\nReserved for unknown datafeeds.  Required.</p>\n<p><strong>IMRNStream OnStatus(Action&lt;JObject, IMRNStream&gt; statusCb)</strong><br>\nCallback invoked when an EventCode event occurs on the MRN streaming service.  Required.</p>\n<p><strong>IMRNStream OnError(Action&lt;JObject, IMRNStream&gt; errorCb)</strong><br>\nCallback invoked if an error occurs resulting from the request.  Required.</p>\n<p><strong>IMRNDefinitionParams Definition { get; }</strong><br>\nRetrieve the parameters defined for the streaming request (see MRNDefinition Properties above).</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IMRNDefinition</code> object.</p>\n<h3 id=\"imrnstorydata---properties\">IMRNStoryData - properties</h3>\n<p><code>IMRNStoryData</code> extends <code>INewsItem</code> (delivered via <code>OnNewsStory</code>):</p>\n<p>string NewsStory { get; }<br>\nNewsStoryType MsgType { get; }<br>\nNewsUrgencyType Urgency { get; }<br>\nstring HeadlineTitle { get; }<br>\nIList&lt;string&gt; Sources { get; }<br>\nIList&lt;string&gt; Languages { get; }<br>\nIList&lt;string&gt; Subjects { get; }<br>\nIList&lt;string&gt; RICCodes { get; }<br>\nDateTime CreationDate { get; }<br>\nDateTime UpdateDate { get; }<br>\nJObject Raw { get; }<br></p>\n<p><code>NewsStoryType</code> values: <code>Unknown</code>, <code>Alert</code>, <code>FirstTake</code>, <code>SubsequentTake</code>, <code>Correction</code>, <code>Corrected</code>, <code>Update</code>, <code>Deletion</code>.</p>\n<h3 id=\"imrnanalyticsdata---properties\">IMRNAnalyticsData - properties</h3>\n<p><code>IMRNAnalyticsData</code> extends <code>INewsItem</code> (delivered via <code>OnNewsAnalyticsAssets</code>/<code>OnNewsAnalyticsEvents</code>):</p>\n<p>IList&lt;INewsAssetScores&gt; Scores { get; }<br>\nNewsUrgencyType Urgency { get; }<br>\nstring HeadlineTitle { get; }<br>\nIList&lt;string&gt; Sources { get; }<br>\nIList&lt;string&gt; Languages { get; }<br>\nIList&lt;string&gt; Subjects { get; }<br>\nIList&lt;string&gt; RICCodes { get; }<br>\nDateTime CreationDate { get; }<br>\nDateTime UpdateDate { get; }<br>\nJObject Raw { get; }<br></p>\n<p>Each entry in <strong>Scores</strong> is an <strong>INewsAssetScores</strong>:</p>\n<p>string AssetClass { get; }<br>\nstring AssetName { get; }<br>\ndouble? Relevance { get; }<br>\ndouble? SentimentNegative { get; }<br>\ndouble? SentimentNeutral { get; }<br>\ndouble? SentimentPositive { get; }<br></p>\n"},{"location":"./sections/content-layer/news/reports","title":"Reports","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"reports\">Reports</h1>\n<h3 id=\"retrieving-online-reports-is-a-two-step-process\">Retrieving online reports is a two-step process:</h3>\n<p><strong>Step 1</strong>: We have to first retrieve the report listings and extract the report ID from each </p>\n<pre><code class=\"language-csharp\">IOnlineReportsListingResponse listing = OnlineReportsListing.Definition().GetData();\n\nif (listing.IsSuccess)\n{\n    var reportIds = new List&lt;string&gt;();\n\n    // The report also has a Name property \n    foreach (IOnlineReport report in listing.Data.OnlineReports)\n    {\n        // The region report token might contain properties like &quot;language&quot; and &quot;description&quot;\n        // Here we just extract the report ID \n        foreach (JToken regionReport in report.Reports)\n        {\n            reportIds.Add(regionReport[&quot;reportId&quot;].ToString());\n        }\n    }\n}\n</code></pre>\n<br>\n\n<p><strong>Step 2</strong>: Using the report IDs we extracted at step 1, we select one and retrieve its online report story details </p>\n<pre><code class=\"language-csharp\">// US Science reports\nIOnlineReportsResponse reportStory = OnlineReports.Definition(&quot;OLUSSCIENCE&quot;)\n                                                  .FullContent(false)\n                                                  .GetData(); \n\nforeach (IOnlineReportStory story in reportStory.Data.OnlineReportStories)\n{\n    Console.WriteLine(&quot;----------------------------------------------------------&quot;);\n    Console.WriteLine($&quot;{story.CreationDate}: {story.HeadlineTitle}&quot;);\n    Console.WriteLine($&quot;content Type: {story.ContentType}\\n{story.NewsStory}&quot;);\n}\n</code></pre>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>OnlineReportsListing.Definition()</code><br>\n<code>OnlineReports.Definition()</code><br>\n<code>OnlineReports.Definition(string reportId)</code></p>\n<h3 id=\"onlinereportslistingdefinition-methods\">OnlineReportsListingDefinition Methods</h3>\n<p><strong>IOnlineReportsListingDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IOnlineReportsListingDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IOnlineReportsListingDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Closure</code>, <code>ExtendedParams</code>).</p>\n<p><strong>IOnlineReportsListingResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IOnlineReportsListingResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IOnlineReportsListingResponse GetData(Action&lt;IOnlineReportsListingResponse, IOnlineReportsListingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IOnlineReportsListingResponse GetData(ISession session, Action&lt;IOnlineReportsListingResponse, IOnlineReportsListingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsListingResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsListingResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsListingResponse&gt; GetDataAsync(Action&lt;IOnlineReportsListingResponse, IOnlineReportsListingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsListingResponse&gt; GetDataAsync(ISession session, Action&lt;IOnlineReportsListingResponse, IOnlineReportsListingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve (synchronously/asynchronously) the report listing from the backend service.</p>\n<p><code>IOnlineReportsListingResponse</code> (implements <code>IResponse</code>) contains a <strong>Data</strong> property of <strong>IOnlineReportsListingData</strong> type:</p>\n<p>IList&lt;IOnlineReport&gt; OnlineReports { get; }<br>\nJToken Raw { get; }<br></p>\n<p>Each entry in <strong>OnlineReports</strong> is an <strong>IOnlineReport</strong>:</p>\n<p>string Name { get; }<br>\nJArray Reports { get; }<br></p>\n<h3 id=\"onlinereportsdefinition-methods\">OnlineReportsDefinition Methods</h3>\n<p><strong>IOnlineReportsDefinition ReportId(string reportID)</strong><br>\nThe ID of the specific report.  Required.</p>\n<p><strong>IOnlineReportsDefinition FullContent(bool fullContent)</strong><br>\nIndicates whether TOP 10 full documents must be retrieved.  Optional.  Default: false.</p>\n<p><strong>IOnlineReportsDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IOnlineReportsDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IOnlineReportsDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>ReportId</code>, <code>FullContent</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IOnlineReportsResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IOnlineReportsResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IOnlineReportsResponse GetData(Action&lt;IOnlineReportsResponse, IOnlineReportsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IOnlineReportsResponse GetData(ISession session, Action&lt;IOnlineReportsResponse, IOnlineReportsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IOnlineReportsResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsResponse&gt; GetDataAsync(Action&lt;IOnlineReportsResponse, IOnlineReportsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IOnlineReportsResponse&gt; GetDataAsync(ISession session, Action&lt;IOnlineReportsResponse, IOnlineReportsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IOnlineReportsDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IOnlineReportsResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IOnlineReportsData</strong> type.</p>\n<h3 id=\"ionlinereportsdata---properties\">IOnlineReportsData - properties</h3>\n<p>IList&lt;IOnlineReportStory&gt; OnlineReportStories { get; }<br>\nJToken Raw { get; }<br></p>\n<p>Each entry in <strong>OnlineReportStories</strong> is an <strong>IOnlineReportStory</strong> (extends <code>INewsItem</code>):</p>\n<h3 id=\"ionlinereportstory---properties\">IOnlineReportStory - properties</h3>\n<p>string NewsStory { get; }<br>\nstring ContentType { get; }<br>\nIList&lt;string&gt; Creators { get; }<br>\nNewsUrgencyType Urgency { get; }<br>\nstring HeadlineTitle { get; }<br>\nIList&lt;string&gt; Sources { get; }<br>\nIList&lt;string&gt; Languages { get; }<br>\nIList&lt;string&gt; Subjects { get; }<br>\nIList&lt;string&gt; RICCodes { get; }<br>\nDateTime CreationDate { get; }<br>\nDateTime UpdateDate { get; }<br>\nJObject Raw { get; }<br></p>\n"},{"location":"./sections/content-layer/news/stories","title":"Stories","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"news-stories\">News Stories</h1>\n<p>Retrieving news stories is a two-step process: </p>\n<ol>\n<li>We have to first retrieve the headlines and extract the story ID from each </li>\n</ol>\n<pre><code class=\"language-csharp\">    // Retrieve the latest news headline in English about Apple.\n    IHeadlinesResponse headline = Headlines.Definition().Query($&quot;L:EN and Apple,&quot;)\n                                                        .Sort(Headlines.SortOrder.oldToNew)\n                                                        .Count(1)\n                                                        .GetData();\n\n    // Get the story ID of the first (and in this case, the only) news headline\n    var storyID = headline.Data.Headlines[0]?.StoryId;\n</code></pre>\n<ol start=\"2\">\n<li>Using the storyID from step 1, we request the news story content like this </li>\n</ol>\n<pre><code class=\"language-csharp\">    IStoryResponse story = Story.Definition(storyID).GetData();\n\n    // The result contains a raw json, headline title, story content as simple text or html content\n    var raw = story.Data.Raw; \n    var headlineTitle = story.Data.HeadlineTitle; \n    var storyText = story.Data.NewsStory;\n    var storyHtmlText = story.Data.HtmlNewsStory; \n</code></pre>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Story.Definition()</code><br>\n<code>Story.Definition(string storyId)</code></p>\n<h3 id=\"storydefinition-methods\">StoryDefinition Methods</h3>\n<p><strong>IStoryDefinition StoryId(string storyId)</strong><br>\nSpecify the ID of the story to retrieve. The story identifier is available when you retrieve a story headline.  Required.</p>\n<p><strong>IStoryDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IStoryDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>IStoryDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>StoryId</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IStoryResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IStoryResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IStoryResponse GetData(Action&lt;IStoryResponse, IStoryDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IStoryResponse GetData(ISession session, Action&lt;IStoryResponse, IStoryDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;IStoryResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IStoryResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IStoryResponse&gt; GetDataAsync(Action&lt;IStoryResponse, IStoryDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IStoryResponse&gt; GetDataAsync(ISession session, Action&lt;IStoryResponse, IStoryDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IStoryDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IStoryResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IStoryData</strong> type.</p>\n<h3 id=\"istorydata---properties\">IStoryData - properties</h3>\n<p><code>IStoryData</code> extends <code>INewsItem</code>:</p>\n<p>string NewsStory { get; }<br>\nstring HtmlNewsStory { get; }<br>\nIList&lt;string&gt; Creators { get; }<br>\nNewsUrgencyType Urgency { get; }<br>\nstring HeadlineTitle { get; }<br>\nIList&lt;string&gt; Sources { get; }<br>\nIList&lt;string&gt; Languages { get; }<br>\nIList&lt;string&gt; Subjects { get; }<br>\nIList&lt;string&gt; RICCodes { get; }<br>\nDateTime CreationDate { get; }<br>\nDateTime UpdateDate { get; }<br>\nJObject Raw { get; }<br></p>\n"},{"location":"./sections/content-layer/news/top-news-headlines","title":"TopNewsHeadlines","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"top-news-headlines\">Top News Headlines</h1>\n<p>Once you have retrieved a Top News page ID (see <a href=\"#/sections/content-layer/news/top-news\">Top News</a>), you can use it to retrieve the headlines for that page.</p>\n<pre><code class=\"language-csharp\">var page = TopNews.Definition().GetData().Data.Categories[&quot;MARKETS&quot;][0];\n\nvar headlines = TopNewsHeadlines.Definition(page.TopNewsID).GetData();\n</code></pre>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>TopNewsHeadlines.Definition()</code><br>\n<code>TopNewsHeadlines.Definition(string newsID)</code></p>\n<h3 id=\"topnewsheadlinesdefinition-methods\">TopNewsHeadlinesDefinition Methods</h3>\n<p><strong>ITopNewsHeadlinesDefinition NewsId(string newsId)</strong><br>\nSpecify the ID of the Top News page. The ID is available when you retrieve the Top News Categories (<code>ITopNewsPage.TopNewsID</code>).  Required.</p>\n<p><strong>ITopNewsHeadlinesDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ITopNewsHeadlinesDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>ITopNewsHeadlinesDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>NewsId</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>ITopNewsHeadlinesResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>ITopNewsHeadlinesResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>ITopNewsHeadlinesResponse GetData(Action&lt;ITopNewsHeadlinesResponse, ITopNewsHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>ITopNewsHeadlinesResponse GetData(ISession session, Action&lt;ITopNewsHeadlinesResponse, ITopNewsHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;ITopNewsHeadlinesResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ITopNewsHeadlinesResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ITopNewsHeadlinesResponse&gt; GetDataAsync(Action&lt;ITopNewsHeadlinesResponse, ITopNewsHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ITopNewsHeadlinesResponse&gt; GetDataAsync(ISession session, Action&lt;ITopNewsHeadlinesResponse, ITopNewsHeadlinesDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ITopNewsHeadlinesDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>ITopNewsHeadlinesResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>ITopNewsHeadlinesData</strong> type.</p>\n<h3 id=\"itopnewsheadlinesdata---properties\">ITopNewsHeadlinesData - properties</h3>\n<p>IList&lt;ITopNewsHeadlinesNode&gt; Headlines { get; }<br>\nJToken Raw { get; }<br></p>\n<p>Each entry in <strong>Headlines</strong> is an <strong>ITopNewsHeadlinesNode</strong>:</p>\n<h3 id=\"itopnewsheadlinesnode---properties\">ITopNewsHeadlinesNode - properties</h3>\n<p>string Text { get; }<br>\nstring Snippet { get; }<br>\nstring ImageId { get; }<br>\nDateTime VersionCreated { get; }<br>\nstring StoryId { get; }<br></p>\n<p>The <strong>StoryId</strong> can be used to retrieve the full story (see <a href=\"#/sections/content-layer/news/stories\">News Stories</a>). The <strong>ImageId</strong> can be used to retrieve the associated image (see <a href=\"#/sections/content-layer/news/images\">Images</a>).</p>\n"},{"location":"./sections/content-layer/news/top-news","title":"Top News","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"top-news\">Top News</h1>\n<p>Retrieving top news can be done like this: </p>\n<pre><code class=\"language-csharp\">    var topNews = TopNews.Definition().GetData();\n</code></pre>\n<p>The incoming object will contain a dictionary of categorized paginated top news.</p>\n<pre><code class=\"language-csharp\">    public IDictionary&lt;string, IList&lt;ITopNewsPage&gt;&gt; Categories { get; set; }\n</code></pre>\n<p>Each top news page contains the main information about a top news like its name, ID and revision ID and date, where applicable. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>TopNews.Definition()</code></p>\n<h3 id=\"topnewsdefinition-methods\">TopNewsDefinition Methods</h3>\n<p><strong>ITopNewsDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ITopNewsDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface.  Optional.</p>\n<p><strong>ITopNewsDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>ITopNewsResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>ITopNewsResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>ITopNewsResponse GetData(Action&lt;ITopNewsResponse, ITopNewsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>ITopNewsResponse GetData(ISession session, Action&lt;ITopNewsResponse, ITopNewsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve the data from the backend service.</p>\n<p><strong>Task&lt;ITopNewsResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ITopNewsResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ITopNewsResponse&gt; GetDataAsync(Action&lt;ITopNewsResponse, ITopNewsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ITopNewsResponse&gt; GetDataAsync(ISession session, Action&lt;ITopNewsResponse, ITopNewsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the data from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ITopNewsDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>ITopNewsResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>ITopNewsData</strong> type.</p>\n<h3 id=\"itopnewsdata---properties\">ITopNewsData - properties</h3>\n<p>IDictionary&lt;string, IList&lt;ITopNewsPage&gt;&gt; Categories { get; }<br>\nJToken Raw { get; }<br></p>\n<h3 id=\"itopnewspage---properties\">ITopNewsPage - properties</h3>\n<p>string Page { get; }<br>\nstring RevisionID { get; }<br>\nDateTime RevisionDate { get; }<br>\nstring TopNewsID { get; }<br></p>\n<p>The <strong>TopNewsID</strong> of a page can be used to retrieve its headlines (see <a href=\"#/sections/content-layer/news/top-news-headlines\">Top News Headlines</a>).</p>\n"},{"location":"./sections/content-layer/pricing/chain/definition-get-stream","title":"ChainDefinition methods","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"getstream\">GetStream</h1>\n<p>Creates a <a href=\"#/sections/content-layer/pricing/chain/streams/intro\">Pricing.ChainStream</a> object for the defined data.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>definition.GetStream()</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ChainStream</code> object</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to get service directory stream object</p>\n<pre><code class=\"language-csharp\">// Create a non-streaming chain (simple syntax) - skip summaries and any blank links.\nvar chainStream = Chain.Definition(chain).GetStream().Streaming(false).Open();\n\nConsole.WriteLine($&quot;\\nRetrieved Chain RIC: {chain.DisplayName}&quot;);\n\n// Display the 3 first elements of the chain\nint idx = 0;\nforeach (string constituent in chain.Constituents.Take(3))\n{\n    Console.WriteLine($&quot;\\t{++idx,2}. {constituent}&quot;);\n}\n\nConsole.WriteLine($&quot;\\t...\\n\\t&lt;total of {constituents.Count} elements.&gt;&quot;);\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/definition","title":"ChainDefinition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"pricingchaindefinition-object\">Pricing.Chain.Definition object</h1>\n<p>A definition used to retrieve data about the specified chains and decode them dynamically.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IChainDefinition Definition()</code><br>\n<code>IChainDefinition Definition(string item)</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th align=\"left\"><strong>Data type</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>item</td>\n<td>The name of the chain</td>\n<td align=\"left\">string</td>\n<td>No</td>\n<td align=\"left\">-</td>\n</tr>\n</tbody></table>\n<h3 id=\"pricingchaindefinition-methods\">Pricing.ChainDefinition methods</h3>\n<p><strong>IChainDefinition Name(string name)</strong><br>\nDefines the name of the Chain RIC.  Required.</p>\n<p><strong>IChainDefinition SkipSummaryLinks(bool skip)</strong><br>\nIndicator to skip the summary links within the constituents.  The number of Summary links within a chain are defined based on a display template ID within the Chain.  A dictionary of template IDs have been loaded within the interface to provide a lookup to determine the number of summary links. Optional.  Default: True.</p>\n<p><strong>IChainDefinition SkipEmptyLinks(bool skip)</strong><br>\nIndicator to skip the empty links within the constituents. <br>\nApplicable to streaming only. Optional.  Default: True.</p>\n<p><strong>IChainDefinition Service(string service)</strong><br>\nThe name of the service providing the desired streaming data. <br>\nThe parameter is optional and applicable to streaming only.<br>\nDefault: defined within the streaming platform.</p>\n<p><strong>IChainDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IChainDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface. The extended params act as a fallback in case properties are unavailable, or as an alternative for users that prefer to define the request using native JSON definitions.  Optional.</p>\n<p><strong>IChainsDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Name</code>, <code>SkipSummaryLinks</code>, <code>SkipEmptyLinks</code>, <code>Service</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IChainResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IChainResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IChainResponse GetData(Action&lt;IChainResponse, IChainsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IChainResponse GetData(ISession session, Action&lt;IChainResponse, IChainsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve a chain snapshot for the specified item.</p>\n<p><strong>Task&lt;IChainResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IChainResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IChainResponse&gt; GetDataAsync(Action&lt;IChainResponse, IChainsDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IChainResponse&gt; GetDataAsync(ISession session, Action&lt;IChainResponse, IChainsDefin
