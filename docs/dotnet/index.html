itionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve a chain snapshot for the specified item.</p>\n<p><strong>IChainStream GetStream()</strong><br>\n<strong>IChainStream GetStream(ISession session)</strong><br>\nRetrieve a streaming interface to manage real-time chain updates. See <a href=\"#/sections/content-layer/pricing/chain/streams/intro\">Chain Stream</a>.</p>\n<h3 id=\"response\">Response</h3>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IChainResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IChainData</strong> type.</p>\n<h3 id=\"ichaindata---properties\">IChainData - properties</h3>\n<p>string DisplayName { get; }<br>\nIList&lt;string&gt; Constituents { get; }<br>\nJToken Raw { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a pricing chain definition and retrieve data. </p>\n<pre><code class=\"language-csharp\">var chain = &quot;.AV.O&quot;;            // Nasdaq Top 25\n\nIChainResponse response = Chain.Definition(chain).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-pricing-chains\">About Pricing Chains</h1>\n<p>The Pricing chains is designed to request streaming chains and decode them dynamically.</p>\n<h3 id=\"properties\">Properties</h3>\n<p><code>public Stream.State OpenState</code></p>\n<p>Current state of the Pricing.Stream (see <a href=\"#/sections/content-layer/pricing/chain/state\">Pricing.Stream.State</a>).</p>\n"},{"location":"./sections/content-layer/pricing/chain/streams/intro","title":"ChainStream","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-pricingchainstream-object\">About Pricing.ChainStream object</h1>\n<p><strong>Pricing.ChainStream</strong> objects are used for requesting, processing and managing streaming chain connections.</p>\n<h3 id=\"properties\">Properties</h3>\n<p><code>public Stream.State OpenState</code></p>\n<p>Current state of the Pricing.Stream (see <a href=\"#/sections/content-layer/pricing/chain/streams/state\">Pricing.Stream.State</a>).</p>\n<h3 id=\"pricing-chainstream-interface-methods\">Pricing ChainStream Interface methods</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/pricing/chain/streams/methods/open\">Pricing Chain stream Open method</a></li>\n<li><a href=\"#/sections/content-layer/pricing/chain/streams/methods/close\">Pricing Chain stream Close method</a></li>\n<li><a href=\"#/sections/content-layer/pricing/chain/streams/methods/on-update\">Pricing Chain stream OnUpdate method</a></li>\n<li><a href=\"#/sections/content-layer/pricing/chain/streams/methods/on-add\">Pricing Chain stream OnAdd method</a></li>\n<li><a href=\"#/sections/content-layer/pricing/chain/streams/methods/on-remove\">Pricing Chain stream OnRemove method</a></li>\n<li><a href=\"#/sections/content-layer/pricing/chain/streams/methods/on-error\">Pricing Chain stream OnError method</a></li>\n</ul>\n"},{"location":"./sections/content-layer/pricing/chain/streams/methods/close","title":"Close","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"close\">Close</h1>\n<p>Allows you to close the streaming chain connection.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>streamingChain.Close()</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>void</code> - nothing. </p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to close previously opened pricing chain stream.</p>\n<pre><code class=\"language-csharp\">var chainStream = Chain.Definition(&quot;.AV.O&quot;).GetStream();\n\nchainStream.open();\n\n// get and process the streaming data\n\nchainStream.close();\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/streams/methods/on-add","title":"OnAdd","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onadd\">OnAdd</h1>\n<p>Optional callback invoked when a new element has been added to the chain increasing its size.<br>\nThese events are called when the initial chain is building but can also occur for some chain records after the initial chain has been built.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IChainStream OnAdd(Action&lt;int, string, IChainStream&gt; addCb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the messages received when a new constituent is added to the stream.</p>\n<pre><code class=\"language-csharp\">var chainStream = Chain.Definition(&quot;.AV.O&quot;)\n                       .GetStream()\n                       .OnAdd((index, newv, stream) =&gt; {});\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/streams/methods/on-error","title":"OnError","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onerror\">OnError</h1>\n<p>Optional callback invoked if an error occurs resulting from the request.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IChainStream OnError(Action&lt;string, JObject, IChainStream&gt; errorCb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the messages received when the streaming receives an error message.</p>\n<pre><code class=\"language-csharp\">var chainStream = Chain.Definition(&quot;.AV.O&quot;)\n                       .GetStream()\n                       .OnError((item, error, stream) =&gt; {});\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/streams/methods/on-remove","title":"OnRemove","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onremove\">OnRemove</h1>\n<p>Optional callback invoked when an existing element has been removed from the chain decreasing its size.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IChainStream OnRemove(Action&lt;int, string, IChainStream&gt; removeCb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the messages received when a constituent is removed from the stream.</p>\n<pre><code class=\"language-csharp\">var chainStream = Chain.Definition(&quot;.AV.O&quot;)\n                       .GetStream()\n                       .OnRemove((index, oldv, stream) =&gt; {});\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/streams/methods/on-update","title":"OnUpdate","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onupdate\">OnUpdate</h1>\n<p>Optional callback invoked when an update has been applied to the chain. <br> \nUpdates typically occur when the order of link positions within the chain change due to market activity. <br>\nIn some cases, new elements can be added or removed from the chain. Refer to OnAdd() and OnRemove() for more details.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IChainStream OnUpdate(Action&lt;int, string, string, IChainStream&gt; updateCb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the messages received when a constituent is updated in the stream.</p>\n<pre><code class=\"language-csharp\">var chainStream = Chain.Definition(&quot;.AV.O&quot;)\n                       .GetStream()\n                       .OnUpdate((index, oldv, newv, stream) =&gt; {});\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/streams/methods/open","title":"Open","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"open\">Open</h1>\n<p>Allows you to open a streaming chain connection.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Stream.State Open(CancellationToken cancellationToken = default)</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p>A <code>Stream.State</code> value indicating if the stream opened. </p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create and open a pricing chain stream.</p>\n<pre><code class=\"language-csharp\">var stream = Chain.Definition(&quot;.AV.O&quot;).GetStream();\n\nvar streamState = stream.Open();\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/chain/streams/state","title":"StreamStates","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"pricing-stream-states\">Pricing stream states</h1>\n<p>The list of Pricing stream states:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>State.Pending</td>\n<td>The stream is waiting to be opened or closed.</td>\n</tr>\n<tr>\n<td>State.Opened</td>\n<td>The stream is open and ready to work.</td>\n</tr>\n<tr>\n<td>State.Closed</td>\n<td>The stream is closed.</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/pricing/definition-get-stream","title":"PricingDefinition methods","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"getstream\">GetStream</h1>\n<p>Creates and returns the pricing stream that allows you to get streaming data for previously defined instruments.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>definition.GetStream()</code><br>\n<code>definition.GetStream(ISession session)</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><a href=\"#/sections/content-layer/pricing/streams/intro\">Pricing.Stream</a> object</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to retrieve streaming data for <strong>EUR=</strong> and <strong>USD=</strong> instruments. </p>\n<pre><code class=\"language-csharp\">var definition = Pricing.Definition(&quot;EUR=&quot;, &quot;USD=&quot;).Fields(&quot;BID&quot;, &quot;ASK&quot;);\n\nvar stream = definition.GetStream().Open();\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/definition","title":"PricingDefinition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"pricingdefinition-object\">Pricing.Definition object</h1>\n<p>The Pricing Definition defines a request used to retrieve pricing data for specified instruments.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Pricing.Definition()</code>\n<code>Pricing.Definition(params string[] universe)</code>\n<code>Pricing.Definition(IEnumerable&lt;string&gt; universe)</code></p>\n<p>At least one universe has to be specified either when creating the definition or using the <strong>Universe()</strong> method</p>\n<h3 id=\"pricingdefinition-methods\">PricingDefinition Methods</h3>\n<p><strong>IPricingDefinition Universe(params string[] universe)</strong><br>\n<strong>IPricingDefinition Universe(IEnumerable&lt;string&gt; universe)</strong><br>\nList of RICs to request.  Required.</p>\n<p><strong>IPricingDefinition Service(string service)</strong><br>\nThe name of the service providing the desired streaming price data.  Optional.  Default: defined within the streaming platform.</p>\n<p><strong>IPricingDefinition Fields(params string[] fields)</strong><br>\n<strong>IPricingDefinition Fields(IEnumerable&lt;string&gt; fields)</strong><br>\nSpecify the specific fields delivered when messages arrive.  Optional.  Default: all fields.</p>\n<p><strong>IPricingDefinition ExtendedParams(JObject extendedParams)</strong><br>\nDefine additional request properties that will be merged with all other properties specified. Applications must form the request properties as defined within the WebSocket Request specifications.  Optional.</p>\n<p><strong>IPricingDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IPricingDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>Universe</code>, <code>View</code>, <code>Service</code>, <code>ExtendedParams</code>, <code>Closure</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IPricingResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IPricingResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IPricingResponse GetData(Action&lt;IPricingResponse, IPricingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IPricingResponse GetData(ISession session, Action&lt;IPricingResponse, IPricingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nRetrieve a market data snapshot for the specified universe of items.</p>\n<p><strong>Task&lt;IPricingResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IPricingResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IPricingResponse&gt; GetDataAsync(Action&lt;IPricingResponse, IPricingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IPricingResponse&gt; GetDataAsync(ISession session, Action&lt;IPricingResponse, IPricingDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve a market data snapshot for the specified universe of items.</p>\n<p><strong>IPricingStream GetStream()</strong><br>\n<strong>IPricingStream GetStream(ISession session)</strong><br>\nRetrieve a streaming interface to manage real-time updates for the specified universe of items. See <a href=\"#/sections/content-layer/pricing/streams/intro\">Pricing.Stream</a>.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IPricingDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IPricingResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>ISnapshotData</strong> type.</p>\n<h3 id=\"isnapshotdata---properties\">ISnapshotData - properties</h3>\n<p>JToken Raw { get; }<br>\nIDictionary&lt;string, IPriceData&gt; Prices { get; }<br></p>\n<p>Each entry in <strong>Prices</strong> is an <strong>IPriceData</strong>, keyed by item name:</p>\n<h3 id=\"ipricedata---properties\">IPriceData - properties</h3>\n<p>string ItemName { get; }<br>\nJToken this[string fieldName] { get; }<br>\nJToken Fields(params string[] fields)<br>\nJToken Fields(IEnumerable&lt;string&gt; fields)<br>\nJToken Fields()<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create a pricing definition for <strong>EUR=</strong> and <strong>USD=</strong> instruments.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.Pricing;\n\nvar definition = Pricing.Definition(&quot;EUR=&quot;, &quot;USD=&quot;)\n                        .Fields(&quot;BID&quot;, &quot;ASK&quot;); // If no fields are specified, all available fields are returned\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-pricing\">About Pricing</h1>\n<p><strong>Pricing content objects</strong> give your application easy access to Pricing and Market Data.\nPricing data refers to exchange-traded, contributed, and evaluated data for all financial assets, including :</p>\n<ul>\n<li>commodities</li>\n<li>derivatives</li>\n<li>equities</li>\n<li>fixed income</li>\n<li>foreign exchange</li>\n<li>funds</li>\n<li>indices</li>\n<li>loans\nused by financial market participants.</li>\n</ul>\n<p>By using <strong>Pricing content objects</strong>, your application can retrieve this content as <strong>snapshots</strong> or as a <strong>stream of data</strong> that is capable of receiving updates with the latest values using callbacks.</p>\n"},{"location":"./sections/content-layer/pricing/streams/intro","title":"PricingStream","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-pricingstream-object\">About Pricing.Stream object</h1>\n<p><strong>Pricing.Stream objects</strong> are used for requesting, processing and managing a set of streaming level 1 (MarketPrice domain) quotes and trades.</p>\n<p>The object automatically manages a set of streaming caches available for access at any time and an in-memory image of the requested instruments, keeping track of streaming updates exposing an interface to reach into the cache to retrieve up-to-date values.</p>\n<h3 id=\"properties\">Properties</h3>\n<p><code>public Stream.State OpenState</code></p>\n<p>Current state of the Pricing.Stream (see <a href=\"#/sections/content-layer/pricing/streams/state\">Pricing.Stream.State</a>).</p>\n<h3 id=\"pricing-stream-interface-methods\">Pricing Stream Interface methods</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/streams/methods/open\">Pricing stream Open method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/streaming\">Pricing stream Streaming method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/close\">Pricing stream Close method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/count\">Pricing stream Count method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/item-exists\">Pricing stream ItemExists method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/add-items\">Pricing stream AddItems method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/remove-items\">Pricing stream RemoveItems method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/on-update\">Pricing stream OnUpdate method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/on-refresh\">Pricing stream OnRefresh method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/on-complete\">Pricing stream OnComplete method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/on-status\">Pricing stream OnStatus method</a></li>\n<li><a href=\"#/sections/content-layer/streams/methods/on-error\">Pricing stream OnError method</a></li>\n</ul>\n"},{"location":"./sections/content-layer/streams/methods/add-items","title":"AddItems","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"additems\">AddItems</h1>\n<p>Allows to add items to the stream, even when the stream has been already opened. <br>\nWe can even specify the incoming fields for the requested instrument. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>void AddItems(params string[] items)</code><br>\n<code>void AddItems(IEnumerable&lt;string&gt; items)</code><br>\n<code>void AddItems(IEnumerable&lt;string&gt; items, IEnumerable&lt;string&gt; fields)</code><br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to add items to a pricing stream.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition(&quot;EUR=&quot;).GetStream();\n\nstream.Open();\n\n// Add one item or a list of items\nstream.AddItems(&quot;MSFT.O&quot;);\nstream.AddItems(new[] { &quot;EUR=&quot;, &quot;GBP=&quot;, &quot;CAD=&quot; }); \n\n// Add a list of items, in this case one, and a specified list of fields to be retrieved for it\nstream.AddItems(new[] { &quot;AAPL.O&quot; }, new[] { &quot;BID&quot;, &quot;ASK&quot;, &quot;HST_CLOSE&quot;, &quot;IRGPRC&quot;, &quot;DSPLY_NAME&quot; });\n\nstream.Close();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/close","title":"Close","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"close\">Close</h1>\n<p>Allows you to close the Pricing connection, releasing resources.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>void Close()</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to close previously opened pricing stream.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition(&quot;EUR=&quot;).GetStream();\n\nstream.Open();\n\n// get and process the streaming data\n\nstream.Close();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/count","title":"Count","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"count\">Count</h1>\n<p>Return the number of items in our collection/watchlist </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>int Count()</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to count the items of a pricing stream cache.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition(&quot;EUR=&quot;).GetStream();\n\nstream.Open();\n\n// Add one item or a list of items\nstream.AddItems(&quot;MSFT.O&quot;);\nstream.AddItems(new[] { &quot;EUR=&quot;, &quot;GBP=&quot;, &quot;CAD=&quot; }); \n\nvar count = stream.Count(); \n\nstream.Close();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/get-cache-snapshot","title":"GetCacheSnapshot","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"getcachesnapshot\">GetCacheSnapshot</h1>\n<p>Retrieve a snapshot from the live cache for the specified items.  <br>\nThe snapshot is a copy of the values from the cache. <br>\nBy default, all fields will be copied from the cache.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IDictionary&lt;string, IPriceData&gt; GetCacheSnapshot(params string[] items)</code><br>\n<code>IDictionary&lt;string, IPriceData&gt; GetCacheSnapshot(IEnumerable&lt;string&gt; items, IEnumerable&lt;string&gt; fields = null)</code><br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to get a snapshot from the cache. </p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition(&quot;EUR=&quot;).GetStream();\n\nstream.Open();\n\n// Add one item or a list of items\nstream.AddItems(&quot;MSFT.O&quot;);\nstream.AddItems(new[] { &quot;EUR=&quot;, &quot;GBP=&quot;, &quot;CAD=&quot; }); \n\nvar snapshot = stream.GetCacheSnapshot();\n\n\nstream.Close();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/item-exists","title":"ItemExists","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"itemexists\">ItemExists</h1>\n<p>Check if the specified item exists within the stream cache.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>bool ItemExists(string item)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<pre><code class=\"language-csharp\">var definition = Pricing.Definition().Fields(&quot;DSPLY_NAME&quot;, &quot;BID&quot;, &quot;ASK&quot;);\n\nstream.Open();\n\nvar item = &quot;EUR=&quot;;\nstream.AddItems(item);\nvar itemExists = stream.ItemExists(item); // true\n\nstream.Close();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/on-complete","title":"OnComplete","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"oncomplete\">OnComplete</h1>\n<p>Optional callback invoked when the request to open the stream has completed. A complete event is generated typically when the complete item image and/or item status messages has been received for all requested items. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IPricingStream OnComplete(Action&lt;IPricingStream&gt; cb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the messages received when all the data is successfully retrieved.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition().Universe(&quot;EUR=&quot;)\n                                 .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;DSPLY_NAME&quot;)\n                                 .GetStream();\n                                 \nstream.OnComplete(s =&gt; Console.WriteLine(&quot;Request Completed.&quot;))\n      .Open() == Stream.State.Opened\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/on-error","title":"OnError","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onerror\">OnError</h1>\n<p>Optional callback invoked if an error occurs resulting from the request.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IPricingStream OnError(Action&lt;string, JObject, IPricingStream&gt; errorCb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the messages received when a data retrieval error happens</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition().Universe(&quot;EUR=&quot;)\n                                 .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;DSPLY_NAME&quot;)\n                                 .GetStream();\n                                 \nstream.OnError((item, err, s) =&gt; Console.WriteLine($&quot;Error: {err}&quot;))\n      .Open() == Stream.State.Opened\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/on-refresh","title":"OnRefresh","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onrefresh\">OnRefresh</h1>\n<p>Optional callback invoked upon receiving a Refresh message containing the fields.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IPricingStream OnRefresh(Action&lt;string, JObject, IPricingStream&gt; cb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display the refresh related data.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition().Universe(&quot;EUR=&quot;)\n                                 .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;DSPLY_NAME&quot;)\n                                 .GetStream();\n                                 \nstream.OnRefresh((item, refresh, s) =&gt; Console.WriteLine($&quot;Refresh for item {item}: {refresh[&quot;Fields&quot;]}&quot;))\n      .Open() == Stream.State.Opened\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/on-status","title":"OnStatus","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onstatus\">OnStatus</h1>\n<p>Optional callback invoked when a EventCode event occurs on the streaming service.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IPricingStream OnStatus(Action&lt;string, JObject, IPricingStream&gt; statusCb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display messages received when the stream status is successfully received:</p>\n<pre><code class=\"language-csharp\">\nvar stream = Pricing.Definition().Universe(&quot;EUR=&quot;)\n                                 .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;DSPLY_NAME&quot;)\n                                 .GetStream();\n                                 \nstream.OnStatus((item, status, s) =&gt; Console.WriteLine($&quot;Status for item: {item}: {status}&quot;))\n      .Open() == Stream.State.Opened\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/on-update","title":"OnUpdate","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"onupdate\">OnUpdate</h1>\n<p>Optional callback invoked upon receiving an Update message containing the fields.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IPricingStream OnUpdate(Action&lt;string, JObject, IPricingStream&gt; cb)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to display messages received when the stream is updated</p>\n<pre><code class=\"language-csharp\">\nvar stream = Pricing.Definition().Universe(&quot;EUR=&quot;)\n                                 .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;DSPLY_NAME&quot;)\n                                 .GetStream();\n                                 \nstream.OnUpdate((item, update, s) =&gt; Console.WriteLine($&quot;Update for item {item}: {update[&quot;Fields&quot;][&quot;DSPLY_NAME&quot;]}&quot;))\n      .Open() == Stream.State.Opened\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/open","title":"Open","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"open\">Open</h1>\n<p>Allows you to open the Pricing connection by sending corresponding requests for all requested instruments.\nIt will be opened once all the requested instruments are received either a <a href=\"../events.md\">Refresh</a> or a <a href=\"../events.md\">Status</a> event.\nThen the <strong>Pricing.Stream</strong> can be used in order to retrieve data.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Stream.State Open(CancellationToken cancellationToken = default)</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p>A <code>Stream.State</code> value indicating if the stream opened. </p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create and open a pricing stream.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition(&quot;EUR=&quot;).GetStream();\n\nvar streamState = stream.Open();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/remove-items","title":"RemoveItems","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"removeitems\">RemoveItems</h1>\n<p>Allows to remove item(s) to the stream, even when the stream has been already opened. </p>\n<p>The item(s) will automatically close. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>void RemoveItems(params string[] items)</code>\n<code>void RemoveItems(IEnumerable&lt;string&gt; items)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to remove items to a pricing stream.</p>\n<pre><code class=\"language-csharp\">var stream = Pricing.Definition().Fields(&quot;DSPLY_NAME&quot;, &quot;BID&quot;, &quot;ASK&quot;);\n\nstream.Open();\n\n// Add a list of items\nstream.AddItems(new[] { &quot;EUR=&quot;, &quot;GBP=&quot;, &quot;CAD=&quot; }); \n\n// Remove one - GBP=\nstream.RemoveItems(&quot;GBP=&quot;);\n\nstream.Close();\n</code></pre>\n"},{"location":"./sections/content-layer/streams/methods/streaming","title":"Streaming","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"streaming\">Streaming</h1>\n<p>Specify whether the stream will retrieve the initial data followed by inserts and updates.  <br>\nA value of <strong>false</strong> implies no streaming and that only the initial data will be delivered. This is commonly referred to as a <strong>snapshot</strong>.<br>\nA value of <strong>true</strong> implies that there will be streaming updates incoming on the <strong>OnRefresh</strong> and <strong>OnUpdate</strong> callbacks. </p>\n<p>The default is <strong>true</strong>. </p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IPricingStream Streaming(bool streaming)</code></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to disable streaming updates for a pricing stream.</p>\n<pre><code class=\"language-csharp\">var snapshotStream = Pricing.Definition(&quot;CAD=&quot;)\n                            .Fields(&quot;BID&quot;, &quot;ASK&quot;, &quot;DSPLY_NAME&quot;)\n                            .GetStream()\n                            .Streaming(false);\n\nsnapshotStream.Open();\n\nvar result = snapshotStream[&quot;CAD=&quot;];\n</code></pre>\n"},{"location":"./sections/content-layer/pricing/streams/state","title":"StreamState","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"pricing-stream-states\">Pricing stream states</h1>\n<p>The list of Pricing stream states:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>State.Pending</td>\n<td>The stream is waiting to be opened or is closed.</td>\n</tr>\n<tr>\n<td>State.Opened</td>\n<td>The stream is open and ready to work.</td>\n</tr>\n<tr>\n<td>State.Closed</td>\n<td>The stream is closed.</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/response","title":"Response","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"content-layer-response\">Content layer response</h1>\n<p>Typical content layer response. Returns as the result of successful response from Data Platform.</p>\n<h3 id=\"contentresponse-parameters\">ContentResponse Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>raw</td>\n<td>Response json data from platform.</td>\n</tr>\n<tr>\n<td>table</td>\n<td>Response data provided as table (if applicable).</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/search/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-search\">About Search</h1>\n<p><strong>Search</strong> content objects give your application an easy access to the LSEG Search API that is powered by a Google-like <strong>search engine</strong> covering content such as</p>\n<ul>\n<li>quotes,</li>\n<li>instruments,</li>\n<li>organizations and many other assets. </li>\n</ul>\n<h3 id=\"related-links\">Related Links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/search/search\">Search</a></li>\n<li><a href=\"#/sections/content-layer/search/lookup\">Lookup</a></li>\n<li><a href=\"#/sections/content-layer/search/meta\">Metadata</a></li>\n<li><a href=\"#/sections/content-layer/search/views\">Views Options</a></li>\n</ul>\n"},{"location":"./sections/content-layer/search/lookup","title":"LookupDefinition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"lookupdefinition\">LookupDefinition</h1>\n<p> The lookup service is a convenient, reasonably efficient way to find a single best match for each of a list of symbol terms in a given symbology.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>ILookupDefinition Definition(string terms) =&gt; new LookupDefinition(terms)</code><br>\n<code>ILookupDefinition Definition() =&gt; new LookupDefinition()</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ILookupDefinition</code> object.</p>\n<h3 id=\"lookupdefinition-methods\">LookupDefinition Methods</h3>\n<p><strong>ILookupDefinition View(Search.View view)</strong><br>\nThe supported View to search against the full service.<br>\nThe view parameter is optional. Default: Search.LightView.SearchAllLight</p>\n<p><strong>ILookupDefinition View(Search.LightView view)</strong><br>\nThe supported View to search against the light service.<br>\nThe view parameter is optional. Default: Search.LightView.SearchAllLight</p>\n<p> <strong>ILookupDefinition Terms(string terms)</strong><br>\n A string of terms defining the symbols to be resolved.</p>\n<p> <strong>ILookupDefinition Scope(string scope)</strong><br>\n Identifies the symbology which Terms belong to.<br>\n Optional.  Default: &quot;_AllUnique&quot; (full service), &quot;RIC&quot; (light service)</p>\n<p> <strong>ILookupDefinition Select(string select)</strong><br>\n A comma-separated list of the properties of a document to be returned in the response.<br>\n Optional.  Default: &#39;_&#39; (same as main Search service)</p>\n<p> <strong>ILookupDefinition Filter(string filter)</strong><br>\n Filter values are boolean predicate expressions to be applied to documents.  Required.</p>\n<p> <strong>ILookupDefinition Boost(string boost)</strong><br>\n Boost applies a scoring boost to  matched documents, which will almost always guarantee that they appear at the top of the results.  <br>\n Boost supports exactly the same predicate expression syntax as Filter, except Filter restricts which documents are matched.</p>\n<p> <strong>ILookupDefinition Closure(object closure)</strong><br>\n Optionally, include a user-defined Closure to match specific requests and responses.</p>\n<p> <strong>ILookupDefinition ExtendedParams(JObject extendedParams)</strong><br>\n Apply any properties that are not available within this request interface. The extended params act as a fallback in case properties are unavailable, or as an alternative for users that prefer to define the request using native JSON definitions.  Optional.</p>\n<p> <strong>ILookupDefinitionParams Properties { get; }</strong><br>\n Gets the properties describing the values within the defined request (<code>View</code>, <code>LightView</code>, <code>Terms</code>, <code>Scope</code>, <code>Select</code>, <code>Filter</code>, <code>Boost</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>ILookupResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>ILookupResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>ILookupResponse GetData(Action&lt;ILookupResponse, ILookupDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>ILookupResponse GetData(ISession session, Action&lt;ILookupResponse, ILookupDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nSynchronously retrieve the lookup results from the backend service.</p>\n<p><strong>Task&lt;ILookupResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ILookupResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ILookupResponse&gt; GetDataAsync(Action&lt;ILookupResponse, ILookupDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ILookupResponse&gt; GetDataAsync(ISession session, Action&lt;ILookupResponse, ILookupDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the lookup results from the backend service.</p>\n<h3 id=\"response\">Response</h3>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>ILookupResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>ILookupData</strong> type.</p>\n<h3 id=\"ilookupdata---properties\">ILookupData - properties</h3>\n<p>IDictionary&lt;string, JObject&gt; Matches { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;string&gt; Warnings { get; }<br>\nJObject Raw { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>Below we have a provided a code snippet containing several search cases</p>\n<pre><code class=\"language-csharp\">// RICs - convert to all known symbol types using default output\nvar lookup = Lookup.Definition()\n                    .View(Search.View.SearchAll)\n                    .Terms(&quot;VOD.L,037833100,IBM,US5949181045&quot;)\n                    .GetData();\n\n// RICs - convert to all known symbol types using targeted output\nlookup = Lookup.Definition()\n               .View(Search.View.SearchAll)\n               .Terms(&quot;VOD.L,037833100,IBM,US5949181045&quot;)\n               .Select(&quot;DocumentTitle, CUSIP, SEDOL, RIC, TickerSymbol, IssueISIN, IssuerOAPermID, FundClassLipperID&quot;)\n               .GetData();\n\n// RICs - convert RICs with default output\nlookup = Lookup.Definition()\n               .Terms(&quot;VOD.L,AAPL.O,IBM,MSFT.O&quot;)\n               .Scope(&quot;RIC&quot;)\n               .GetData();\n\n// RICs - convert to all known symbol types using targeted output\nlookup = Lookup.Definition()\n               .Terms(&quot;VOD.L,AAPL.O,IBM,MSFT.O&quot;)\n               .Scope(&quot;RIC&quot;)\n               .Select(&quot;DocumentTitle,CUSIP,SEDOL,RIC,TickerSymbol,IssueISIN,IssuerOAPermID,FundClassLipperID&quot;)\n               .GetData();\n\n// CUSIPs - convert to all known symbol types using targeted output\nlookup = Lookup.Definition()\n               .Terms(&quot;037833100,459200101,594918104&quot;)\n               .Scope(&quot;CUSIP&quot;)\n               .Select(&quot;DocumentTitle,SEDOL,RIC,TickerSymbol,IssueISIN,IssuerOAPermID,FundClassLipperID&quot;)\n               .GetData();\n\n// Invalid request - Scope must be defined\nlookup = Lookup.Definition()\n               .Terms(&quot;037833100,459200101,594918104&quot;)\n               .Select(&quot;DocumentTitle,SEDOL,RIC,TickerSymbol,IssueISIN,IssuerOAPermID,FundClassLipperID&quot;)\n               .GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/search/meta","title":"MetaDataDefinition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"metadata\">MetaData</h1>\n<p>The Metadata interface supports the Search service by providing the available properties defined within the data universe.<br>\nMetadata returns a list of properties, based on the specified view, that outlines specific capabilities for each.<br>\nThe capabilities are relevant when choosing specific search parameters such as selecting, filtering, naviagating, grouping, etc.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>IMetaDataDefinition Definition(Search.ExploreView view = Search.ExploreView.Entities)</code><br>\n<code>IMetaDataDefinition Definition(Search.View view)</code><br>\n<code>IMetaDataDefinition Definition(Search.LightView view)</code></p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IMetaDataDefinition</code> object.</p>\n<h3 id=\"metadatadefinition-methods\">MetaDataDefinition Methods</h3>\n<p><strong>IMetaDataDefinition View(Search.ExploreView view)</strong><br>\nThe supported View to search against the explore services.<br>\nThe view is optional. Default: Search.ExploreView.Entities.</p>\n<p><strong>IMetaDataDefinition View(Search.View view)</strong><br>\nThe supported View to search against the full services.<br>\nThe view is optional. Default: Search.ExploreView.Entities.</p>\n<p><strong>IMetaDataDefinition View(Search.LightView view)</strong><br>\nThe supported View to search against the light service.<br>\nThe view is optional. Default: Search.ExploreView.Entities.</p>\n<p><strong>IMetaDataDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>IMetaDataDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface. The extended params act as a fallback in case properties are unavailable, or as an alternative for users that prefer to define the request using native JSON definitions.  Optional.</p>\n<p><strong>IMetaDataDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>View</code>, <code>LightView</code>, <code>ExploreView</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>IMetaDataResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>IMetaDataResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>IMetaDataResponse GetData(Action&lt;IMetaDataResponse, IMetaDataDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>IMetaDataResponse GetData(ISession session, Action&lt;IMetaDataResponse, IMetaDataDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nSynchronously retrieve the metadata from the backend service.</p>\n<p><strong>Task&lt;IMetaDataResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IMetaDataResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IMetaDataResponse&gt; GetDataAsync(Action&lt;IMetaDataResponse, IMetaDataDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;IMetaDataResponse&gt; GetDataAsync(ISession session, Action&lt;IMetaDataResponse, IMetaDataDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the metadata from the backend service.</p>\n<h3 id=\"response\">Response</h3>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>IMetaDataResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>IMetaDataProperties</strong> type.</p>\n<h3 id=\"imetadataproperties---properties\">IMetaDataProperties - properties</h3>\n<p>DataTable Table { get; }<br>\nJObject Raw { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>Below we have a provided a code snippet containing several search cases</p>\n<pre><code class=\"language-csharp\">// Get government corporation instrument metadata and select some specific table data\nvar response = MetaData.Definition(Search.View.GovCorpInstruments).GetData();\nif (response.IsSuccess)\n{\n    var table = response.Data.Table;\n\n    // Search for a specific property\n    var result = table.Select(&quot;Property = &#39;RCSAssetCategory&#39;&quot;);\n    Console.WriteLine($&quot;Property {result[0][&quot;Property&quot;]}:&quot;);\n    Console.WriteLine($&quot;Navigable: {result[0][&quot;Navigable&quot;]}&quot;);\n    Console.WriteLine($&quot;Sortable: {result[0][&quot;Sortable&quot;]}&quot;);\n\n    result = table.Select(&quot;Property = &#39;RCSCountryGenealogy&#39;&quot;);  \n    Console.WriteLine($&quot;Property {result[0][&quot;Property&quot;]}:&quot;);\n    Console.WriteLine($&quot;Navigable: {result[0][&quot;Navigable&quot;]}&quot;);\n    Console.WriteLine($&quot;Sortable: {result[0][&quot;Sortable&quot;]}&quot;);  \n\n    result = table.Select(&quot;Property = &#39;SPsRatingsScope.CurrentRatingRank&#39;&quot;);\n    Console.WriteLine($&quot;Property {result[0][&quot;Property&quot;]}:&quot;);\n    Console.WriteLine($&quot;Navigable: {result[0][&quot;Navigable&quot;]}&quot;);\n    Console.WriteLine($&quot;Sortable: {result[0][&quot;Sortable&quot;]}&quot;);\n\n    // Search for a specific nested property and all its sub properties\n    result = table.Select(&quot;Property LIKE &#39;RatingsScope.*&#39;&quot;);\n }\n\n // Do a similar search using a light view \nvar response2 = MetaData.Definition(Search.LightView.GovCorpInstruments).GetData();\n</code></pre>\n"},{"location":"./sections/content-layer/search/search","title":"SearchDefinition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"searchdefinition\">SearchDefinition</h1>\n<p>Defines a Search request to idenfity a matching set of documents which satisfy a criteria, sorts it, and selects a subset of the matches to return as the result set. Each step can be controlled via parameters.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>ISearchDefinition Definition(ExploreView view = ExploreView.Entities)</code><br>\n<code>ISearchDefinition Definition(View view)</code><br>\n<code>ISearchDefinition Definition(LightView view)</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th align=\"left\"><strong>Data type</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>view</td>\n<td>A value representing the type of View the Search service shoudl use</td>\n<td align=\"left\">enum</td>\n</tr>\n</tbody></table>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ISearchDefinition</code> object.</p>\n<h3 id=\"searchdefinition-methods\">SearchDefinition Methods</h3>\n<p><strong>ISearchDefinition View(Search.ExploreView view)</strong><br>\nThe supported View to search against the explore services.<br>\nThe view is optional. Default: Search.ExploreView.Entities.</p>\n<p><strong>ISearchDefinition View(Search.View view)</strong><br>\nThe supported View to search against the full services.<br>\nThe view is optional. Default: Search.ExploreView.Entities.</p>\n<p><strong>ISearchDefinition View(Search.LightView view)</strong><br>\nThe supported View to search against the light service.<br>\nThe view is optional. Default: Search.ExploreView.Entities.</p>\n<p><strong>ISearchDefinition Query(string query)</strong><br>\nThe query expression defining freeform entry of search terms.</p>\n<p><strong>ISearchDefinition Filter(string filter)</strong><br>\nFilter expression supports structured predicate expressions.</p>\n<p><strong>ISearchDefinition Select(string select)</strong><br>\nA comma-separated list of the properties of a document to be returned in the response.</p>\n<p><strong>ISearchDefinition Boost(string boost)</strong><br>\nBoost applies a scoring boost to documents it matches, which will almost always guarantee that they appear at the top of the results. <br>\nBoost supports exactly the same predicate expression syntax as Filter, except Filter restricts which documents are matched.</p>\n<p><strong>ISearchDefinition OrderBy(string order)</strong><br>\nDefines the order in which matching documents should be returned. Default is by score descending.</p>\n<p><strong>ISearchDefinition GroupBy(string group)</strong><br>\nReturned documents are grouped into buckets based on their value for this property.</p>\n<p><strong>ISearchDefinition GroupCount(uint count)</strong><br>\nWhen supplied in combination with GroupBy, sets the maximum number of documents to be returned per bucket.</p>\n<p><strong>ISearchDefinition Top(uint top)</strong><br>\nThe maximum number of documents to retrieve. Default is 10. Must be non-negative. <br>\nA value of 0 returns no hits but sets the Total based on matches.</p>\n<p><strong>ISearchDefinition Skip(uint skip)</strong><br>\nThe number of documents to skip in the sorted result set before returning the next Top.</p>\n<p><strong>ISearchDefinition Navigators(string navigators)</strong><br>\nThis can name one or more properties, separated by commas, each of which must be Navigable.</p>\n<p><strong>ISearchDefinition Features(string features)</strong><br>\nThis can name one or more properties, separated by commas, each of which must be Navigable.</p>\n<p><strong>ISearchDefinition Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ISearchDefinition ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface. The extended params act as a fallback in case properties are unavailable, or as an alternative for users that prefer to define the request using native JSON definitions.  Optional.</p>\n<p><strong>ISearchDefinitionParams Properties { get; }</strong><br>\nGets the properties describing the values within the defined request (<code>View</code>, <code>LightView</code>, <code>Query</code>, <code>Filter</code>, <code>Select</code>, <code>Boost</code>, <code>OrderBy</code>, <code>GroupBy</code>, <code>GroupCount</code>, <code>Top</code>, <code>Skip</code>, <code>Navigators</code>, <code>Features</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>ISearchResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>ISearchResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>ISearchResponse GetData(Action&lt;ISearchResponse, ISearchDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>ISearchResponse GetData(ISession session, Action&lt;ISearchResponse, ISearchDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nSynchronously retrieve the search results from the backend service.</p>\n<p><strong>Task&lt;ISearchResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ISearchResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ISearchResponse&gt; GetDataAsync(Action&lt;ISearchResponse, ISearchDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ISearchResponse&gt; GetDataAsync(ISession session, Action&lt;ISearchResponse, ISearchDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the search results from the backend service.</p>\n<h3 id=\"response\">Response</h3>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>ISearchResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>ISearchData</strong> type.</p>\n<h3 id=\"isearchdata---properties\">ISearchData - properties</h3>\n<p>int? Total { get; }<br>\nIList&lt;JObject&gt; Hits { get; }<br>\nDataTable Table { get; }<br>\nJObject Navigators { get; }<br>\nIList&lt;string&gt; Warnings { get; }<br>\nJObject Raw { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>Below we have a provided a code snippet containing several search cases</p>\n<pre><code class=\"language-csharp\">// Search for Top CEOs where Apple appears in the document - Display DocumentTitle and its subtype/components.\n// Note: Include an invalid property not related to people (BondType)\nvar request = Search.Definition()\n                    .View(Search.View.SearchAll)\n                    .Query(&quot;CEO Apple&quot;)\n                    .Select(&quot;DocumentTitle, DTSubjectName, BondType, DTSimpleType, DTCharacteristics&quot;);\n\n// Invalid request - ShortName can&#39;t be used in startswith function because it doesn&#39;t support the\n// &#39;Exact&#39; match capability.\nrequest = Search.Definition(Search.View.Organisations)\n                .Filter(&quot;startswith(ShortName,&#39;H&#39;)&quot;);\n\n// Search for past and present executives within Apple Inc.\nrequest = Search.Definition(Search.View.People)\n                .Filter(&quot;OfficerDirector(CompanyId eq &#39;4295905573&#39;)&quot;)\n                .Top(30)\n                .Select(&quot;FullName, YearOfBirth, PrimaryTitleAsReported&quot;);\n\n\n// Search for all the RICs where &#39;LSE&#39; is in the name, exclude all derivatives and ensure the state is active (AC)\nrequest = Search.Definition(Search.View.Quotes)\n                .Filter(&quot;TickerSymbol eq &#39;LSE&#39; and AssetType ne &#39;derivative&#39; and AssetState eq &#39;AC&#39;&quot;)\n                .Select(&quot;AssetState, DTSubjectName, DTSimpleType, DTSource, DTCharacteristics, RIC, SearchAllCategoryv3, AssetType&quot;);\n\n// Oil refineries in Venezula, Especially ones that arzen&#39;t currently operational (Boost plant status).\nrequest = Search.Definition(Search.View.PhysicalAssets)\n                .Filter(&quot;RCSAssetTypeLeaf eq &#39;oil refinery&#39; and RCSRegionLeaf eq &#39;Venezuela&#39;&quot;)\n                .Boost(&quot;PlantStatus ne &#39;Normal Operation&#39;&quot;)\n                .Select(&quot;DocumentTitle, PlantStatus&quot;)\n                .Top(100);\n\n// The youngest CEO&#39;s\nrequest = Search.Definition(Search.View.People)\n                .Query(&quot;ceo&quot;)\n                .OrderBy(&quot;YearOfBirth desc,LastName,FirstName&quot;)\n                .Select(&quot;YearOfBirth, name&quot;); \n\n// Top currencies for Gov Corp Bonds\nrequest = Search.Definition(Search.View.GovCorpInstruments)\n                .Top(0)\n                .Navigators(&quot;Currency(buckets:5,desc:sum_FaceOutstandingUSD,calc:max_CouponRate)&quot;);\n\n// Top 2 rate indicators for each central bank\nrequest = Search.Definition(Search.View.IndicatorQuotes)\n                .Query(&quot;rates&quot;)\n                .GroupBy(&quot;CentralBankName&quot;)\n                .GroupCount(2)\n                .Select(&quot;CentralBankName,DocumentTitle,RIC&quot;);\n\n// Top 10 Gov Corp instruments for specific range of coupon rates and ratings.\n// Note: &quot;_&quot; in Select means to include default fields.\nvar filter = &quot;RatingsScope(RatingType eq &#39;MBU&#39;) and AssetState eq &#39;AC&#39;&quot;;\nrequest = Search.Definition(Search.View.GovCorpInstruments)\n                .Top(10)\n                .Filter(filter)\n                .Select(&quot;_, RatingsScope(filter:((RatingType xeq &#39;MBU&#39;))), RatingX1XRatingRank&quot;);\n\n// Use _debugall as a tool to inspect all available Properties for a given search\nrequest = Search.Definition(Search.View.SearchAll)\n                .Query(&quot;CFO IBM&quot;)\n                .Top(1)\n                .Select(&quot;_debugall&quot;);\n\n// Search for all the RICs where &#39;LSE&#39; is in the name, exclude all derivatives and ensure the state is active (AC)\nrequest = Search.Definition()\n                .View(Search.LightView.EquityQuotes)\n                .Filter(&quot;TickerSymbol eq &#39;LSE&#39; and AssetType ne &#39;derivative&#39; and AssetState eq &#39;AC&#39;&quot;)\n                .Select(&quot;DocumentTitle, AssetState, RIC, SearchAllCategoryv3, AssetType&quot;);\n\nrequest = Search.Definition()\n                .View(Search.LightView.SearchAllLight)\n                .Filter(&quot;IssuerName eq &#39;US Treasury&#39; and Currency eq &#39;USD&#39; and SearchAllCategoryv3 eq &#39;Bonds&#39; and IsActive eq true&quot;)\n                .Select(&quot;RIC,ISIN,IssuerName,MaturityDate,CouponRate&quot;);\n\n// Top currencies for Gov Corp Bonds\nrequest = Search.Definition(Search.LightView.GovCorpInstruments)\n                .Top(0)\n                .Navigators(&quot;Currency(buckets:5,calc:max_CouponRate)&quot;);\n\n// Top 2 rate indicators for each central bank\nrequest = Search.Definition(Search.LightView.IndicatorQuotes)\n                .Query(&quot;rates&quot;)\n                .GroupCount(2)\n                .Select(&quot;DocumentTitle,RIC&quot;);\n\n// Find any data on Bill Gates\nrequest = Search.Definition(Search.LightView.SearchAllLight)\n                .Query(&quot;Bill Gates&quot;);\n</code></pre>\n<h3 id=\"related-links\">Related Links</h3>\n<ul>\n<li><a href=\"#/sections/content-layer/search/views\">Search Views</a></li>\n</ul>\n"},{"location":"./sections/content-layer/search/views","title":"Search View","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"searchview\">Search.View</h1>\n<p>The list of predefined Search Views that can be used with the LSEG Search API.</p>\n<br>\nThe list of supported Views defined within the **Explore service**.\n\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ExploreView.Entities</td>\n<td>&quot;Entities&quot;</td>\n</tr>\n<tr>\n<td>ExploreView.CatalogItems</td>\n<td>&quot;CatalogItems&quot;</td>\n</tr>\n</tbody></table>\n<br>\nThe list of supported Views full the **full search service**.\n\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>View.BondFutOptQuotes</td>\n<td>&quot;BondFutOptQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.CdsInstruments</td>\n<td>&quot;CdsInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.CdsQuotes</td>\n<td>&quot;CdsQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.CmoInstruments</td>\n<td>&quot;CmoInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.CmoQuotes</td>\n<td>&quot;CmoQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.CommodityQuotes</td>\n<td>&quot;CommodityQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.DealsMergersAndAcquisitions</td>\n<td>&quot;DealsMergersAndAcquisitions&quot;</td>\n</tr>\n<tr>\n<td>View.DerivativeInstruments</td>\n<td>&quot;DerivativeInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.DerivativeQuotes</td>\n<td>&quot;DerivativeQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.EquityDerivativeInstruments</td>\n<td>&quot;EquityDerivativeInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.EquityDerivativeQuotes</td>\n<td>&quot;EquityDerivativeQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.EquityInstruments</td>\n<td>&quot;EquityInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.EquityQuotes</td>\n<td>&quot;EquityQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.FixedIncomeInstruments</td>\n<td>&quot;FixedIncomeInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.FixedIncomeQuotes</td>\n<td>&quot;FixedIncomeQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.FundQuotes</td>\n<td>&quot;FundQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.GovCorpInstruments</td>\n<td>&quot;GovCorpInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.GovCorpQuotes</td>\n<td>&quot;GovCorpQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.IndexInstruments</td>\n<td>&quot;IndexInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.IndexQuotes</td>\n<td>&quot;IndexQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.IndicatorQuotes</td>\n<td>&quot;IndicatorQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.Instruments</td>\n<td>&quot;Instruments&quot;</td>\n</tr>\n<tr>\n<td>View.IRDQuotes</td>\n<td>&quot;IRDQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.LoanInstruments</td>\n<td>&quot;LoanInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.LoanQuotes</td>\n<td>&quot;LoanQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.MoneyQuotes</td>\n<td>&quot;MoneyQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.MortgageInstruments</td>\n<td>&quot;MortgageInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.MortQuotes</td>\n<td>&quot;MortQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.MunicipalInstruments</td>\n<td>&quot;MunicipalInstruments&quot;</td>\n</tr>\n<tr>\n<td>View.MunicipalQuotes</td>\n<td>&quot;MunicipalQuotes&quot;</td>\n</tr>\n<tr>\n<td>View.Organisations</td>\n<td>&quot;Organisations&quot;</td>\n</tr>\n<tr>\n<td>View.People</td>\n<td>&quot;People&quot;</td>\n</tr>\n<tr>\n<td>View.PhysicalAssets</td>\n<td>&quot;PhysicalAssets&quot;</td>\n</tr>\n<tr>\n<td>View.Quotes</td>\n<td>&quot;Quotes&quot;</td>\n</tr>\n<tr>\n<td>View.QuotesAndSTIRs</td>\n<td>&quot;QuotesAndSTIRs&quot;</td>\n</tr>\n<tr>\n<td>View.SearchAll</td>\n<td>&quot;SearchAll&quot;</td>\n</tr>\n<tr>\n<td>View.STIRs</td>\n<td>&quot;STIRs&quot;</td>\n</tr>\n<tr>\n<td>View.VesselPhysicalAssets</td>\n<td>&quot;VesselPhysicalAssets&quot;</td>\n</tr>\n<tr>\n<td>View.YieldCurveContQuotes</td>\n<td>&quot;YieldCurveContQuotes&quot;</td>\n</tr>\n</tbody></table>\n<br>\nThe list of supported Views defined within the **search light service**.\n\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>LightView.CommodityQuotes</td>\n<td>&quot;CommodityQuotes&quot;</td>\n</tr>\n<tr>\n<td>LightView.EquityDerivativeQuotes</td>\n<td>&quot;EquityDerivativeQuotes&quot;</td>\n</tr>\n<tr>\n<td>LightView.EquityQuotes</td>\n<td>&quot;EquityQuotes&quot;</td>\n</tr>\n<tr>\n<td>LightView.FundQuotes</td>\n<td>&quot;FundQuotes&quot;</td>\n</tr>\n<tr>\n<td>LightView.GovCorpInstruments</td>\n<td>&quot;GovCorpInstruments&quot;</td>\n</tr>\n<tr>\n<td>LightView.IndexInstruments</td>\n<td>&quot;IndexInstruments&quot;</td>\n</tr>\n<tr>\n<td>LightView.IndicatorQuotes</td>\n<td>&quot;IndicatorQuotes&quot;</td>\n</tr>\n<tr>\n<td>LightView.Organisations</td>\n<td>&quot;Organisations&quot;</td>\n</tr>\n<tr>\n<td>LightView.SearchAllLight</td>\n<td>&quot;SearchAllLight&quot;</td>\n</tr>\n<tr>\n<td>LightView.STIRs</td>\n<td>&quot;STIRs&quot;</td>\n</tr>\n</tbody></table>\n"},{"location":"./sections/content-layer/symbol-conversion/definition","title":"SymbolConversionDefinition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"symbolconversiondefinition\">SymbolConversionDefinition</h1>\n<p>This definition is used to retrieve data from the Search/Lookup API of the Delivery Platform (formerly Refinitiv Data Platform).</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>SymbolConversion.Definition(params string[] symbols)</code><br>\n<code>SymbolConversion.Definition(IEnumerable&lt;string&gt; symbols)</code></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>Optional</strong></th>\n<th align=\"left\"><strong>Default value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>symbols</td>\n<td>One or more instruments for which we want to retrieve symbols</td>\n<td>No</td>\n<td align=\"left\">-</td>\n</tr>\n</tbody></table>\n<h3 id=\"symbol-types\">Symbol Types</h3>\n<p>The following is a table of supported symbol types that an instrument could have and that can also be used to request symbol data. </p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>RIC</td>\n<td>Reuters Instrument Code.</td>\n</tr>\n<tr>\n<td>ISIN</td>\n<td>International Securities Identification Number.</td>\n</tr>\n<tr>\n<td>CUSIP</td>\n<td>Committee on Uniform Securities Identification Procedures.  A unique ID used in the U.S and Canada.</td>\n</tr>\n<tr>\n<td>SEDOL</td>\n<td>Stock Exchange Daily Official List.  A seven digit identifier traded on the LSE and other small exchanges across the UK.</td>\n</tr>\n<tr>\n<td>Ticker</td>\n<td>The unique Ticker symbol.</td>\n</tr>\n<tr>\n<td>PermID</td>\n<td>A Permanent Identfier uniquely indentifying an asset.</td>\n</tr>\n<tr>\n<td>LipperID</td>\n<td>LSEG&#39;s Lipper ID.</td>\n</tr>\n<tr>\n<td>ANY</td>\n<td>Any of the defined symbol types.  Note: Only supported when using the full service.</td>\n</tr>\n</tbody></table>\n<h3 id=\"symbolconversiondefinition-methods\">SymbolConversionDefinition Methods</h3>\n<p><strong>Symbols(params string[] symbols)</strong><br>\n<strong>Symbols(IEnumerable<string> symbols)</strong><br>\nDefine a list of symbols to convert.</p>\n<p><strong>FromSymbolType(SymbolConversion.SymbolType type)</strong><br>\nDefines the type of symbols specified within the Symbol specification.<br>  Optional.  Default: SymbolType.ANY.</p>\n<p><strong>ToSymbolType(params SymbolConversion.SymbolType[] types)</strong><br>\n<strong>ToSymbolType(IEnumerable&lt;SymbolConversion.SymbolType&gt; types)</strong><br>\nDefines the types to convert to.  Optional.  Default: All SymbolTypes.</p>\n<p><strong>Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>ExtendedParams(JObject extendedParams)</strong><br>\nApply any properties that are not available within this request interface. The extended params act as a fallback in case properties are unavailable, or as an alternative for users that prefer to define the request using native JSON definitions.  Optional.</p>\n<p><strong>Properties { get; }</strong><br>\nGets the <code>ISymbolConvertDefinitionParams</code> describing the values within the defined request (<code>Symbols</code>, <code>FromSymbolType</code>, <code>ToSymbolType</code>, <code>Closure</code>, <code>ExtendedParams</code>).</p>\n<h3 id=\"retrieving-data\">Retrieving data</h3>\n<p><strong>ISymbolConversionResponse GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>ISymbolConversionResponse GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>ISymbolConversionResponse GetData(Action&lt;ISymbolConversionResponse, ISymbolConvertDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>ISymbolConversionResponse GetData(ISession session, Action&lt;ISymbolConversionResponse, ISymbolConvertDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nSynchronously retrieve the conversion results from the backend service.</p>\n<p><strong>Task&lt;ISymbolConversionResponse&gt; GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ISymbolConversionResponse&gt; GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ISymbolConversionResponse&gt; GetDataAsync(Action&lt;ISymbolConversionResponse, ISymbolConvertDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>Task&lt;ISymbolConversionResponse&gt; GetDataAsync(ISession session, Action&lt;ISymbolConversionResponse, ISymbolConvertDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronously retrieve the conversion results from the backend service.</p>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>ISymbolConversionDefinition</code> object.</p>\n<p>When requesting data using the <code>GetData</code>/<code>GetDataAsync</code> methods, we receive an <strong>ISymbolConversionResponse</strong> object (implements <code>IResponse</code>). The response object contains a &quot;<strong>Data</strong>&quot; property of <strong>ISymbolConversionData</strong> type.</p>\n<h3 id=\"isymbolconversiondata---properties\">ISymbolConversionData - properties</h3>\n<p>IDictionary&lt;string, ISymbolConversionMatches&gt; Matches { get; }<br>\nDataTable Table { get; }<br>\nIList&lt;string&gt; Warnings { get; }<br>\nJObject Raw { get; }<br></p>\n<p>Each entry in <strong>Matches</strong> is an <strong>ISymbolConversionMatches</strong> whose properties are named after the symbol types listed above. If the instrument has a value for a given symbol type, the corresponding property is populated.</p>\n<h3 id=\"isymbolconversionmatches---properties\">ISymbolConversionMatches - properties</h3>\n<p>string Description { get; }<br>\nstring RIC { get; }<br>\nstring CUSIP { get; }<br>\nstring ISIN { get; }<br>\nstring SEDOL { get; }<br>\nstring PermID { get; }<br>\nstring LipperID { get; }<br>\nstring Ticker { get; }<br></p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates several use cases for symbol conversion.</p>\n<pre><code class=\"language-csharp\">using LSEG.Data.Content.Symbology;\nusing LSEG.Data.Core;\n\n // RIC conversion\n var response = SymbolConversion\n    .Definition()\n    .Symbols(&quot;IBM&quot;, &quot;AAPL.O&quot;, &quot;GOOGL.O&quot;, &quot;LP60000008&quot;)\n    .FromSymbolType(SymbolConversion.SymbolType.RIC)\n    .GetData();\n\n // PermID for private company.  \n // Note: data is available within Eikon but not within Search Lookup (RDP)\n var missingID = &quot;5050720719&quot;;\n response = SymbolConversion\n    .Definition(missingID)\n    .FromSymbolType(SymbolConversion.SymbolType.PermID)\n    .GetData();\n\n // ISINs - convert to all known symbol types\n response = SymbolConversion\n    .Definition(&quot;US5949181045&quot;, &quot;US02079K1079&quot;)\n    .FromSymbolType(SymbolConversion.SymbolType.ISIN)\n    .GetData();\n\n // ISINs - convert to RIC and Ticker only.  Include 1 bad ISIN.\n var symbols = new List&lt;string&gt;() { &quot;US5949181045&quot;, &quot;JUNK&quot;, &quot;US02079K1079&quot; };\n response = SymbolConversion\n    .Definition()\n    .Symbols(symbols)\n    .FromSymbolType(SymbolConversion.SymbolType.ISIN)\n    .ToSymbolType(SymbolConversion.SymbolType.RIC, SymbolConversion.SymbolType.Ticker)\n    .GetData();\n\n // SEDOL - convert to all known\n response = SymbolConversion\n    .Definition(&quot;BH4HKS3&quot;)\n    .FromSymbolType(SymbolConversion.SymbolType.SEDOL)\n    .GetData();\n\n // Detect the mixed asset list.\n response = SymbolConversion\n    .Definition(&quot;VOD.L&quot;, &quot;037833100&quot;, &quot;IBM&quot;, &quot;US5949181045&quot;, &quot;5030853586&quot;)\n    .GetData();\n</code></pre>\n<h4 id=\"the-responses-retrieved-also-contain-the-raw-json-data-\">The responses retrieved also contain the raw JSON data. <br></h4>\n<p>You can explore and create your own objects and map the retrieved data to them to fit your specific business needs.</p>\n"},{"location":"./sections/content-layer/symbol-conversion/intro","title":"Intro","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"about-symbolconversion\">About SymbolConversion</h1>\n<p>The <strong>SymbolConversion</strong> content object allows you to convert various types of symbols like RICs, ISINs, CUSIPs, and so on, using the Search/Lookup API of the Data Platform.</p>\n"},{"location":"./sections/delivery-layer/endpoint-request/definition","title":"Definition","description":"","layout":"default","language_tabs":[],"html":"<h1 id=\"deliveryendpointrequest-object\">Delivery.EndpointRequest object</h1>\n<p>This object defines the <strong>EndpointRequest</strong> with a url and other parameters.</p>\n<h3 id=\"syntax\">Syntax</h3>\n<p><code>Delivery.EndpointRequest.Definition()</code><br>\n<code>Delivery.EndpointRequest.Definition(string endpointUrl)</code><br>\n<code>Delivery.EndpointRequest.Definition(Uri endpointUrl)</code><br></p>\n<h3 id=\"parameters\">Parameters</h3>\n<table>\n<thead>\n<tr>\n<th><strong>Value</strong></th>\n<th><strong>Description</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>session</td>\n<td>The specific session. Eg: <strong>platform</strong>, <strong>desktop</strong></td>\n</tr>\n<tr>\n<td>api</td>\n<td>API stanza representing the data request. Eg: data.historical-pricing</td>\n</tr>\n<tr>\n<td>endpointUrl</td>\n<td>The specific endpoint within the API. Eg: interday-summaries</td>\n</tr>\n</tbody></table>\n<h3 id=\"methods\">Methods</h3>\n<p><strong>Url(string url)</strong><br>\nThe Url represents the address of the endpoint.</p>\n<p><strong>Uri(Uri uri)</strong><br>\nThe Uri represents the address of the endpoint.</p>\n<p><strong>Method(EndpointRequest.Method method)</strong><br>\nDefines the method of the request.  Valid methods are: GET, POST, PUT and DELETE.  Default: GET</p>\n<p><strong>QueryParameter(string key, string value)</strong><br>\nApply the specified key/value pair as a Query parameter to the URL.\nMultiple calls to the same &#39;key&#39; will be additive.<br>\nFor example, multiple calls to add a &#39;Universe&#39; parameter will create this: &quot;Universe=AAPL.O,IBM.N&quot;.<br></p>\n<p><strong>BodyParameter(string key, string value)</strong><br>\n<strong>BodyParameter(string key, int value)</strong><br>\n<strong>BodyParameter(string key, double value)</strong><br>\n<strong>BodyParameter(string key, bool value)</strong><br>\nApply the key/value pair to the Body of the URL request.<br>\nOnly applies to simple &#39;key: value&#39; elements at the root level of the message body.<br>\nMore complex objects should use the BodyParameters(json) interface. <br>\nMultiple calls to the same &#39;key&#39; will replace the value applied within the body.</p>\n<p><strong>HeaderParameter(string key, string value)</strong><br>\nApply the key/value pair to the Header section of the URL request. <br>\nMultiple calls to the same &#39;key&#39; will be additive. <br>\nFor example, multiple calls to add an &#39;Accept&#39; parameter can look like this: &quot;Accept: application/json, image/*&quot;.</p>\n<p><strong>PathParameter(string key, string value)</strong><br>\n<strong>PathParameter(string value)</strong><br>\nApply the key/value pair to the path template within the URL request. <br>\nThe URL will need to contain a path template containing the &#39;key&#39;. <br>\nFor example, &quot;/dataContent/version1/analytics/{year}/{month}/{day}/prices&quot;.<br>\nThe &#39;key&#39; values defined in this template are &#39;year&#39;, &#39;month&#39; and &#39;day. <br>\nUsing PathParameter(&#39;year&#39;, 2019) will result in: &#39;/dataContent/version1/analytics/2019/{month}/{day}/prices&#39;.</p>\n<p><strong>BodyParameters(JObject parameters, bool merge = false)</strong><br>\nApply the JSON object to the body of the request. <br>\nBy default, the parameters will overwrite any previous settings. <br>\nOptionally, the supplied parameters can be merged with the current body parameters settings.</p>\n<p><strong>Closure(object closure)</strong><br>\nOptionally, include a user-defined Closure to match specific requests and responses.</p>\n<p><strong>GetData(CancellationToken cancellationToken = default)</strong><br>\n<strong>GetData(Action&lt;IEndpointResponse, IEndpointDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetData(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetData(ISession session, Action&lt;IEndpointResponse, IEndpointDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nSend the request to the specific endpoint synchronously to retrieve the data. Returns an <code>IEndpointResponse</code>. When a session is not explicitly supplied, the default session is used.</p>\n<p><strong>GetDataAsync(CancellationToken cancellationToken = default)</strong><br>\n<strong>GetDataAsync(Action&lt;IEndpointResponse, IEndpointDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetDataAsync(ISession session, CancellationToken cancellationToken = default)</strong><br>\n<strong>GetDataAsync(ISession session, Action&lt;IEndpointResponse, IEndpointDefinitionParams, ISession&gt; cb, CancellationToken cancellationToken = default)</strong><br>\nAsynchronous equivalents of <code>GetData(...)</code>.</p>\n<p><strong>Properties</strong> <em>(property, <code>IEndpointDefinitionParams</code>)</em><br>\nRetrieve the parameters defined for the endpoint request.</p>\n<p>The possible values for the <strong>EndpointRequest.Method</strong>:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Name</strong></th>\n<th><strong>Value</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Method.GET</td>\n<td>&#39;GET&#39;</td>\n</tr>\n<tr>\n<td>Method.POST</td>\n<td>&#39;POST&#39;</td>\n</tr>\n<tr>\n<td>Method.PUT</td>\n<td>&#39;PUT&#39;</td>\n</tr>\n<tr>\n<td>Method.DELETE</td>\n<td>&#39;DELETE&#39;</td>\n</tr>\n</tbody></table>\n<h3 id=\"returned-value\">Returned value</h3>\n<p><code>IEndpointDefinition</code> object.</p>\n<h3 id=\"iendpointresponse-members\">IEndpointResponse members</h3>\n<p><code>GetData(...)</code>/<code>GetDataAsync(...)</code> return an <code>IEndpointResponse</code>, which extends the base <code>IResponse</code> interface.</p>\n<p><strong>Data</strong> <em>(property, <code>IEndpointData</code>)</em><br>\nThe data defined within the response, if available.</p>\n<p><strong>HttpHeaders</strong> <em>(property, <code>IResponse</code>, <code>JToken</code>)</em><br>\nThe HTTP Headers defined for the response from the platform.</p>\n<p><strong>HttpStatus</strong> <em>(property, <code>IResponse</code>, <code>JObject</code>)</em><br>\nThe Status carries the details of the response, whether successful or not. Details include HTTP codes and reason codes, if available.</p>\n<p><strong>IsSuccess</strong> <em>(property, <code>IResponse</code>, <code>bool</code>)</em><br>\nIndicator of whether the request was successful.</p>\n<h3 id=\"iendpointdata-members\">IEndpointData members</h3>\n<p><strong>ContentType</strong> <em>(property, <code>string</code>)</em><br>\nThe Type of Content as returned in the HTTP response.</p>\n<p><strong>Raw</strong> <em>(property, <code>JToken</code>)</em><br>\nThe native raw JSON data returned from the platform.</p>\n<h3 id=\"usage\">Usage</h3>\n<p>The following example demonstrates how to create an endpoint request definition and request data:</p>\n<pre><code class=\"language-csharp\">var symbolLookupEndpoint = &quot;https://api.refinitiv.com/discovery/symbology/v1/lookup&quot;;\n\nvar symbolRequest = new JObject()\n{\n    [&quot;from&quot;] = new JArray()\n    {\n        new JObject()\n        {\n            [&quot;identifierTypes&quot;] = new JArray(&quot;ExchangeTicker&quot;),\n            [&quot;values&quot;] = new JArray(&quot;IBM&quot;)\n        }\n    },\n    [&quot;to&quot;] = new JArray()\n    {\n        new JObject() { [&quot;identifierTypes&quot;] = new JArray(&quot;RIC&quot;) }\n    },\n    [&quot;type&quot;] = &quot;auto&quot;\n };\n\n  var response = EndpointRequest.Definition(symbolLookupEndpoint)\n                                .Method(EndpointRequest.Method.POST)\n                                .BodyParameters(symbolRequest)\n                                .GetData();\n</code></pre>\n<p>The following example demonstrates how to retrieve interday and intraday data using the request definition. <br>\nFor this specific examples the URI and its parameters are provided as a string to the definition.</p>\n<pre><code class=\"language-csharp\">var intradayEndpoint = &quot;https://api.refinitiv
